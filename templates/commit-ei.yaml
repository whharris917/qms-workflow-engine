id: commit-ei
prompt: Commit all changes and record the commit hash.
fields:
- name: task_description
  type: string
  parameter: false
  writable: false
  default: Commit and push all changes. Record the commit hash.
- name: commit_hash
  type: string
  writable: true
edge_templates:
- to: '{next}'
  condition: commit_hash!=
