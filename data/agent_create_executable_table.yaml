## Agent workflow definition: Create Executable Table
##
## Defines the executable table authoring workflow. The table structure
## (columns, rows, cells, properties) is managed by the runtime's table
## component. This YAML declares nodes, table operations, and the
## column type catalog.

workflow_title: Create Executable Table
workflow_description: Build a structured table with typed columns, acceptance criteria, and integrated execution.

nodes:
  construction:
    title: Table Construction
    instruction: |
      Build an executable table. Add columns to define the structure, then add rows and fill in cell values.

      Column types fall into three categories:
      - Non-executable (ne-): Filled now during construction, read-only during execution. Use for task descriptions, prerequisites, and other plan content.
      - Executable (ex-): Left empty now, filled during execution. Use for evidence, outcomes, signatures, and other execution artifacts.
      - Auto-executed (ae-): Evaluated automatically by the system during execution based on rules you define. Use for acceptance criteria.
    table:
      column_type_catalog: column_types
      properties:
        sequential_execution: {type: toggle, default: false}
      operations:
        - add_column
        - remove_column
        - rename_column
        - set_column_type
        - add_row
        - remove_row
        - set_cell
        - set_choices
        - set_rule
        - set_prerequisites
        - set_property
    proceed:
      label: Proceed to Review
      gate:
        op: AND
        conditions:
          - {type: table_has_columns}
          - {type: table_has_rows}

  review:
    title: Review
    instruction: |
      Review the complete table. Go back to make changes, or proceed to execution.
    navigation:
      - action: go_back
        label: Go back to Table Construction
    actions:
      - action: submit
        label: Proceed to Execution

  executing:
    title: Execution
    execution: true
    instruction: |
      Execute the table by filling cells, signing, and recording evidence.

      Work through rows in order if sequential execution is enabled. Each row's acceptance criteria are evaluated automatically. All acceptance criteria must pass to complete execution.
    navigation:
      - action: go_back
        label: Go back to Review

  done:
    title: Complete
    instruction: |
      All rows have passed acceptance criteria. You may go back to make corrections or start a new table.
    navigation:
      - action: go_back
        label: Go back to Execution
    actions:
      - action: restart
        label: Start a new Executable Table

column_types:
  ne-free-text:
    label: Free Text
    category: non-executable
    description: Plain text content, not executed.
  ne-prerequisite:
    label: Prerequisite
    category: non-executable
    description: References to rows that must complete before this row.
  ex-free-text:
    label: Free Text
    category: executable
    description: Free-form text filled during execution.
  ex-choice-list:
    label: Choice List
    category: executable
    description: Selection from predefined options.
  ex-cross-reference:
    label: Cross Reference
    category: executable
    description: Link to an external document or artifact.
  ex-signature:
    label: Signature
    category: executable
    description: Electronic signature capture.
  ae-acceptance-criteria:
    label: Acceptance Criteria
    category: auto-executed
    description: Boolean expression evaluated automatically.
