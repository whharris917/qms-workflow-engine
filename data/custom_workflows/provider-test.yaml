workflow_title: Provider Test
workflow_description: Exercises the external state provider framework end-to-end.

providers:
  counter:
    bindings:
      counter_id: $session_name

nodes:
  gather:
    title: Enter Name
    instruction: "Provide a session name. This will scope the counter."
    fields:
      session_name:
        label: Session Name
        type: text
        key: session_name
        instruction: "Any identifier for this test session."
    proceed:
      label: Continue
      gate: {type: field_truthy, key: session_name}

  interact:
    title: Counter Interaction
    instruction: >-
      The counter is exposed as a read-only field from the external provider.
      Use the Increment affordance to increase it. You cannot proceed until
      the counter exceeds 3.
    provider_nodes:
      counter:
        expose:
          - key: counter
            label: External Counter
            instruction: "Current value from the counter provider."
        affordances: true
    proceed:
      label: Proceed (requires counter > 3)
      gate:
        type: provider_state
        provider: counter
        condition: {type: counter_above, value: 3}

  done:
    title: Complete
    instruction: "The counter gate passed. Provider framework verified."
    show_all_fields: true
    actions:
      - action: submit
        label: Finish
      - action: restart
        label: Start Over
