workflow_title: Focus Test
workflow_description: >-
  Test workflow with diverse field types, a table, and a list on a single node.
  Exercises every focusable object type.

option_sets:
  priorities:
    - Low
    - Medium
    - High
    - Critical

  categories:
    - Hardware
    - Software
    - Process
    - Documentation

column_types:
  ne-free-text:
    label: Free Text
    category: non-executable
  ex-free-text:
    label: Free Text (Exec)
    category: executable
  ex-signature:
    label: Signature
    category: executable

nodes:
  main:
    title: Focus Test Node
    instruction: >-
      This node has fields, a table, and a list. Focus on each element
      to reveal its affordances.

    fields:
      title:
        label: Title
        type: text
        key: title
        instruction: A short title for this test item.
        default: null

      priority:
        label: Priority
        type: choice
        key: priority
        options_from: priorities
        instruction: How urgent is this?
        default: null

      approved:
        label: Approved
        type: toggle
        key: approved
        instruction: Has this been approved?
        default: null

      description:
        label: Description
        type: text
        key: description
        instruction: Detailed description of the item.
        default: null

      category:
        label: Category
        type: choice
        key: category
        options_from: categories
        instruction: Primary classification.
        default: null

      is_recurring:
        label: Recurring
        type: toggle
        key: is_recurring
        instruction: Does this happen on a regular schedule?
        default: null

      notes:
        label: Notes
        type: text
        key: notes
        instruction: Any additional notes or context.
        default: null

    table:
      column_type_catalog: column_types
      properties:
        sequential_execution: {type: toggle, default: false}
      operations:
        - add_column
        - remove_column
        - rename_column
        - set_column_type
        - add_row
        - remove_row
        - set_cell
        - set_property

    lists:
      checklist:
        label: Checklist
        key: checklist
        operations: [add, edit, remove, reorder]
        item_schema:
          task:
            label: Task
            type: text
          done:
            label: Done
            type: toggle

    proceed:
      label: Complete
      requires: [title]
