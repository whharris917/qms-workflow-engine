workflow_title: Comprehensive Change Assessment
workflow_description: Full-featured workflow for assessing, routing, investigating,
  and approving proposed changes. Exercises every engine primitive.
option_sets:
  risk_levels:
  - Low
  - Medium
  - High
  - Critical
  change_categories:
  - Infrastructure
  - Application
  - Security
  - Data
  - Process
column_types:
  ne-free-text:
    label: Free Text
    category: non-executable
    description: Static text defined during planning.
  ne-prerequisite:
    label: Prerequisite
    category: non-executable
    description: Row dependencies.
  ex-free-text:
    label: Free Text
    category: executable
    description: Free-form evidence recorded during execution.
  ex-choice-list:
    label: Choice List
    category: executable
    description: Selection from predefined options.
  ex-signature:
    label: Signature
    category: executable
    description: Electronic signature.
  ae-acceptance-criteria:
    label: Acceptance Criteria
    category: auto-executed
    description: Boolean expression evaluated automatically.
nodes:
  intake:
    title: Change Intake
    instruction: Collect initial information about the proposed change.
    fields:
      change_title:
        label: Change Title
        type: text
        key: change_title
        default: ''
        instruction: Brief title describing the proposed change.
      risk_level:
        label: Risk Level
        type: choice
        key: risk_level
        instruction: Assessed risk of this change.
        options_from: risk_levels
      category:
        label: Category
        type: choice
        key: category
        instruction: Primary category of the change.
        options_from: change_categories
        side_effects:
        - when:
            type: field_equals
            key: category
            value: Security
          set:
            requires_compliance: true
        - when:
            type: field_equals
            key: category
            value: Data
          set:
            requires_compliance: true
        - when:
            op: AND
            conditions:
            - op: NOT
              conditions:
              - type: field_equals
                key: category
                value: Security
            - op: NOT
              conditions:
              - type: field_equals
                key: category
                value: Data
          set:
            requires_compliance: false
      affected_system:
        label: Affected System
        type: choice
        key: affected_system
        instruction: Which system is primarily affected?
        dynamic_options:
          source_key: category
          mapping:
            Infrastructure:
            - Network
            - DNS
            - Load Balancer
            - Database Server
            - Storage
            Application:
            - API Gateway
            - Auth Service
            - Worker Queue
            - Frontend
            - Backend
            Security:
            - Firewall
            - IAM
            - Certificates
            - Secrets Manager
            - WAF
            Data:
            - Primary DB
            - Replica DB
            - Cache
            - Object Storage
            - Search Index
            Process:
            - CI/CD Pipeline
            - Deployment
            - Monitoring
            - Alerting
            - Backup
          default: []
      requires_downtime:
        label: Requires Downtime
        type: toggle
        key: requires_downtime
        instruction: Will this change require scheduled downtime?
      requires_compliance:
        label: Requires Compliance Review
        type: indicator
        key: requires_compliance
        compute:
          op: OR
          conditions:
          - type: field_equals
            key: category
            value: Security
          - type: field_equals
            key: category
            value: Data
        instruction_when_true: This change category requires mandatory compliance
          review.
        instruction_when_false: No compliance review required for this category.
      has_exec_sponsor:
        label: Executive Sponsor Identified
        type: toggle
        key: has_exec_sponsor
        instruction: Has an executive sponsor been identified for this change?
        visible_when:
          op: OR
          conditions:
          - type: field_equals
            key: risk_level
            value: High
          - type: field_equals
            key: risk_level
            value: Critical
      change_description:
        label: Change Description
        type: text
        key: change_description
        instruction: Detailed description of the proposed change.
        annotate_from: change_categories
    proceed:
      label: Submit for Assessment
      gate:
        op: AND
        conditions:
        - type: field_truthy
          key: change_title
        - type: field_not_null
          key: risk_level
        - type: field_not_null
          key: category
        - type: field_not_null
          key: affected_system
        - type: field_truthy
          key: change_description
      target: risk_router
  risk_router:
    title: Risk Router
    instruction: Automatic routing based on assessed risk level.
    pause: false
    router:
    - target: low_risk_fasttrack
      when:
        type: field_equals
        key: risk_level
        value: Low
    - target: high_risk_fork
      when:
        op: OR
        conditions:
        - type: field_equals
          key: risk_level
          value: High
        - type: field_equals
          key: risk_level
          value: Critical
    - target: standard_assessment
  low_risk_fasttrack:
    title: Low-Risk Fast Track
    instruction: Streamlined approval for low-risk changes.
    fields:
      quick_notes:
        label: Quick Approval Notes
        type: text
        key: quick_notes
        instruction: Brief justification for fast-track approval.
      fasttrack_approved:
        label: Fast-Track Approved
        type: toggle
        key: fasttrack_approved
        instruction: Approve this low-risk change for immediate implementation?
    navigation:
    - action: go_back
      label: Escalate to Standard Assessment
      when:
        op: NOT
        conditions:
        - type: field_truthy
          key: fasttrack_approved
    - action: go_to
      label: Skip to Final Decision
      node: final_decision
      when:
        type: field_truthy
        key: fasttrack_approved
    proceed:
      label: Continue to Evidence
      gate:
        type: field_truthy
        key: quick_notes
      target: evidence_collection
  standard_assessment:
    title: Standard Assessment
    instruction: Detailed assessment with component tracking.
    fields:
      impact_analysis:
        label: Impact Analysis
        type: text
        key: impact_analysis
        instruction: Describe the expected impact of this change.
      rollback_plan:
        label: Rollback Plan
        type: text
        key: rollback_plan
        instruction: Describe the rollback procedure if the change fails.
    lists:
      affected_components:
        label: Affected Components
        key: affected_components
        item_schema:
          component_name:
            type: text
            required: true
          impact_level:
            type: choice
            required: false
            options:
            - None
            - Minor
            - Moderate
            - Major
            - Critical
          mitigation_notes:
            type: text
            required: false
        operations:
        - add
        - edit
        - remove
        - reorder
        focus: true
      stakeholders:
        label: Stakeholders
        key: stakeholders
        item_schema:
          name:
            type: text
            required: true
          role:
            type: choice
            required: false
            options:
            - Owner
            - Reviewer
            - Approver
            - Informed
        operations:
        - add
        - remove
    navigation:
    - action: go_to
      label: Escalate to High-Risk Path
      node: high_risk_fork
      when:
        op: NOT
        conditions:
        - type: field_equals
          key: risk_level
          value: Medium
    proceed:
      label: Continue
      gate:
        op: AND
        conditions:
        - type: field_truthy
          key: impact_analysis
        - type: field_truthy
          key: rollback_plan
      target: evidence_collection
  high_risk_fork:
    title: High-Risk Investigation
    instruction: Parallel investigation for high/critical-risk changes.
    fork:
      label: Begin Parallel Investigation
      merge: merge_findings
      branches:
        technical:
          label: Technical Review Track
          nodes:
          - tech_review
        compliance:
          label: Compliance Review Track
          nodes:
          - compliance_review
        executive:
          label: Executive Briefing Track
          nodes:
          - exec_briefing
      gate:
        op: AND
        conditions:
        - type: field_truthy
          key: change_title
        - type: field_not_null
          key: risk_level
        - type: field_not_null
          key: category
  tech_review:
    title: Technical Review
    instruction: Evaluate technical feasibility and impact.
    fields:
      tech_feasibility:
        label: Technical Feasibility
        type: choice
        key: tech_feasibility
        options:
        - Feasible
        - Feasible with Modifications
        - Not Feasible
      perf_impact:
        label: Performance Impact
        type: choice
        key: perf_impact
        options:
        - None
        - Minor Degradation
        - Significant Degradation
        - Improvement
      tech_notes:
        label: Technical Notes
        type: text
        key: tech_notes
        instruction: Detailed technical assessment.
    proceed:
      label: Complete Technical Review
      gate:
        op: AND
        conditions:
        - type: field_not_null
          key: tech_feasibility
        - type: field_truthy
          key: tech_notes
  compliance_review:
    title: Compliance Review
    instruction: Evaluate regulatory and policy compliance.
    fields:
      regulatory_status:
        label: Regulatory Compliance
        type: choice
        key: regulatory_status
        options:
        - Compliant
        - Conditionally Compliant
        - Non-Compliant
      compliance_conditions:
        label: Compliance Conditions
        type: text
        key: compliance_conditions
        instruction: Describe the conditions that must be met.
        visible_when:
          type: field_equals
          key: regulatory_status
          value: Conditionally Compliant
      noncompliance_justification:
        label: Non-Compliance Justification
        type: text
        key: noncompliance_justification
        instruction: Explain why non-compliance is acceptable and what mitigations
          exist.
        visible_when:
          type: field_equals
          key: regulatory_status
          value: Non-Compliant
    proceed:
      label: Complete Compliance Review
      gate:
        type: field_not_null
        key: regulatory_status
  exec_briefing:
    title: Executive Briefing
    instruction: Brief leadership on critical changes.
    fields:
      business_justification:
        label: Business Justification
        type: text
        key: business_justification
        instruction: Why is this change necessary from a business perspective?
      exec_decision:
        label: Executive Decision
        type: choice
        key: exec_decision
        options:
        - Approved
        - Approved with Conditions
        - Deferred
        - Rejected
      exec_conditions:
        label: Conditions (if any)
        type: text
        key: exec_conditions
        visible_when:
          type: field_equals
          key: exec_decision
          value: Approved with Conditions
    proceed:
      label: Complete Executive Briefing
      gate:
        op: AND
        conditions:
        - type: field_truthy
          key: business_justification
        - type: field_not_null
          key: exec_decision
  merge_findings:
    title: Consolidated Findings
    instruction: Review all investigation findings before proceeding.
    show_all_fields: true
    proceed:
      label: Proceed to Evidence Collection
      target: evidence_collection
  evidence_collection:
    title: Evidence Collection
    instruction: Structured evidence gathering with execution table.
    execution: true
    table:
      column_type_catalog: column_types
      properties:
        sequential_execution:
          type: toggle
          default: false
      operations:
      - add_column
      - remove_column
      - rename_column
      - set_column_type
      - add_row
      - remove_row
      - set_cell
      - set_choices
      - set_rule
      - set_prerequisites
      - set_property
    proceed:
      label: Proceed to Final Decision
      gate:
        type: table_has_rows
      target: final_decision
  final_decision:
    title: Final Decision
    instruction: Approve, reject, or send back for rework.
    fields:
      final_decision:
        label: Decision
        type: choice
        key: final_decision
        options:
        - Approved
        - Rejected
        - Requires Rework
      decision_rationale:
        label: Decision Rationale
        type: text
        key: decision_rationale
        instruction: Explain the reasoning behind the decision.
      is_approved:
        label: Is Approved
        type: indicator
        key: is_approved
        compute:
          type: field_equals
          key: final_decision
          value: Approved
        instruction_when_true: Change has been approved. Proceed to completion.
        instruction_when_false: Change has not been approved.
    navigation:
    - action: go_to
      label: Send Back for Rework
      node: intake
      when:
        type: field_equals
        key: final_decision
        value: Requires Rework
    proceed:
      label: Finalize Assessment
      gate:
        op: AND
        conditions:
        - type: field_not_null
          key: final_decision
        - type: field_truthy
          key: decision_rationale
        - op: NOT
          conditions:
          - type: field_equals
            key: final_decision
            value: Requires Rework
      target: complete
  complete:
    title: Complete
    instruction: Change assessment is complete.
    show_all_fields: true
    navigation:
    - action: go_back
      label: Return to Decision
      when:
        op: NOT
        conditions:
        - type: field_truthy
          key: is_approved
    actions:
    - action: submit
      label: Submit Change Assessment
    - action: restart
      label: Start New Assessment
