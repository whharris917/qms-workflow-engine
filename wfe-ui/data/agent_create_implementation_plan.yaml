## Agent workflow definition: Create Implementation Plan
##
## Defines the table-based implementation plan authoring workflow.
## The table structure (columns, rows, cells) is managed by the
## table_handler.py Python module. This YAML declares the workflow
## shell: nodes, lifecycle, and column type catalog.
##
## The table lives at state.table in the rendered page, not in
## state.fields. Renderers project it as a visual table; the agent
## interacts via structural affordances (add_column, set_cell, etc.).

nodes:
  construction:
    title: Table Construction
    lifecycle_label: Construction
    instruction: >-
      Build an implementation plan table. Add columns to define the
      structure, then add rows and fill in cell values. Column types
      fall into three categories: Non-executable (ne-) columns are
      filled now during construction and become read-only during
      execution -- use these for task descriptions, prerequisites, and
      other plan content. Executable (ex-) columns are left empty now
      and filled during execution -- use these for evidence, outcomes,
      signatures, and other execution artifacts. Auto-executed (ae-)
      columns are evaluated automatically by the system during
      execution based on rules you define -- use these for acceptance
      criteria.
    proceed:
      label: Proceed to Review
      # Gate: requires at least one column and one row (enforced in Python)

  review:
    title: Review
    lifecycle_label: Review
    instruction: >-
      Review the complete implementation plan. Go back to make changes,
      or proceed to execution.

  executing:
    title: Execution
    lifecycle_label: Execution
    instruction: >-
      Execute the implementation plan by filling cells, signing,
      and recording evidence. Work through EIs in order if sequential
      execution is enabled. Each row's acceptance criteria are
      evaluated automatically. All acceptance criteria must pass
      to complete execution.

  done:
    title: Complete
    lifecycle_label: Done
    instruction: >-
      All execution items have passed acceptance criteria. You may
      go back to make corrections or start a new plan.

lifecycle_banner:
  - Construction
  - Review
  - Execution
  - Done

column_types:
  ne-free-text:
    label: Free Text
    category: non-executable
    description: Plain text content, not executed.
  ne-prerequisite:
    label: Prerequisite
    category: non-executable
    description: References to rows that must complete before this row.
  ex-free-text:
    label: Free Text
    category: executable
    description: Free-form text filled during execution.
  ex-choice-list:
    label: Choice List
    category: executable
    description: Selection from predefined options.
  ex-cross-reference:
    label: Cross Reference
    category: executable
    description: Link to an external document or artifact.
  ex-signature:
    label: Signature
    category: executable
    description: Electronic signature capture.
  ae-acceptance-criteria:
    label: Acceptance Criteria
    category: auto-executed
    description: Boolean expression evaluated automatically.
