## Agent workflow definition: Create Workflow
##
## Defines the authoring workflow for building new workflows. The structural
## editing logic (nodes, fields, lifecycle) is managed by
## workflow_builder_handler.py. This YAML declares the builder's own
## node structure, lifecycle, and instructions.

nodes:
  metadata:
    title: Workflow Metadata
    lifecycle_label: Setup
    instruction: |
      Define the basic identity of the new workflow.

      - workflow_id: A machine-readable slug used in URLs (e.g. "create-deviation", "review-finding"). Lowercase, hyphens only.
      - workflow_title: The human-readable name shown in the portal (e.g. "Create Deviation").
      - workflow_description: A one-line summary shown in the workflow listing.

  lifecycle:
    title: Lifecycle Banner
    lifecycle_label: Setup
    instruction: |
      Define the ordered list of lifecycle phases displayed in the banner at the top of the workflow.

      Each phase is a label (e.g. "Initiation", "Review", "Closure"). Nodes you create later will each map to one of these phases.

      Add at least one phase to proceed.

  node_builder:
    title: Node Builder
    lifecycle_label: Design
    instruction: |
      Design the nodes of your workflow. Each node is a step that the agent will pass through.

      Start by adding nodes. Then select a node to focus on it — this scopes the field editing affordances to that node. For each node you can:
      - Add fields (text, boolean, select) that the agent will fill in
      - Set a proceed gate (required fields that must be filled before advancing)
      - Add navigation links (go_back, go_to another node)
      - Add terminal actions (submit, restart)
      - Toggle show_all_fields to display all fields from all nodes (useful for review nodes)

      You need at least one node with at least one field to proceed.

  preview:
    title: Preview & Validate
    lifecycle_label: Review
    instruction: |
      Review the complete workflow definition. Validation checks run automatically:
      - All lifecycle labels used by nodes must exist in the banner
      - All field keys in proceed gates must exist
      - All node IDs in navigation targets must exist
      - No duplicate field keys across the workflow
      - At least one proceed gate or terminal action must exist

      If validation passes, you can publish the workflow.

  published:
    title: Published
    lifecycle_label: Done
    instruction: |
      Your workflow has been published. It will be available in the Agent Portal after the server restarts (or is reloaded).

lifecycle_banner:
  - Setup
  - Design
  - Review
  - Done
