<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Observer: {{ workflow_title }}</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Consolas', 'Monaco', monospace; background: #0a0a0a; color: #aaa; }
        .header {
            display: flex; align-items: center; gap: 1.5rem;
            padding: 0.6rem 1rem; background: #111; border-bottom: 1px solid #222;
        }
        .header h1 { font-size: 0.85rem; color: #4a9eff; letter-spacing: 0.1em; text-transform: uppercase; }
        .status { font-size: 0.8rem; }
        .status-label { color: #555; }
        .connected { color: #4caf50; }
        .disconnected { color: #c0392b; }
        .path-value { color: #e6a817; }
        .mode-toggle {
            display: flex; gap: 0; margin-left: auto;
        }
        .mode-btn {
            padding: 0.3rem 0.8rem; font-size: 0.75rem; font-family: inherit;
            background: #1a1a1a; color: #666; border: 1px solid #333;
            cursor: pointer; text-transform: uppercase; letter-spacing: 0.05em;
        }
        .mode-btn:first-child { border-radius: 3px 0 0 3px; }
        .mode-btn:last-child { border-radius: 0 3px 3px 0; }
        .mode-btn + .mode-btn { border-left: none; }
        .mode-btn.active { background: #4a9eff; color: #fff; border-color: #4a9eff; }
        .panels { display: flex; height: calc(100vh - 2.2rem); }
        .panel-view {
            flex: 1; display: flex; flex-direction: column;
        }
        .view-frame {
            flex: 1; background: #111; overflow: hidden;
            color: #ccc; font-size: 0.85rem; position: relative;
        }

        /* Renderer containers — each renderer owns its container fully */
        .renderer-container {
            display: none; width: 100%; height: 100%;
            position: absolute; top: 0; left: 0;
        }
        .renderer-container.active { display: block; }

        /* Raw renderer */
        #rc-raw { overflow-y: auto; padding: 0.75rem; }
    </style>
</head>
<body>
    <div class="header">
        <h1>Observer: {{ workflow_title }}</h1>
        <div class="status">
            <span class="status-label">stream:</span>
            <span id="conn" class="disconnected">off</span>
        </div>
        <div class="status">
            <span class="status-label">node:</span>
            <span id="path" class="path-value">&mdash;</span>
        </div>
        <div class="mode-toggle" id="mode-toggle"></div>
        <span style="color:#333;margin:0 0.3rem;">|</span>
        <div class="mode-toggle" id="view-toggle">
            <button class="mode-btn active" id="btn-full" onclick="setViewMode('full')">Full</button>
            <button class="mode-btn" id="btn-feedback" onclick="setViewMode('feedback')">Feedback</button>
        </div>
    </div>
    <div class="panels">
        <div class="panel-view">
            <div class="view-frame" id="view-frame">
                <!-- Renderer containers are injected here by JS -->
            </div>
        </div>
    </div>
<script src="https://unpkg.com/elkjs@0.9.3/lib/elk.bundled.js"></script>
<script src="/static/schematic.js"></script>
<script>
/* ======================================================================
   ELK.js INTEGRATION — automatic graph layout via Sugiyama algorithm
   ====================================================================== */
var _elk = typeof ELK !== 'undefined' ? new ELK() : null;

/**
 * Build an ELK graph from workflow definition nodes.
 * direction: 'DOWN' (vertical chart) or 'RIGHT' (horizontal banner)
 * nodeSizeFn: function(node) -> {width, height}
 * Returns: ELK graph object ready for elk.layout()
 */
function _elkBuildGraph(defnNodes, edges, direction, nodeSizeFn) {
    var children = [];
    for (var i = 0; i < defnNodes.length; i++) {
        var nd = defnNodes[i];
        var sz = nodeSizeFn(nd);
        children.push({ id: 'n' + i, width: sz.width, height: sz.height, _idx: i });
    }
    var elkEdges = [];
    for (var i = 0; i < edges.length; i++) {
        var e = edges[i];
        elkEdges.push({ id: 'e' + i, sources: ['n' + e.from], targets: ['n' + e.to], _edge: e });
    }
    return {
        id: 'root',
        layoutOptions: {
            'elk.algorithm': 'layered',
            'elk.direction': direction,
            'elk.spacing.nodeNode': '20',
            'elk.layered.spacing.nodeNodeBetweenLayers': direction === 'RIGHT' ? '40' : '60',
            'elk.layered.spacing.edgeNodeBetweenLayers': '20',
            'elk.edgeRouting': 'ORTHOGONAL',
            'elk.layered.crossingMinimization.strategy': 'LAYER_SWEEP',
            'elk.layered.nodePlacement.strategy': 'BRANDES_KOEPF'
        },
        children: children,
        edges: elkEdges
    };
}

/**
 * Run ELK layout and call callback with positioned slots.
 * callback(slots, edges, totalW, totalH) where slots[i] = {x, y, w, h, cx, cy}
 */
function _elkLayout(defnNodes, edges, direction, nodeSizeFn, callback) {
    if (!_elk) { callback(null); return; }
    var graph = _elkBuildGraph(defnNodes, edges, direction, nodeSizeFn);
    _elk.layout(graph).then(function(result) {
        var slots = new Array(defnNodes.length);
        for (var i = 0; i < result.children.length; i++) {
            var c = result.children[i];
            var idx = c._idx;
            slots[idx] = {
                x: c.x, y: c.y, w: c.width, h: c.height,
                cx: c.x + c.width / 2, cy: c.y + c.height / 2
            };
        }
        /* Compute total bounds */
        var maxX = 0, maxY = 0;
        for (var i = 0; i < slots.length; i++) {
            if (!slots[i]) continue;
            var r = slots[i].x + slots[i].w;
            var b = slots[i].y + slots[i].h;
            if (r > maxX) maxX = r;
            if (b > maxY) maxY = b;
        }
        /* Extract ELK's edge routing points */
        var routedEdges = [];
        for (var i = 0; i < result.edges.length; i++) {
            var re = result.edges[i];
            var orig = re._edge || edges[i];
            var sections = re.sections || [];
            var points = [];
            for (var si = 0; si < sections.length; si++) {
                var sec = sections[si];
                if (sec.startPoint) points.push(sec.startPoint);
                if (sec.bendPoints) {
                    for (var bi = 0; bi < sec.bendPoints.length; bi++) points.push(sec.bendPoints[bi]);
                }
                if (sec.endPoint) points.push(sec.endPoint);
            }
            routedEdges.push({ type: orig.type, label: orig.label, points: points });
        }
        callback(slots, routedEdges, maxX + 20, maxY + 20);
    }).catch(function(err) {
        console.error('ELK layout failed:', err);
        callback(null);
    });
}

/* ======================================================================
   RENDERER REGISTRY — pluggable rendering system
   Each renderer is an object with:
     .id        — unique string key
     .label     — button text
     .init(container)       — build DOM inside container, called once
     .update(state, msg)    — redraw with new agent state + last message
     .activate()            — called when switching TO this renderer
     .deactivate()          — called when switching AWAY
   ====================================================================== */

var renderers = {};        // id -> renderer object
var activeRenderer = null; // currently active renderer id
var agentState = null;     // latest parsed page JSON
var lastRaw = null;        // latest raw content string
var lastMessage = '';
var currentFeedback = null;  // latest Feedback from POST result
var viewMode = 'full';        // 'full' or 'feedback'

/* Renderer availability is declared by the workflow, not guessed from data shape. */
var allowedRenderers = {{ renderers|safe }};

/* Hierarchical renderer metadata:
   Each renderer can declare: format, verbosity, style.
   The top-level format defines what dimensions it exposes.
   Selector UI auto-adapts: only shows sub-selectors if the format has multiple options. */
var formatIndex = {};  // format -> [{id, verbosity, style, verbosity_label, style_label}]
var activeFormat = null;
var activeVerbosity = null;
var activeStyle = null;

function registerRenderer(r) {
    renderers[r.id] = r;
    /* Create container div */
    var container = document.createElement('div');
    container.id = 'rc-' + r.id;
    container.className = 'renderer-container';
    document.getElementById('view-frame').appendChild(container);
    r._container = container;
    r.init(container);

    /* Index by format for hierarchical selection */
    var fmt = r.format || r.id;
    if (!formatIndex[fmt]) formatIndex[fmt] = [];
    formatIndex[fmt].push({
        id: r.id,
        verbosity: r.verbosity || 'default',
        style: r.style || 'default',
        verbosity_label: r.verbosity_label || r.verbosity || 'Default',
        style_label: r.style_label || r.style || 'Default',
    });
}

function buildModeToggle() {
    /* Build the hierarchical selector UI after all renderers are registered. */
    var toggle = document.getElementById('mode-toggle');
    toggle.innerHTML = '';

    /* Format buttons — one per format that has at least one allowed renderer */
    var formats = Object.keys(formatIndex);
    for (var i = 0; i < formats.length; i++) {
        var fmt = formats[i];
        var entries = formatIndex[fmt];
        var hasAllowed = entries.some(function(e) { return allowedRenderers.indexOf(e.id) >= 0; });
        if (!hasAllowed) continue;
        var btn = document.createElement('button');
        btn.className = 'mode-btn';
        btn.id = 'btn-fmt-' + fmt;
        btn.textContent = entries[0].id === fmt ? (renderers[fmt] || {}).label || fmt : fmt;
        /* Use the format label from the first renderer's label if format === id (single-option) */
        if (entries.length === 1 && renderers[entries[0].id]) {
            btn.textContent = renderers[entries[0].id].label || fmt;
        } else {
            /* Multi-option format: use format name capitalized */
            btn.textContent = fmt.charAt(0).toUpperCase() + fmt.slice(1);
        }
        btn.setAttribute('data-format', fmt);
        btn.onclick = (function(f) { return function() { selectFormat(f); }; })(fmt);
        toggle.appendChild(btn);
    }

    /* Sub-selector containers */
    var subBar = document.getElementById('sub-toggle');
    if (!subBar) {
        subBar = document.createElement('div');
        subBar.id = 'sub-toggle';
        subBar.className = 'mode-toggle';
        subBar.style.marginLeft = '0';
        toggle.parentNode.insertBefore(subBar, toggle.nextSibling);
    }
}

function selectFormat(fmt) {
    activeFormat = fmt;
    var entries = formatIndex[fmt] || [];

    /* Determine available verbosities and styles */
    var verbosities = [], styles = [];
    var vSet = {}, sSet = {};
    for (var i = 0; i < entries.length; i++) {
        if (!vSet[entries[i].verbosity]) { verbosities.push(entries[i]); vSet[entries[i].verbosity] = true; }
        if (!sSet[entries[i].style]) { styles.push(entries[i]); sSet[entries[i].style] = true; }
    }

    /* Build sub-selectors if format has multiple options */
    var subBar = document.getElementById('sub-toggle');
    subBar.innerHTML = '';

    var hasMultipleVerbosities = Object.keys(vSet).length > 1;
    var hasMultipleStyles = Object.keys(sSet).length > 1;

    if (hasMultipleVerbosities) {
        var sep = document.createElement('span');
        sep.style.cssText = 'color:#333;margin:0 0.3rem;';
        sep.textContent = '|';
        subBar.appendChild(sep);
        for (var vi = 0; vi < verbosities.length; vi++) {
            var vb = document.createElement('button');
            vb.className = 'mode-btn';
            vb.id = 'btn-verb-' + verbosities[vi].verbosity;
            vb.textContent = verbosities[vi].verbosity_label;
            vb.setAttribute('data-verbosity', verbosities[vi].verbosity);
            vb.onclick = (function(v) { return function() { selectVerbosity(v); }; })(verbosities[vi].verbosity);
            subBar.appendChild(vb);
        }
    }

    if (hasMultipleStyles) {
        var sep2 = document.createElement('span');
        sep2.style.cssText = 'color:#333;margin:0 0.3rem;';
        sep2.textContent = '|';
        subBar.appendChild(sep2);
        for (var si = 0; si < styles.length; si++) {
            var sb = document.createElement('button');
            sb.className = 'mode-btn';
            sb.id = 'btn-style-' + styles[si].style;
            sb.textContent = styles[si].style_label;
            sb.setAttribute('data-style', styles[si].style);
            sb.onclick = (function(s) { return function() { selectStyle(s); }; })(styles[si].style);
            subBar.appendChild(sb);
        }
    }

    /* Pick defaults */
    activeVerbosity = hasMultipleVerbosities ? (activeVerbosity && vSet[activeVerbosity] ? activeVerbosity : verbosities[0].verbosity) : entries[0].verbosity;
    activeStyle = hasMultipleStyles ? (activeStyle && sSet[activeStyle] ? activeStyle : styles[0].style) : entries[0].style;

    _activateRendererFromSelection();
}

function selectVerbosity(v) {
    activeVerbosity = v;
    _activateRendererFromSelection();
}

function selectStyle(s) {
    activeStyle = s;
    _activateRendererFromSelection();
}

function _activateRendererFromSelection() {
    /* Find the renderer matching current format + verbosity + style */
    var entries = formatIndex[activeFormat] || [];
    var match = null;
    for (var i = 0; i < entries.length; i++) {
        if (entries[i].verbosity === activeVerbosity && entries[i].style === activeStyle) {
            match = entries[i].id;
            break;
        }
    }
    /* Fallback: match format + verbosity, or just format */
    if (!match) {
        for (var i = 0; i < entries.length; i++) {
            if (entries[i].verbosity === activeVerbosity) { match = entries[i].id; break; }
        }
    }
    if (!match && entries.length) match = entries[0].id;
    if (match) setMode(match);
}

function setMode(id) {
    /* Non-raw renderers force Full mode */
    if (id !== 'raw' && viewMode === 'feedback') {
        viewMode = 'full';
        document.getElementById('btn-full').classList.add('active');
        document.getElementById('btn-feedback').classList.remove('active');
    }
    if (activeRenderer === id) return;
    /* Deactivate previous */
    if (activeRenderer && renderers[activeRenderer]) {
        renderers[activeRenderer]._container.classList.remove('active');
        renderers[activeRenderer].deactivate();
    }
    /* Activate new */
    activeRenderer = id;
    var r = renderers[id];
    r._container.classList.add('active');
    r.activate();
    /* Update button highlights */
    _updateToggleHighlights();
    if (agentState) dispatchRender();
}

function _updateToggleHighlights() {
    /* Highlight active format button */
    var fmtBtns = document.querySelectorAll('#mode-toggle .mode-btn');
    for (var i = 0; i < fmtBtns.length; i++) {
        fmtBtns[i].classList.toggle('active', fmtBtns[i].getAttribute('data-format') === activeFormat);
    }
    /* Highlight active verbosity/style buttons */
    var subBtns = document.querySelectorAll('#sub-toggle .mode-btn');
    for (var i = 0; i < subBtns.length; i++) {
        var isVerb = subBtns[i].getAttribute('data-verbosity');
        var isStyle = subBtns[i].getAttribute('data-style');
        if (isVerb) subBtns[i].classList.toggle('active', isVerb === activeVerbosity);
        if (isStyle) subBtns[i].classList.toggle('active', isStyle === activeStyle);
    }
}

function setViewMode(mode) {
    viewMode = mode;
    document.getElementById('btn-full').classList.toggle('active', mode === 'full');
    document.getElementById('btn-feedback').classList.toggle('active', mode === 'feedback');
    /* Feedback forces Raw renderer */
    if (mode === 'feedback' && activeRenderer !== 'raw') {
        setMode('raw');
        return; /* setMode already calls dispatchRender */
    }
    /* Re-render with current data */
    if (activeRenderer && renderers[activeRenderer]) {
        dispatchRender();
    }
}

function dispatchRender() {
    var r = renderers[activeRenderer];
    if (!r) return;
    if (viewMode === 'feedback' && activeRenderer === 'raw') {
        if (currentFeedback) {
            r.update(currentFeedback, currentFeedback.attempted_action || '', null);
        } else {
            r.update({}, '(no feedback yet — perform an action to see feedback)', null);
        }
    } else {
        r.update(agentState, lastMessage, currentFeedback);
    }
}

function broadcastState(state, msg, feedback) {
    agentState = state;
    lastMessage = msg;
    currentFeedback = feedback || null;
    if (activeRenderer && renderers[activeRenderer]) {
        dispatchRender();
    }
}

/* ── State extraction from SSE payloads ── */
function extractState(raw, feedback) {
    var obj;
    try { obj = typeof raw === 'string' ? JSON.parse(raw) : raw; } catch(e) { return; }
    if (!obj || !obj.state) return;
    lastRaw = typeof raw === 'string' ? raw : JSON.stringify(raw);
    broadcastState(obj, obj.message || '', feedback);
}

/* ======================================================================
   RENDERER: RAW — formatted JSON
   ====================================================================== */
registerRenderer({
    id: 'raw',
    label: 'Raw',
    format: 'raw',
    _pre: null,
    init: function(c) {
        c.style.overflowY = 'auto';
        c.style.padding = '0.75rem';
        this._pre = document.createElement('pre');
        this._pre.style.cssText = 'margin:0;white-space:pre-wrap;word-break:break-word;color:#ccc;';
        c.appendChild(this._pre);
    },
    update: function(state) {
        this._pre.textContent = JSON.stringify(state, null, 2);
    },
    activate: function() {},
    deactivate: function() {}
});


/* ======================================================================
   SHARED SIMPLE RENDERER — rendering logic used by Light and Dark modes
   ====================================================================== */

function wfEsc(s) {
    var d = document.createElement('div');
    d.textContent = String(s == null ? '' : s);
    return d.innerHTML;
}

function wfRenderParams(a) {
    /* Render affordance parameters (or legacy options) as a compact string. */
    if (a.parameters) {
        var parts = [];
        var keys = Object.keys(a.parameters);
        for (var ki = 0; ki < keys.length; ki++) {
            var k = keys[ki];
            var p = a.parameters[k];
            var s = k;
            if (p.options) s += '=' + JSON.stringify(p.options);
            if (p.labels) s += ' (' + p.labels.join(', ') + ')';
            parts.push(s);
        }
        return parts.join(' | ');
    }
    if (a.options) return JSON.stringify(a.options);
    return '';
}

function wfRenderValue(v) {
    if (v == null) return '<span class="wf-null">(null)</span>';
    if (typeof v === 'boolean') return '<span class="wf-bool">' + v + '</span>';
    if (typeof v === 'number') return '<span class="wf-num">' + v + '</span>';
    if (Array.isArray(v)) {
        if (v.length === 0) return '<span class="wf-empty-arr">(empty)</span>';
        var html = '<div class="wf-arr">';
        for (var i = 0; i < v.length; i++) {
            html += '<div class="wf-arr-item">' + wfRenderValue(v[i]) + '</div>';
        }
        return html + '</div>';
    }
    if (typeof v === 'object') return wfRenderObject(v);
    return '<span class="wf-str">' + wfEsc(v) + '</span>';
}

function wfRenderObject(obj) {
    var keys = Object.keys(obj);
    if (!keys.length) return '<span class="wf-empty-obj">(empty)</span>';
    var html = '<table class="wf-tbl">';
    for (var i = 0; i < keys.length; i++) {
        html += '<tr><td class="wf-key">' + wfEsc(keys[i]) + '</td><td class="wf-val">' + wfRenderValue(obj[keys[i]]) + '</td></tr>';
    }
    return html + '</table>';
}

function wfRuleToExpr(rule, columns) {
    /* Translate a rule JSON tree into a human-readable boolean expression.
       columns is the columns array (for resolving column index to name). */
    if (!rule || !rule.conditions) return JSON.stringify(rule);
    var parts = [];
    for (var i = 0; i < rule.conditions.length; i++) {
        var c = rule.conditions[i];
        if (c.op) {
            /* Nested group */
            parts.push('(' + wfRuleToExpr(c, columns) + ')');
        } else if (c.type === 'all-executed') {
            parts.push('all-executed');
        } else if (c.type === 'column' && c.column !== undefined) {
            var colName = (columns && columns[c.column]) ? columns[c.column].name : 'col ' + c.column;
            var op = c.operator || '?';
            if (op === 'is-filled' || op === 'is-signed') {
                parts.push(colName + ' ' + op);
            } else if (op === 'equals' || op === 'ref-status') {
                parts.push(colName + ' ' + op + ' "' + (c.value || '') + '"');
            } else {
                parts.push(colName + ' ' + op);
            }
        } else {
            parts.push(JSON.stringify(c));
        }
    }
    if (parts.length === 0) return '(empty)';
    if (parts.length === 1) return parts[0];
    return parts.join(' ' + (rule.op || 'AND') + ' ');
}

function wfRenderFields(fields, fieldCategory) {
    var keys = Object.keys(fields);
    if (!keys.length) return '<span class="wf-empty-obj">(empty)</span>';
    var html = '<div class="wf-fields">';
    for (var i = 0; i < keys.length; i++) {
        var k = keys[i];
        var f = fields[k];
        var cat = fieldCategory[k] || null;
        var catCls = cat ? ' wf-fb-' + cat : '';
        html += '<div class="wf-field' + catCls + '">';
        var tagMap = {outcome:'SET', 'new':'NEW', modified:'CHANGED'};
        var tagCls = {outcome:'wf-tag-outcome', 'new':'wf-tag-new', modified:'wf-tag-modified'};
        var tag = cat ? '<span class="' + tagCls[cat] + '">' + tagMap[cat] + '</span>' : '';
        html += '<div class="wf-field-label">' + wfEsc(k) + tag + '</div>';
        if (f && typeof f === 'object' && 'value' in f) {
            if (f.instruction) {
                html += '<div class="wf-field-instruction">' + wfEsc(f.instruction) + '</div>';
            }
            if (f.value == null) {
                html += '<div class="wf-field-value wf-field-empty">(not set)</div>';
            } else {
                html += '<div class="wf-field-value">' + wfEsc(f.value) + '</div>';
            }
            if (f.options) {
                html += '<div class="wf-field-options">' + wfEsc(f.options.join(', ')) + '</div>';
            }
        } else {
            html += '<div class="wf-field-value">' + wfRenderValue(f) + '</div>';
        }
        html += '</div>';
    }
    return html + '</div>';
}

/* ── Workflow Definition Blueprint Renderer ── */
function wfRenderDefinition(defn) {
    if (!defn) return '';
    var html = '';

    /* Header: title, ID, description */
    html += '<div class="bp-header">';
    html += '<div class="bp-title">' + wfEsc(defn.workflow_title || '(untitled)') + '</div>';
    if (defn.workflow_id) {
        html += '<span class="bp-id">' + wfEsc(defn.workflow_id) + '</span>';
    }
    if (defn.workflow_description) {
        html += '<div class="bp-desc">' + wfEsc(defn.workflow_description) + '</div>';
    }
    html += '</div>';

    /* Node flow banner — derived from node titles */
    var nodes = defn.nodes || [];
    if (nodes.length) {
        html += '<div class="bp-lifecycle">';
        for (var i = 0; i < nodes.length; i++) {
            if (i > 0) html += '<div class="bp-lc-conn"></div>';
            html += '<div class="bp-lc-step">';
            html += '<span class="bp-lc-dot">' + (i + 1) + '</span>';
            html += '<span class="bp-lc-label">' + wfEsc(nodes[i].title || nodes[i].id) + '</span>';
            html += '</div>';
        }
        html += '</div>';
    }

    /* Node cards */
    if (!nodes.length) {
        html += '<div class="bp-empty">No nodes defined</div>';
        return '<div class="bp-wrap">' + html + '</div>';
    }

    html += '<div class="bp-nodes">';
    for (var ni = 0; ni < nodes.length; ni++) {
        var nd = nodes[ni];
        if (ni > 0) html += '<div class="bp-node-conn"><div class="bp-arrow">&#9660;</div></div>';

        html += '<div class="bp-node">';
        /* Node header: title + id only */
        html += '<div class="bp-node-head">';
        html += '<span class="bp-node-title">' + wfEsc(nd.title || nd.id) + '</span>';
        html += '<span class="bp-node-id">' + wfEsc(nd.id) + '</span>';
        if (nd.show_all_fields) {
            html += '<span class="bp-node-flag">show_all_fields</span>';
        }
        html += '</div>';

        /* Instruction */
        html += '<div class="bp-node-section">';
        html += '<div class="bp-node-section-label">Instruction</div>';
        if (nd.instruction) {
            html += '<div class="bp-node-instr">' + wfEsc(nd.instruction) + '</div>';
        } else {
            html += '<div class="bp-node-none">(none)</div>';
        }
        html += '</div>';

        /* Fields */
        var fields = nd.fields || [];
        html += '<div class="bp-node-section">';
        html += '<div class="bp-node-section-label">Fields</div>';
        if (fields.length) {
            html += '<table class="bp-fields-table"><thead><tr><th>Key</th><th>Label</th><th>Type</th><th>Details</th></tr></thead><tbody>';
            for (var fi = 0; fi < fields.length; fi++) {
                var fld = fields[fi];
                var typeCls = 'bp-type bp-type-' + (fld.type || 'text');
                html += '<tr>';
                html += '<td class="bp-field-key">' + wfEsc(fld.key || '') + '</td>';
                html += '<td>' + wfEsc(fld.label || '') + '</td>';
                html += '<td><span class="' + typeCls + '">' + wfEsc(fld.type || 'text') + '</span></td>';
                var details = [];
                if (fld.options && fld.options.length) details.push(fld.options.join(' | '));
                if (fld.instruction) details.push(fld.instruction);
                html += '<td class="bp-field-detail">' + (details.length ? wfEsc(details.join(' — ')) : '') + '</td>';
                html += '</tr>';
            }
            html += '</tbody></table>';
        } else {
            html += '<div class="bp-node-none">(no fields)</div>';
        }
        html += '</div>';

        /* Proceed gate */
        html += '<div class="bp-node-section">';
        html += '<div class="bp-node-section-label">Proceed Gate</div>';
        if (nd.proceed) {
            html += '<div class="bp-gate">';
            html += '<span class="bp-gate-icon">&#9654;</span>';
            html += '<span class="bp-gate-label">' + wfEsc(nd.proceed.label || 'Proceed') + '</span>';
            var reqs = nd.proceed.requires || [];
            if (reqs.length) {
                html += '<span class="bp-gate-reqs">requires: ' + reqs.map(function(r) { return '<span class="bp-gate-key">' + wfEsc(r) + '</span>'; }).join(', ') + '</span>';
            }
            html += '</div>';
        } else {
            html += '<div class="bp-node-none">(no proceed gate)</div>';
        }
        html += '</div>';

        /* Navigation */
        var navs = nd.navigation || [];
        html += '<div class="bp-node-section">';
        html += '<div class="bp-node-section-label">Navigation</div>';
        if (navs.length) {
            for (var nvi = 0; nvi < navs.length; nvi++) {
                var nav = navs[nvi];
                html += '<div class="bp-nav-item">';
                html += '<span class="bp-nav-action">' + wfEsc(nav.action) + '</span>';
                html += '<span class="bp-nav-label">' + wfEsc(nav.label) + '</span>';
                if (nav.node) html += '<span class="bp-nav-target">&rarr; ' + wfEsc(nav.node) + '</span>';
                html += '</div>';
            }
        } else {
            html += '<div class="bp-node-none">(no navigation)</div>';
        }
        html += '</div>';

        /* Actions */
        var acts = nd.actions || [];
        html += '<div class="bp-node-section">';
        html += '<div class="bp-node-section-label">Actions</div>';
        if (acts.length) {
            for (var ai = 0; ai < acts.length; ai++) {
                var act = acts[ai];
                html += '<div class="bp-action-item">';
                html += '<span class="bp-action-type">' + wfEsc(act.action) + '</span>';
                html += '<span class="bp-action-label">' + wfEsc(act.label) + '</span>';
                html += '</div>';
            }
        } else {
            html += '<div class="bp-node-none">(no actions)</div>';
        }
        html += '</div>';

        html += '</div>'; /* bp-node */
    }
    html += '</div>'; /* bp-nodes */

    return '<div class="bp-wrap">' + html + '</div>';
}

function _isDefinition(v) {
    return v && typeof v === 'object' && !Array.isArray(v) && ('nodes' in v) && ('workflow_title' in v || 'workflow_id' in v);
}

function wfRenderStateProps(state) {
    /* Render any state keys not handled by dedicated building blocks.
       Known keys (rendered elsewhere): workflow, node, node_title, completed_nodes,
       lifecycle, lifecycle_current, lifecycle_completed, fields, table, execution_table. */
    var s = state.state || {};
    var known = ['workflow','node','node_title','completed_nodes','lifecycle','lifecycle_current','lifecycle_completed','fields','table','execution_table','fork_state'];
    var extra = Object.keys(s).filter(function(k) { return known.indexOf(k) === -1; });
    if (!extra.length) return '';
    var html = '';
    for (var i = 0; i < extra.length; i++) {
        var k = extra[i];
        var v = s[k];
        /* Workflow definition gets the blueprint renderer */
        if (k === 'definition' && _isDefinition(v)) {
            html += wfRenderDefinition(v);
            continue;
        }
        html += '<div class="wf-card">';
        html += '<div class="wf-card-head">state.' + wfEsc(k) + '</div>';
        if (Array.isArray(v) && v.length && typeof v[0] === 'string') {
            /* Array of strings — render as list */
            html += '<ul class="wf-extra-list">';
            for (var j = 0; j < v.length; j++) {
                html += '<li>' + wfEsc(v[j]) + '</li>';
            }
            html += '</ul>';
        } else if (v && typeof v === 'object') {
            html += wfRenderValue(v);
        } else {
            html += '<div class="wf-field-value">' + wfRenderValue(v) + '</div>';
        }
        html += '</div>';
    }
    return html;
}

function wfRenderBanner(state) {
    var s = state.state || {};
    var defn = s.definition;
    var current = s.lifecycle_current || '';
    var completed = s.lifecycle_completed || [];

    /* If we have a topology-aware definition, render schematic banner */
    if (defn && defn.nodes && defn.nodes.length) {
        return _wfSchematicBanner(defn, current, completed);
    }

    /* Legacy flat banner */
    var lifecycle = s.lifecycle || [];
    if (!lifecycle.length) return '';
    var labels = (typeof lifecycle[0] === 'string') ? lifecycle : lifecycle.map(function(x) { return x.title || ''; });
    var currentIdx = labels.indexOf(current);
    var html = '<div class="wf-banner">';
    for (var i = 0; i < labels.length; i++) {
        var label = labels[i];
        var isCurrent = label === current;
        var isDone = completed.indexOf(label) !== -1;
        var isPast = i < currentIdx;
        if (i > 0) html += '<div class="wf-conn' + ((isDone || isPast || isCurrent) ? ' wf-conn-active' : '') + '"></div>';
        html += '<div class="wf-step' + (isCurrent ? ' wf-step-active' : '') + (isDone ? ' wf-step-done' : '') + '">';
        html += '<span class="wf-dot">' + (isDone ? '&#10003;' : (i + 1)) + '</span>';
        html += '<span class="wf-step-label">' + wfEsc(label) + '</span>';
        html += '</div>';
    }
    return html + '</div>';
}

/* ── Pill node renderer — compact banner-style nodes ── */
function _pillNodeRenderer(item, status) {
    if (item.kind === 'branch-point') {
        if (item.type === 'gate') {
            return '<div class="sch-bp sch-bp-gate">'
                + Schematic.GATE_SVG
                + '<span style="position:relative">' + wfEsc(item.title) + '</span></div>';
        }
        // split (fork)
        return '<div class="sch-bp sch-bp-split" style="position:relative;">'
            + '<div class="sch-bp-split-bars sch-bp-split-bars-l"></div>'
            + wfEsc(item.title)
            + '<div class="sch-bp-split-bars sch-bp-split-bars-r"></div>'
            + '</div>';
    }
    return '<div class="sch-pill">'
        + '<span class="sch-pill-dot"></span>'
        + '<span class="sch-pill-title">' + wfEsc(item.title) + '</span>'
        + '</div>';
}

/* ── Schematic banner — HTML nodes over canvas topology ── */
function _wfSchematicBanner(defn, current, completed) {
    var containerId = 'sch-banner-' + Math.random().toString(36).substr(2, 6);

    setTimeout(function() {
        var el = document.getElementById(containerId);
        if (!el) return;
        try {
            var spine = Schematic.definitionToSpine(defn);
            var execState = { current: current, completed: completed };
            var layoutData = Schematic.renderHybrid(spine, el, execState, {
                nodeRenderer: _pillNodeRenderer
            });
            if (layoutData) el.style.height = layoutData.height + 'px';
        } catch (e) {
            el.innerHTML = '<span style="color:#999;font-size:0.8rem;">Banner error: ' + e.message + '</span>';
        }
    }, 0);

    return '<div class="wf-banner wf-banner-flow" id="' + containerId + '" style="min-height:52px;"></div>';
}

/* ── Mini flowchart banner — ELK-powered horizontal layout (legacy) ── */
var _MB = {
    h: 24, minW: 60, charW: 5, px: 10, r: 4,   /* node: height, min-width, char-width, padding, corner-radius */
    fontSize: 9
};

function _mbW(title) { return Math.max(_MB.minW, title.length * _MB.charW + _MB.px * 2); }

function _wfMiniFlowchart(defn, current, completed) {
    /* Return a container div; ELK fills it asynchronously */
    var containerId = 'mb-' + Math.random().toString(36).substr(2, 6);
    var nodes = defn.nodes;
    var items = _fcBuildLayout(nodes);
    var edges = _fcEdges(nodes, items);

    setTimeout(function() {
        var el = document.getElementById(containerId);
        if (!el) return;

        /* Build simplified banner: collapse fork branches into single placeholder cards */
        var bNodes = [];  /* banner nodes */
        var bMeta = [];   /* per-node metadata */
        var bEdges = [];
        var idxMap = {};  /* original node index -> banner node index */

        for (var ii = 0; ii < items.length; ii++) {
            var item = items[ii];
            if (item.type === 'node' || item.type === 'router') {
                idxMap[item.idx] = bNodes.length;
                bNodes.push(nodes[item.idx]);
                bMeta.push({ kind: 'node', origIdx: item.idx });
            }
            else if (item.type === 'fork_group') {
                /* Fork card */
                var fbi = bNodes.length;
                idxMap[item.fork_idx] = fbi;
                bNodes.push(nodes[item.fork_idx]);
                bMeta.push({ kind: 'node', origIdx: item.fork_idx });

                /* Single placeholder for all branches */
                var labels = [];
                for (var b = 0; b < item.branches.length; b++) {
                    labels.push(item.branches[b].label);
                    for (var n = 0; n < item.branches[b].node_indices.length; n++)
                        idxMap[item.branches[b].node_indices[n]] = bNodes.length;
                }
                bNodes.push({ id: '__par_' + item.fork_idx, title: labels.join(' | '), _labels: labels });
                bMeta.push({ kind: 'parallel', labels: labels });

                /* Merge card */
                var mbi = bNodes.length;
                idxMap[item.merge_idx] = mbi;
                bNodes.push(nodes[item.merge_idx]);
                bMeta.push({ kind: 'node', origIdx: item.merge_idx });

                /* Internal edges: fork -> placeholder -> merge */
                bEdges.push({ from: fbi, to: fbi + 1, type: 'forward', label: '' });
                bEdges.push({ from: fbi + 1, to: mbi, type: 'forward', label: '' });
            }
        }
        /* Sequential edges between layout items */
        for (var ii = 0; ii < items.length - 1; ii++) {
            var cur = items[ii], nxt = items[ii + 1];
            var fromBi = cur.type === 'fork_group' ? idxMap[cur.merge_idx] : idxMap[cur.idx];
            var toBi = nxt.type === 'fork_group' ? idxMap[nxt.fork_idx] : idxMap[nxt.idx];
            if (fromBi !== undefined && toBi !== undefined)
                bEdges.push({ from: fromBi, to: toBi, type: 'forward', label: '' });
        }

        _elkLayout(bNodes, bEdges, 'RIGHT', function(nd) {
            if (nd._labels) {
                var maxL = 0;
                for (var i = 0; i < nd._labels.length; i++)
                    if (nd._labels[i].length > maxL) maxL = nd._labels[i].length;
                return { width: _mbW(Array(maxL + 1).join('x')), height: nd._labels.length * 16 + 8 };
            }
            return { width: _mbW(nd.title), height: _MB.h };
        }, function(slots, routedEdges, totalW, totalH) {
            if (!slots) { el.textContent = '(layout failed)'; return; }
            el.innerHTML = _mbRenderBannerSvg(bNodes, bMeta, slots, routedEdges, totalW, totalH, current, completed);
            el.style.height = totalH + 'px';
        });
    }, 0);

    return '<div class="wf-banner wf-banner-flow" id="' + containerId + '" style="min-height:' + (_MB.h + 20) + 'px;"></div>';
}

function _mbRenderSvg(nodes, slots, routedEdges, totalW, totalH, current, completed) {
    var svg = '<svg xmlns="http://www.w3.org/2000/svg" class="mb-svg" width="' + totalW + '" height="' + totalH + '" viewBox="0 0 ' + totalW + ' ' + totalH + '">';

    /* Draw ELK-routed edges — uniform style, no labels */
    for (var i = 0; i < routedEdges.length; i++) {
        var re = routedEdges[i], pts = re.points;
        if (pts.length < 2) continue;
        var d = 'M' + pts[0].x + ' ' + pts[0].y;
        for (var p = 1; p < pts.length; p++) d += ' L' + pts[p].x + ' ' + pts[p].y;
        svg += '<path d="' + d + '" stroke="#aaa" fill="none" stroke-width="1"/>';

        /* Arrowhead */
        if (pts.length >= 2) {
            var lp = pts[pts.length - 2], ep = pts[pts.length - 1];
            svg += _mbArrow(lp.x, lp.y, ep.x, ep.y, '#aaa');
        }
    }

    /* Draw nodes */
    for (var i = 0; i < nodes.length; i++) {
        var sl = slots[i]; if (!sl) continue;
        var nd = nodes[i];
        var isCur = nd.id === current, isDone = completed.indexOf(nd.id) !== -1;
        var isRtr = nd.router && nd.router.length > 0, isFrk = nd.fork && nd.fork.branches;
        var fill = isDone ? '#e8f5e9' : isCur ? '#e3f2fd' : '#fff';
        var stroke = isDone ? '#4caf50' : isCur ? '#2a6bcf' : isRtr ? '#e65100' : isFrk ? '#2e7d32' : '#ccc';
        var sw = (isCur || isDone) ? 2 : 1;
        var textFill = isDone ? '#2e7d32' : isCur ? '#1a1a2e' : '#555';
        var fw = (isCur || isDone) ? 'bold' : 'normal';
        svg += '<rect x="' + sl.x + '" y="' + sl.y + '" width="' + sl.w + '" height="' + sl.h + '" rx="' + _MB.r + '" fill="' + fill + '" stroke="' + stroke + '" stroke-width="' + sw + '"/>';
        svg += '<text x="' + sl.cx + '" y="' + sl.cy + '" text-anchor="middle" dominant-baseline="central" font-size="' + _MB.fontSize + '" font-family="-apple-system,sans-serif" fill="' + textFill + '" font-weight="' + fw + '">' + wfEsc(nd.title) + '</text>';
    }

    svg += '</svg>';
    return svg;
}

function _mbRenderBannerSvg(bNodes, bMeta, slots, routedEdges, totalW, totalH, current, completed) {
    var svg = '<svg xmlns="http://www.w3.org/2000/svg" class="mb-svg" width="' + totalW + '" height="' + totalH + '" viewBox="0 0 ' + totalW + ' ' + totalH + '">';

    /* Edges — uniform gray */
    for (var i = 0; i < routedEdges.length; i++) {
        var re = routedEdges[i], pts = re.points;
        if (pts.length < 2) continue;
        var d = 'M' + pts[0].x + ' ' + pts[0].y;
        for (var p = 1; p < pts.length; p++) d += ' L' + pts[p].x + ' ' + pts[p].y;
        svg += '<path d="' + d + '" stroke="#aaa" fill="none" stroke-width="1"/>';
        var lp = pts[pts.length - 2], ep = pts[pts.length - 1];
        svg += _mbArrow(lp.x, lp.y, ep.x, ep.y, '#aaa');
    }

    /* Nodes */
    for (var i = 0; i < bNodes.length; i++) {
        var sl = slots[i]; if (!sl) continue;
        var meta = bMeta[i];
        var nd = bNodes[i];

        if (meta.kind === 'parallel') {
            /* Parallel placeholder: dashed border, stacked branch labels */
            svg += '<rect x="' + sl.x + '" y="' + sl.y + '" width="' + sl.w + '" height="' + sl.h
                + '" rx="' + _MB.r + '" fill="#f8fdf8" stroke="#4caf50" stroke-width="1" stroke-dasharray="4 3"/>';
            var labels = meta.labels;
            var lineH = 14;
            var startY = sl.y + (sl.h - labels.length * lineH) / 2 + lineH * 0.75;
            for (var li = 0; li < labels.length; li++) {
                svg += '<text x="' + sl.cx + '" y="' + (startY + li * lineH)
                    + '" text-anchor="middle" dominant-baseline="auto" font-size="' + _MB.fontSize
                    + '" font-family="-apple-system,sans-serif" fill="#2e7d32">' + wfEsc(labels[li]) + '</text>';
            }
        } else {
            /* Regular node */
            var origIdx = meta.origIdx;
            var isCur = nd.id === current;
            var isDone = completed.indexOf(nd.id) !== -1;
            var isRtr = nd.router && nd.router.length > 0;
            var isFrk = nd.fork && nd.fork.branches;
            var fill = isDone ? '#e8f5e9' : isCur ? '#e3f2fd' : '#fff';
            var stroke = isDone ? '#4caf50' : isCur ? '#2a6bcf' : isRtr ? '#e65100' : isFrk ? '#2e7d32' : '#ccc';
            var sw = (isCur || isDone) ? 2 : 1;
            var textFill = isDone ? '#2e7d32' : isCur ? '#1a1a2e' : '#555';
            var fw = (isCur || isDone) ? 'bold' : 'normal';
            svg += '<rect x="' + sl.x + '" y="' + sl.y + '" width="' + sl.w + '" height="' + sl.h
                + '" rx="' + _MB.r + '" fill="' + fill + '" stroke="' + stroke + '" stroke-width="' + sw + '"/>';
            svg += '<text x="' + sl.cx + '" y="' + sl.cy
                + '" text-anchor="middle" dominant-baseline="central" font-size="' + _MB.fontSize
                + '" font-family="-apple-system,sans-serif" fill="' + textFill + '" font-weight="' + fw + '">'
                + wfEsc(nd.title) + '</text>';
        }
    }

    svg += '</svg>';
    return svg;
}

function _mbArrow(x1, y1, x2, y2, color) {
    /* Small triangle arrowhead at (x2,y2) pointing in direction from (x1,y1) */
    var dx = x2 - x1, dy = y2 - y1;
    var len = Math.sqrt(dx * dx + dy * dy);
    if (len < 1) return '';
    var ux = dx / len, uy = dy / len;
    var px = -uy, py = ux;
    var sz = 4;
    var bx = x2 - ux * sz, by = y2 - uy * sz;
    return '<polygon points="' + x2 + ',' + y2 + ' ' + (bx + px * sz * 0.5) + ',' + (by + py * sz * 0.5) + ' ' + (bx - px * sz * 0.5) + ',' + (by - py * sz * 0.5) + '" fill="' + color + '"/>';
}

function wfRenderTable(table) {
    if (!table) return '';
    var cols = table.columns || [];
    var rows = table.rows || [];
    var props = table.properties || {};

    var html = '<div class="wf-card">';
    html += '<div class="wf-card-head">state.table</div>';

    if (table.summary) {
        html += '<div class="wf-table-summary">' + wfEsc(table.summary) + '</div>';
    }

    if (cols.length) {
        html += '<div class="wf-table-wrap"><table class="wf-table"><thead><tr>';
        html += '<th class="wf-table-rownum">#</th>';
        for (var ci = 0; ci < cols.length; ci++) {
            var c = cols[ci];
            html += '<th><div class="wf-table-colname">' + wfEsc(c.name) + '</div>';
            html += '<div class="wf-table-coltype">' + wfEsc(c.type) + '</div>';
            if (c.choices) html += '<div class="wf-table-colmeta">choices: ' + wfEsc(JSON.stringify(c.choices)) + '</div>';
            if (c.rule) html += '<div class="wf-table-colmeta">rule: ' + wfEsc(wfRuleToExpr(c.rule, cols)) + '</div>';
            html += '</th>';
        }
        html += '</tr></thead><tbody>';
        if (rows.length) {
            for (var ri = 0; ri < rows.length; ri++) {
                html += '<tr><td class="wf-table-rownum">' + ri + '</td>';
                for (var ci = 0; ci < cols.length; ci++) {
                    var val = (ri < rows.length && ci < rows[ri].length) ? rows[ri][ci] : '';
                    html += '<td>' + (val ? wfEsc(val) : '<span class="wf-table-empty">&mdash;</span>') + '</td>';
                }
                html += '</tr>';
            }
        } else {
            html += '<tr><td colspan="' + (cols.length + 1) + '" class="wf-table-empty">(no rows)</td></tr>';
        }
        html += '</tbody></table></div>';
    } else {
        html += '<div class="wf-table-empty">(no columns defined)</div>';
    }

    /* Properties */
    var propKeys = Object.keys(props);
    if (propKeys.length) {
        html += '<div class="wf-table-props">';
        for (var i = 0; i < propKeys.length; i++) {
            html += '<span class="wf-table-prop">' + wfEsc(propKeys[i]) + ': ' + wfEsc(String(props[propKeys[i]])) + '</span>';
        }
        html += '</div>';
    }

    html += '</div>';
    return html;
}

function wfRenderExecTable(et) {
    if (!et) return '';
    var cols = et.columns || [];
    var rows = et.rows || [];

    var html = '<div class="wf-card">';
    html += '<div class="wf-card-head">state.execution_table</div>';

    if (!cols.length) {
        html += '<div class="wf-table-empty">(no columns)</div></div>';
        return html;
    }

    /* Column definitions */
    html += '<div class="wf-table-wrap"><table class="wf-table"><thead><tr>';
    html += '<th class="wf-table-rownum">row_id</th>';
    for (var ci = 0; ci < cols.length; ci++) {
        var c = cols[ci];
        html += '<th><div class="wf-table-colname">' + wfEsc(c.name) + '</div>';
        html += '<div class="wf-table-coltype">' + wfEsc(c.type) + '</div>';
        if (c.choices) html += '<div class="wf-table-colmeta">choices: ' + wfEsc(JSON.stringify(c.choices)) + '</div>';
        if (c.rule) html += '<div class="wf-table-colmeta">rule: ' + wfEsc(wfRuleToExpr(c.rule, cols)) + '</div>';
        html += '</th>';
    }
    html += '</tr></thead><tbody>';

    /* Rows */
    for (var ri = 0; ri < rows.length; ri++) {
        var r = rows[ri];
        var rowCls = r.gated ? ' class="wf-row-gated"' : '';
        html += '<tr' + rowCls + '>';
        /* row_id + row-level properties */
        html += '<td class="wf-table-rownum">';
        html += wfEsc(r.row_id || String(r.row));
        html += '<div class="wf-exec-reason">gated: ' + r.gated + '</div>';
        if (r.gated_by && r.gated_by.length) {
            html += '<div class="wf-exec-reason">gated_by: ' + wfEsc(JSON.stringify(r.gated_by)) + '</div>';
        }
        var acc = r.acceptance || {};
        html += '<div class="wf-exec-reason ' + (acc.passed ? 'wf-exec-pass' : 'wf-exec-pending') + '">acceptance.passed: ' + acc.passed + '</div>';
        if (acc.reason) {
            html += '<div class="wf-exec-reason">acceptance.reason: ' + wfEsc(acc.reason) + '</div>';
        }
        html += '</td>';

        /* Cells */
        var cells = r.cells || [];
        for (var ci = 0; ci < cells.length; ci++) {
            var cell = cells[ci];
            var cellStatus = cell.status || 'empty';
            var isCompleted = (cell.display_value && cell.available_actions.indexOf('fill') === -1
                && cell.available_actions.indexOf('sign') === -1
                && cell.available_actions.indexOf('mark_na') === -1
                && cell.available_actions.indexOf('initiate_issue') === -1
                && cellStatus !== 'empty' && cellStatus !== 'locked' && cellStatus !== 'gated' && cellStatus !== 'pending');
            var cls = 'wf-exec-cell wf-exec-' + cellStatus;
            html += '<td class="' + cls + '"' + (isCompleted ? ' data-completed="true"' : '') + '>';
            /* display_value */
            html += '<div>' + (cell.display_value ? wfEsc(cell.display_value) : '<span class="wf-table-empty">&mdash;</span>') + '</div>';
            /* status */
            html += '<div class="wf-exec-reason">status: ' + wfEsc(cell.status || '') + '</div>';
            /* value (when different from display_value or non-empty) */
            if (cell.value && cell.value !== cell.display_value) {
                html += '<div class="wf-exec-reason">value: ' + wfEsc(cell.value) + '</div>';
            }
            /* available_actions */
            if (cell.available_actions && cell.available_actions.length) {
                html += '<div class="wf-exec-reason">actions: ' + wfEsc(JSON.stringify(cell.available_actions)) + '</div>';
            }
            /* locked_reason */
            if (cell.locked_reason) {
                html += '<div class="wf-exec-reason">locked_reason: ' + wfEsc(cell.locked_reason) + '</div>';
            }
            html += '</td>';
        }
        html += '</tr>';
    }

    html += '</tbody></table></div></div>';
    return html;
}

/* Default-verbosity exec table: display_value only, status via CSS, no metadata text */
function wfRenderExecTableDefault(et) {
    if (!et) return '';
    var cols = et.columns || [];
    var rows = et.rows || [];

    var html = '<div class="wf-card">';
    html += '<div class="wf-card-head">Execution Table</div>';

    if (!cols.length) {
        html += '<div class="wf-table-empty">(no columns)</div></div>';
        return html;
    }

    html += '<div class="wf-table-wrap"><table class="wf-table"><thead><tr>';
    html += '<th class="wf-table-rownum">Row</th>';
    for (var ci = 0; ci < cols.length; ci++) {
        var c = cols[ci];
        html += '<th><div class="wf-table-colname">' + wfEsc(c.name) + '</div>';
        html += '<div class="wf-table-coltype">' + wfEsc(c.type) + '</div>';
        if (c.rule) html += '<div class="wf-table-colmeta">rule: ' + wfEsc(wfRuleToExpr(c.rule, cols)) + '</div>';
        html += '</th>';
    }
    html += '</tr></thead><tbody>';

    for (var ri = 0; ri < rows.length; ri++) {
        var r = rows[ri];
        var rowCls = r.gated ? ' class="wf-row-gated"' : '';
        html += '<tr' + rowCls + '>';
        html += '<td class="wf-table-rownum">' + wfEsc(r.row_id || String(r.row)) + '</td>';

        var cells = r.cells || [];
        for (var ci = 0; ci < cells.length; ci++) {
            var cell = cells[ci];
            var cellStatus = cell.status || 'empty';
            var isCompleted = (cell.display_value && cell.available_actions.indexOf('fill') === -1
                && cell.available_actions.indexOf('sign') === -1
                && cell.available_actions.indexOf('mark_na') === -1
                && cell.available_actions.indexOf('initiate_issue') === -1
                && cellStatus !== 'empty' && cellStatus !== 'locked' && cellStatus !== 'gated' && cellStatus !== 'pending');
            var cls = 'wf-exec-cell wf-exec-' + cellStatus;
            html += '<td class="' + cls + '"' + (isCompleted ? ' data-completed="true"' : '') + '>';
            if (cellStatus === 'gated') {
                html += '<span class="wf-table-empty">[BLOCKED]</span>';
            } else if (cellStatus === 'locked') {
                html += '<span class="wf-table-empty">[LOCKED]</span>';
            } else {
                html += (cell.display_value ? wfEsc(cell.display_value) : '<span class="wf-table-empty">&mdash;</span>');
            }
            html += '</td>';
        }
        html += '</tr>';
    }

    html += '</tbody></table></div></div>';
    return html;
}

function wfRenderPage(container, state, msg, feedback) {
    if (!container || !state) return;

    var fieldCategory = {};

    if (feedback) {
        var out = feedback.outcome || {};

        for (var k in out) fieldCategory[k] = 'outcome';
        for (var k in (eff.new_fields || {})) fieldCategory[k] = 'new';
        for (var k in (eff.modified_fields || {})) fieldCategory[k] = 'modified';
        (eff.new_affordances || []).forEach(function(a){ affCategory[a.label] = 'new'; });

    }

    var html = '';
    var s = state.state || {};

    html += '<div class="wf-header">';

        html += '<div class="wf-card">';

    } else if (s.table) {
        html += wfRenderTable(s.table);
    }

    if (state.affordances && state.affordances.length) {
        html += '<div class="wf-card">';
        html += '<div class="wf-card-head">affordances</div>';
        for (var i = 0; i < state.affordances.length; i++) {
            var a = state.affordances[i];
            var cls = 'wf-aff';
            if (/Proceed|Submit/.test(a.label)) cls += ' wf-aff-primary';
            else if (/Go back/.test(a.label)) cls += ' wf-aff-nav';
            else if (/\[Selected\]/.test(a.label)) cls += ' wf-aff-selected';
            if (affCategory[a.label]) cls += ' wf-aff-' + affCategory[a.label];
            html += '<div class="' + cls + '">';
            html += '<div class="wf-aff-top">';
            html += '<span class="wf-aff-id">' + a.id + '</span>';
            var ac = affCategory[a.label];
            var affTag = ac === 'new' ? '<span class="wf-tag-new">NEW</span>' : ac === 'modified' ? '<span class="wf-tag-modified">CHANGED</span>' : '';
            html += '<span class="wf-aff-label">' + wfEsc(a.label) + affTag + '</span>';
            html += '<span class="wf-aff-method">' + wfEsc(a.method) + '</span>';

            }
            html += '</div>';
        }
        html += '</div>';
    }

    container.innerHTML = html;
}

/* ======================================================================
   RENDERER: EXPERIMENTAL A — two-column blueprint layout
   ====================================================================== */
(function() {
    var container;

    function expARenderPage(c, state, msg, feedback) {
        if (!c || !state) return;

        var fieldCategory = {};
        var affCategory = {};
        if (feedback) {
            var out = feedback.outcome || {};
            var eff = feedback.effects || {};
            for (var k in out) fieldCategory[k] = 'outcome';
            for (var k in (eff.new_fields || {})) fieldCategory[k] = 'new';
            for (var k in (eff.modified_fields || {})) fieldCategory[k] = 'modified';
            (eff.new_affordances || []).forEach(function(a){ affCategory[a.label] = 'new'; });
            (eff.modified_affordances || []).forEach(function(a){ affCategory[a.label] = 'modified'; });
        }

        var s = state.state || {};
        var html = '';

        /* ── Top bar: workflow title + node as breadcrumb ── */
        html += '<div class="ex-topbar">';
        html += '<span class="ex-crumb">' + wfEsc(s.workflow || 'Workflow') + '</span>';
        html += '<span class="ex-sep">&rsaquo;</span>';
        html += '<span class="ex-crumb ex-crumb-active">' + wfEsc(s.node_title || s.node) + '</span>';
        html += '</div>';

        /* ── Progress breadcrumb ── */
        var lifecycle = s.lifecycle || [];
        var current = s.lifecycle_current || '';
        var completed = s.lifecycle_completed || [];
        if (lifecycle.length) {
            html += '<div class="ex-progress">';
            for (var i = 0; i < lifecycle.length; i++) {
                var label = lifecycle[i];
                var isCurrent = label === current;
                var isDone = completed.indexOf(label) !== -1;
                if (i > 0) html += '<span class="ex-arrow">&rarr;</span>';
                var cls = 'ex-phase';
                if (isCurrent) cls += ' ex-phase-current';
                else if (isDone) cls += ' ex-phase-done';
                html += '<span class="' + cls + '">' + wfEsc(label) + '</span>';
            }
            html += '</div>';
        }

        /* ── Instructions ── */
        if (state.instructions) {
            html += '<div class="ex-instructions">' + wfEsc(state.instructions) + '</div>';
        }

        html += wfRenderStateProps(state);

        /* ── Table (if present) ── */
        if (s.execution_table) {
            html += wfRenderExecTable(s.execution_table);
        } else if (s.table) {
            html += wfRenderTable(s.table);
        }

        /* ── Two-column body ── */
        html += '<div class="ex-columns">';

        /* Left column: fields */
        html += '<div class="ex-col ex-col-fields">';
        html += '<div class="ex-col-head">state.fields</div>';
        if (s.fields) {
            var fkeys = Object.keys(s.fields);
            if (fkeys.length) {
                html += '<table class="ex-ftable"><thead><tr>';
                html += '<th>Field</th><th>Value</th><th>Options</th><th>Status</th>';
                html += '</tr></thead><tbody>';
                for (var i = 0; i < fkeys.length; i++) {
                    var k = fkeys[i];
                    var f = s.fields[k];
                    var cat = fieldCategory[k] || null;
                    var rowCls = cat ? ' ex-row-' + cat : '';
                    html += '<tr class="' + rowCls + '">';
                    html += '<td class="ex-fname">' + wfEsc(k) + '</td>';
                    if (f && typeof f === 'object' && 'value' in f) {
                        html += '<td class="ex-fval">';
                        if (f.value == null) html += '<span class="ex-unset">—</span>';
                        else html += wfEsc(f.value);
                        if (f.instruction) html += '<div class="ex-finstr">' + wfEsc(f.instruction) + '</div>';
                        html += '</td>';
                        html += '<td class="ex-fopts">';
                        if (f.options) html += wfEsc(f.options.join(', '));
                        html += '</td>';
                    } else {
                        html += '<td class="ex-fval">' + wfRenderValue(f) + '</td>';
                        html += '<td class="ex-fopts"></td>';
                    }
                    var tagMap = {outcome:'SET', 'new':'NEW', modified:'CHG'};
                    html += '<td class="ex-fstatus">';
                    if (cat) html += '<span class="ex-tag ex-tag-' + cat + '">' + tagMap[cat] + '</span>';
                    html += '</td>';
                    html += '</tr>';
                }
                html += '</tbody></table>';
            } else {
                html += '<span class="ex-empty">(empty)</span>';
            }
        } else {
            html += '<span class="ex-empty">(no fields)</span>';
        }
        html += '</div>';

        /* Right column: affordances */
        html += '<div class="ex-col ex-col-affs">';
        html += '<div class="ex-col-head">affordances</div>';
        if (state.affordances && state.affordances.length) {
            html += '<div class="ex-aff-grid">';
            for (var i = 0; i < state.affordances.length; i++) {
                var a = state.affordances[i];
                var cls = 'ex-aff';
                if (/Proceed|Submit/.test(a.label)) cls += ' ex-aff-primary';
                else if (/Go back/.test(a.label)) cls += ' ex-aff-nav';
                else if (/\[Selected\]/.test(a.label)) cls += ' ex-aff-selected';
                if (affCategory[a.label]) cls += ' ex-aff-fb-' + affCategory[a.label];
                html += '<div class="' + cls + '">';
                html += '<div class="ex-aff-head">';
                html += '<span class="ex-aff-idx">' + a.id + '</span>';
                html += '<span class="ex-aff-lbl">' + wfEsc(a.label);
                var ac = affCategory[a.label];
                if (ac === 'new') html += ' <span class="ex-tag ex-tag-new">NEW</span>';
                else if (ac === 'modified') html += ' <span class="ex-tag ex-tag-modified">CHG</span>';
                html += '</span>';
                html += '</div>';
                html += '<div class="ex-aff-meta">';
                html += '<span class="ex-aff-verb">' + wfEsc(a.method) + '</span> ';
                html += '<span class="ex-aff-url">' + wfEsc(a.url) + '</span>';
                html += '</div>';
                html += '<div class="ex-aff-body">' + wfEsc(JSON.stringify(a.body)) + '</div>';
                var pStr = wfRenderParams(a);
                if (pStr) {
                    html += '<div class="ex-aff-opts">' + wfEsc(pStr) + '</div>';
                }
                html += '</div>';
            }
            html += '</div>';
        } else {
            html += '<span class="ex-empty">(none)</span>';
        }
        html += '</div>';

        html += '</div>'; /* close ex-columns */

        c.innerHTML = html;
    }

    var EXP_CSS = ''
        /* Container */
        + '#rc-exp-a { background:#0b1622; color:#b0c4d8; font-family:Consolas,Monaco,"Courier New",monospace; overflow-y:auto; padding:0; }'

/* ======================================================================
   RENDERER: EXPERIMENTAL C — tree outline
   ====================================================================== */
(function() {
    var container;

    function treeVal(v, indent) {
        var pfx = indent;
        if (v == null) return pfx + '(null)\n';
        if (typeof v === 'boolean' || typeof v === 'number') return pfx + String(v) + '\n';
        if (typeof v === 'string') return pfx + '"' + v.replace(/"/g, '\\"') + '"\n';
        if (Array.isArray(v)) {
            if (!v.length) return pfx + '(empty list)\n';
            var out = '';
            for (var i = 0; i < v.length; i++) {
                var isLast = i === v.length - 1;
                var branch = isLast ? '\u2514\u2500 ' : '\u251c\u2500 ';
                var childPfx = indent + (isLast ? '   ' : '\u2502  ');
                if (typeof v[i] === 'object' && v[i] !== null) {
                    out += indent + branch + '[' + i + ']\n';
                    out += treeObj(v[i], childPfx);
                } else {
                    out += indent + branch + treeVal(v[i], '').trim() + '\n';
                }
            }
            return out;
        }
        if (typeof v === 'object') return '\n' + treeObj(v, indent);
        return pfx + String(v) + '\n';
    }

    function treeObj(obj, indent) {
        var keys = Object.keys(obj);
        if (!keys.length) return indent + '(empty)\n';
        var out = '';
        for (var i = 0; i < keys.length; i++) {
            var k = keys[i];
            var isLast = i === keys.length - 1;
            var branch = isLast ? '\u2514\u2500 ' : '\u251c\u2500 ';
            var childPfx = indent + (isLast ? '   ' : '\u2502  ');
            var val = obj[k];
            if (val && typeof val === 'object' && !Array.isArray(val)) {
                out += indent + branch + k + '\n';
                out += treeObj(val, childPfx);
            } else if (Array.isArray(val)) {
                out += indent + branch + k + '\n';
                out += treeVal(val, childPfx);
            } else {
                out += indent + branch + k + ': ' + treeVal(val, '').trim() + '\n';
            }
        }
        return out;
    }

    function expCRenderPage(c, state, msg, feedback) {
        if (!c || !state) return;

        var fieldCategory = {};
        var affCategory = {};
        if (feedback) {
            var out = feedback.outcome || {};
            var eff = feedback.effects || {};
            for (var k in out) fieldCategory[k] = 'outcome';
            for (var k in (eff.new_fields || {})) fieldCategory[k] = 'new';
            for (var k in (eff.modified_fields || {})) fieldCategory[k] = 'modified';
            (eff.new_affordances || []).forEach(function(a){ affCategory[a.label] = 'new'; });
            (eff.modified_affordances || []).forEach(function(a){ affCategory[a.label] = 'modified'; });
        }

        var s = state.state || {};
        var lines = [];

        /* Root */
        lines.push('<span class="tc-root">' + wfEsc(s.workflow || 'Workflow') + '</span>');

        /* Lifecycle */
        var lifecycle = s.lifecycle || [];
        var current = s.lifecycle_current || '';
        var completed = s.lifecycle_completed || [];
        if (lifecycle.length) {
            lines.push('\u251c\u2500 <span class="tc-key">lifecycle</span>');
            for (var i = 0; i < lifecycle.length; i++) {
                var label = lifecycle[i];
                var isLast = i === lifecycle.length - 1;
                var branch = isLast ? '   \u2514\u2500 ' : '   \u251c\u2500 ';
                var cls = 'tc-phase';
                if (label === current) cls = 'tc-phase-cur';
                else if (completed.indexOf(label) !== -1) cls = 'tc-phase-done';
                lines.push(branch + '<span class="' + cls + '">' + wfEsc(label) + '</span>');
            }
        }

        /* Node (node_title rendered here; node raw ID and completed_nodes rendered by lifecycle above) */
        lines.push('\u251c\u2500 <span class="tc-key">node</span>: <span class="tc-node">' + wfEsc(s.node_title || s.node) + '</span>');

        /* Instructions */
        if (state.instructions) {
            lines.push('\u251c\u2500 <span class="tc-key">instructions</span>: <span class="tc-str">' + wfEsc(state.instructions) + '</span>');
        }

        /* Fields */
        if (s.fields) {
            var fkeys = Object.keys(s.fields);
            var hasMore = s.table || (state.affordances && state.affordances.length);
            var fieldBranch = hasMore ? '\u251c\u2500 ' : '\u2514\u2500 ';
            var fieldCont = hasMore ? '\u2502  ' : '   ';
            lines.push(fieldBranch + '<span class="tc-key">state.fields</span>');
            if (fkeys.length) {
                for (var i = 0; i < fkeys.length; i++) {
                    var k = fkeys[i];
                    var f = s.fields[k];
                    var isLast = i === fkeys.length - 1;
                    var fb = isLast ? '\u2514\u2500 ' : '\u251c\u2500 ';
                    var fc = isLast ? '   ' : '\u2502  ';
                    var cat = fieldCategory[k] || null;
                    var tagStr = '';
                    var tagMap = {outcome:'SET', 'new':'NEW', modified:'CHG'};
                    if (cat) tagStr = ' <span class="tc-tag tc-tag-' + cat + '">[' + tagMap[cat] + ']</span>';
                    lines.push(fieldCont + fb + '<span class="tc-fname' + (cat ? ' tc-f-' + cat : '') + '">' + wfEsc(k) + '</span>' + tagStr);
                    if (f && typeof f === 'object' && 'value' in f) {
                        var subPfx = fieldCont + fc;
                        var subParts = [];
                        if (f.value == null) subParts.push('value: <span class="tc-null">(not set)</span>');
                        else subParts.push('value: <span class="tc-str">' + wfEsc(f.value) + '</span>');
                        if (f.instruction) subParts.push('instruction: <span class="tc-instr">' + wfEsc(f.instruction) + '</span>');
                        if (f.options) subParts.push('options: <span class="tc-opts">' + wfEsc(f.options.join(', ')) + '</span>');
                        for (var j = 0; j < subParts.length; j++) {
                            var sIsLast = j === subParts.length - 1;
                            lines.push(subPfx + (sIsLast ? '\u2514\u2500 ' : '\u251c\u2500 ') + subParts[j]);
                        }
                    } else {
                        lines.push(fieldCont + fc + '\u2514\u2500 ' + treeVal(f, '').trim());
                    }
                }
            } else {
                lines.push(fieldCont + '\u2514\u2500 <span class="tc-null">(empty)</span>');
            }
        }

        /* Table — prefer execution_table during execution, fall back to construction table */
        var showExec = !!s.execution_table;
        var tblData = showExec ? s.execution_table : s.table;
        if (tblData) {
            var hasAffs = state.affordances && state.affordances.length;
            var tblBranch = hasAffs ? '\u251c\u2500 ' : '\u2514\u2500 ';
            var tblCont = hasAffs ? '\u2502  ' : '   ';
            var tblKey = showExec ? 'state.execution_table' : 'state.table';
            lines.push(tblBranch + '<span class="tc-key">' + tblKey + '</span>');

            if (showExec) {
                /* Execution table: rows are objects with cells, acceptance, gating */
                var etCols = tblData.columns || [];
                var etRows = tblData.rows || [];
                lines.push(tblCont + '\u251c\u2500 <span class="tc-key">columns</span>');
                for (var ci = 0; ci < etCols.length; ci++) {
                    var cLast = ci === etCols.length - 1;
                    var colExtra = '';
                    if (etCols[ci].choices) colExtra += ' choices=' + JSON.stringify(etCols[ci].choices);
                    if (etCols[ci].rule) colExtra += ' rule=' + wfRuleToExpr(etCols[ci].rule, etCols);
                    lines.push(tblCont + '\u2502  ' + (cLast ? '\u2514\u2500 ' : '\u251c\u2500 ') + '<span class="tc-fname">' + wfEsc(etCols[ci].name) + '</span> <span class="tc-opts">(' + wfEsc(etCols[ci].type) + ')</span>' + (colExtra ? ' <span class="tc-opts">' + wfEsc(colExtra) + '</span>' : ''));
                }
                if (!etCols.length) lines.push(tblCont + '\u2502  \u2514\u2500 <span class="tc-null">(none)</span>');
                lines.push(tblCont + '\u2514\u2500 <span class="tc-key">rows</span> (' + etRows.length + ')');
                for (var ri = 0; ri < etRows.length; ri++) {
                    var rLast = ri === etRows.length - 1;
                    var rb = rLast ? '\u2514\u2500 ' : '\u251c\u2500 ';
                    var rc = rLast ? '   ' : '\u2502  ';
                    var r = etRows[ri];
                    var acc = r.acceptance || {};
                    var gTag = r.gated ? ' <span class="tc-null">[gated:true]</span>' : '';
                    var aTag = acc.passed ? ' <span class="tc-f-new">[acceptance.passed:true]</span>' : ' <span class="tc-null">[acceptance.passed:false]</span>';
                    lines.push(tblCont + '   ' + rb + '<span class="tc-fname">' + wfEsc(r.row_id || 'row ' + r.row) + '</span>' + gTag + aTag);
                    if (r.gated_by && r.gated_by.length) {
                        lines.push(tblCont + '   ' + rc + '\u251c\u2500 <span class="tc-key">gated_by</span>: <span class="tc-str">' + wfEsc(JSON.stringify(r.gated_by)) + '</span>');
                    }
                    if (acc.reason) {
                        lines.push(tblCont + '   ' + rc + '\u251c\u2500 <span class="tc-key">acceptance.reason</span>: <span class="tc-str">' + wfEsc(acc.reason) + '</span>');
                    }
                    var cells = r.cells || [];
                    for (var ci2 = 0; ci2 < cells.length; ci2++) {
                        var cLast2 = ci2 === cells.length - 1;
                        var cell = cells[ci2];
                        var dv = cell.display_value || '';
                        var statusTag = '<span class="tc-opts">[' + (cell.status || '?') + ']</span>';
                        var cellLine = wfEsc(cell.column_name) + ' <span class="tc-opts">(' + wfEsc(cell.column_type) + ')</span> ' + statusTag + ': ' + (dv ? '<span class="tc-str">' + wfEsc(dv) + '</span>' : '<span class="tc-null">\u2014</span>');
                        if (cell.value && cell.value !== cell.display_value) cellLine += ' <span class="tc-opts">value=' + wfEsc(cell.value) + '</span>';
                        if (cell.available_actions && cell.available_actions.length) cellLine += ' <span class="tc-opts">actions=' + wfEsc(JSON.stringify(cell.available_actions)) + '</span>';

                    }
                }
                if (!etRows.length) lines.push(tblCont + '   \u2514\u2500 <span class="tc-null">(none)</span>');
            } else {
                /* Construction table: rows are flat arrays */
                var tbl = tblData;
                var cols = tbl.columns || [];
                var rows = tbl.rows || [];
                if (tbl.summary) {
                    lines.push(tblCont + '\u251c\u2500 summary: <span class="tc-str">' + wfEsc(tbl.summary) + '</span>');
                }
                lines.push(tblCont + '\u251c\u2500 <span class="tc-key">columns</span>');
                for (var ci = 0; ci < cols.length; ci++) {
                    var cLast = ci === cols.length - 1;
                    var cb = cLast ? '\u2514\u2500 ' : '\u251c\u2500 ';
                    var cExtra = '';
                    if (cols[ci].choices) cExtra += ' choices=' + JSON.stringify(cols[ci].choices);
                    if (cols[ci].rule) cExtra += ' rule=' + wfRuleToExpr(cols[ci].rule, cols);
                    lines.push(tblCont + '\u2502  ' + cb + '<span class="tc-fname">' + wfEsc(cols[ci].name) + '</span> <span class="tc-opts">(' + wfEsc(cols[ci].type) + ')</span>' + (cExtra ? ' <span class="tc-opts">' + wfEsc(cExtra) + '</span>' : ''));
                }
                if (!cols.length) lines.push(tblCont + '\u2502  \u2514\u2500 <span class="tc-null">(none)</span>');
                var hasProps = tbl.properties && Object.keys(tbl.properties).length;
                var rowBranch = hasProps ? '\u251c\u2500 ' : '\u2514\u2500 ';
                lines.push(tblCont + rowBranch + '<span class="tc-key">rows</span> (' + rows.length + ')');
                for (var ri = 0; ri < rows.length; ri++) {
                    var rLast = ri === rows.length - 1;
                    var rb = rLast ? '\u2514\u2500 ' : '\u251c\u2500 ';
                    var rc = rLast ? '   ' : '\u2502  ';
                    var rowPfx = tblCont + (hasProps ? '\u2502  ' : '   ');
                    lines.push(rowPfx + rb + '<span class="tc-fname">row ' + ri + '</span>');
                    for (var ci2 = 0; ci2 < rows[ri].length; ci2++) {
                        var cLast2 = ci2 === rows[ri].length - 1;
                        var cn = cols[ci2] ? cols[ci2].name : 'col-' + ci2;

                        lines.push(rowPfx + rc + (cLast2 ? '\u2514\u2500 ' : '\u251c\u2500 ') + wfEsc(cn) + ': ' + (cv ? '<span class="tc-str">' + wfEsc(cv) + '</span>' : '<span class="tc-null">\u2014</span>'));

                if (!rows.length) lines.push(tblCont + (hasProps ? '\u2502  ' : '   ') + '\u2514\u2500 <span class="tc-null">(none)</span>');
                if (hasProps) {
                    lines.push(tblCont + '\u2514\u2500 <span class="tc-key">properties</span>');
                    var pk = Object.keys(tbl.properties);

        }

        /* Extra state keys (generic rendering for unknown keys) */
        var extraProps = wfRenderStateProps(state);
        if (extraProps) {
            lines.push('\u251c\u2500 <span class="tc-key">(extra state)</span>');
            lines.push('   ' + extraProps.replace(/<[^>]+>/g, '').substring(0, 200));

        /* Affordances */
        if (state.affordances && state.affordances.length) {

            for (var i = 0; i < state.affordances.length; i++) {

                var isLast = i === state.affordances.length - 1;
                var ab = isLast ? '   \u2514\u2500 ' : '   \u251c\u2500 ';
                var ac2 = isLast ? '      ' : '   \u2502  ';
                var acCat = affCategory[a.label] || null;
                var acTag = '';
                if (acCat === 'new') acTag = ' <span class="tc-tag tc-tag-new">[NEW]</span>';
                else if (acCat === 'modified') acTag = ' <span class="tc-tag tc-tag-modified">[CHG]</span>';
                var affCls = 'tc-aff';
                if (/Proceed|Submit/.test(a.label)) affCls += ' tc-aff-primary';

                lines.push(ab + '<span class="tc-aff-id">[' + a.id + ']</span> <span class="' + affCls + '">' + wfEsc(a.label) + '</span>' + acTag);

                var pStr = wfRenderParams(a);

        c.querySelector('.tc-content').innerHTML = lines.join('\n');
