    prompt: Fill in all fields describing the change, then advance.
    fields:
      title:
        name: title
        type: string
        value: Create claude-qms Starter Repo, Harden qms init
      change_type:
        name: change_type
        type: string
      initiator:
        name: initiator
        type: string
      purpose:
        name: purpose
        type: string
        value: End users have no canonical way to obtain the QMS framework. qms init
          currently unpacks seed/ into whatever directory it is run from with no guard
          beyond collision checks and no confirmation. This CR creates claude-qms
          as the canonical distribution repo and hardens qms init with marker-based
          targeting and a confirmation prompt.
      scope:
        name: scope
        type: string
        value: 'qms-cli: redesign qms init (marker detection, confirmation prompt,
          --yes flag, --root marker placement, no-context error). New repo: whharris917/claude-qms
          with .claude-qms marker, qms-cli submodule, README.md. SDLC-QMS-RS/RTM update.
          SDLC-CQ namespace registration.'
      current_state:
        name: current_state
        type: string
      proposed_state:
        name: proposed_state
        type: string
      risk_assessment:
        name: risk_assessment
        type: string
