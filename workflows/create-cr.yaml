name: create-cr
state: committed
home: ask-code
nodes:
  ask-code:
    id: ask-code
    label: Code Impact
    prompt: "Does this change affect any code? Enter 'yes' or 'no'."
    exit_hooks:
    - set_workspace:cr_type:cr-non-code
    fields:
      affects_code:
        name: affects_code
        type: string
    edges:
    - target: ask-submodule
      condition: affects_code==yes
    - target: generate-cr
      condition: affects_code==no
  ask-submodule:
    id: ask-submodule
    label: Submodule Involvement
    prompt: |
      Do the code changes involve a controlled submodule? Enter 'yes' or 'no'.
      Controlled submodules: flow-state, qms-cli, claude-qms, Quality-Manual, qms-workflow-engine
    exit_hooks:
    - set_workspace:cr_type:cr-code-no-submodule
    fields:
      involves_submodule:
        name: involves_submodule
        type: string
    edges:
    - target: select-system
      condition: involves_submodule==yes
    - target: generate-cr
      condition: involves_submodule==no
  select-system:
    id: select-system
    label: Target System
    prompt: |
      Which controlled submodule does this change target? Enter the exact name.
      Controlled submodules: flow-state, qms-cli, claude-qms, Quality-Manual, qms-workflow-engine
      SDLC-governed (full dev+review cycle required): flow-state, qms-cli, qms-workflow-engine
    exit_hooks:
    - validate_field_in_db:system:controlled_submodules
    - lookup_entity_props:system:submodule_properties
    fields:
      system:
        name: system
        type: string
    edges:
    - target: generate-cr
  generate-cr:
    id: generate-cr
    label: Generate CR
    prompt: All routing information collected. Advance to generate the CR workflow.
    exit_hooks:
    - load_workflow
    edges:
    - target: done
  done:
    id: done
    label: Done
