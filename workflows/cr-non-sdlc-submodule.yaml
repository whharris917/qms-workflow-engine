name: cr-non-sdlc-submodule
state: draft
home: define
nodes:
  define:
    id: define
    label: Change Overview
    prompt: Fill in all fields describing this change, then advance to review the execution
      items.
    fields:
      title:
        name: title
        type: string
      change_type:
        name: change_type
        type: string
      initiator:
        name: initiator
        type: string
      purpose:
        name: purpose
        type: string
        block: true
      scope:
        name: scope
        type: string
        block: true
      current_state:
        name: current_state
        type: string
        block: true
      proposed_state:
        name: proposed_state
        type: string
        block: true
    edges:
    - target: review-eis
  review-eis:
    id: review-eis
    label: Review Execution Items
    scaffold: true
    prompt: Review the execution items for this change. Do you need to add more? Enter
      'yes' or 'no'.
    fields:
      needs_additional:
        name: needs_additional
        type: string
    edges:
    - target: add-eis
      condition: needs_additional==yes
    - target: ei-1
      condition: needs_additional==no
  add-eis:
    id: add-eis
    label: Additional Execution Items
    scaffold: true
    prompt: List additional execution items, one per line. On advance, they will be
      appended to the chain.
    exit_hooks:
    - extend_chain:ei:additional_eis
    fields:
      additional_eis:
        name: additional_eis
        type: string
    edges:
    - target: ei-1
  ei-1:
    id: ei-1
    template_id: ei
    label: Execution Items
    prompt: Execute this item. Fill all fields, then advance.
    fields:
      task_description:
        name: task_description
        type: string
        value: Pre-execution baseline commit
        writable: false
      vr_required:
        name: vr_required
        type: bool
      execution_summary:
        name: execution_summary
        type: string
      outcome:
        name: outcome
        type: string
      performed_by:
        name: performed_by
        type: string
      date:
        name: date
        type: string
    edges:
    - target: ei-2
      condition: outcome==Pass
    - target: '{var}'
      condition: outcome==Fail
      spawns_workflow: var
  ei-2:
    id: ei-2
    template_id: ei
    label: Execution Items
    prompt: Execute this item. Fill all fields, then advance.
    fields:
      task_description:
        name: task_description
        type: string
        value: Implement the change in the controlled submodule
        writable: false
      vr_required:
        name: vr_required
        type: bool
      execution_summary:
        name: execution_summary
        type: string
      outcome:
        name: outcome
        type: string
      performed_by:
        name: performed_by
        type: string
      date:
        name: date
        type: string
    edges:
    - target: ei-3
      condition: outcome==Pass
    - target: '{var}'
      condition: outcome==Fail
      spawns_workflow: var
  ei-3:
    id: ei-3
    template_id: ei
    label: Execution Items
    prompt: Execute this item. Fill all fields, then advance.
    fields:
      task_description:
        name: task_description
        type: string
        value: Verify the change in the controlled submodule
        writable: false
      vr_required:
        name: vr_required
        type: bool
      execution_summary:
        name: execution_summary
        type: string
      outcome:
        name: outcome
        type: string
      performed_by:
        name: performed_by
        type: string
      date:
        name: date
        type: string
    edges:
    - target: ei-4
      condition: outcome==Pass
    - target: '{var}'
      condition: outcome==Fail
      spawns_workflow: var
  ei-4:
    id: ei-4
    template_id: ei
    label: Execution Items
    prompt: Execute this item. Fill all fields, then advance.
    fields:
      task_description:
        name: task_description
        type: string
        value: Post-execution baseline commit
        writable: false
      vr_required:
        name: vr_required
        type: bool
      execution_summary:
        name: execution_summary
        type: string
      outcome:
        name: outcome
        type: string
      performed_by:
        name: performed_by
        type: string
      date:
        name: date
        type: string
    edges:
    - target: done
      condition: outcome==Pass
    - target: '{var}'
      condition: outcome==Fail
      spawns_workflow: var
  done:
    id: done
    label: Done
