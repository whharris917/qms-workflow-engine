{% extends "base.html" %}
{% block title %}{{ workflow_title }} — {{ instance_id }}{% endblock %}
{% block content %}
<style>
    .view-frame {
        position: relative; overflow: hidden;
        border: 2px solid #7c3aed; border-radius: 6px;
        min-height: calc(100vh - 6rem);
        margin-top: 2.5rem;
    }
    .renderer-container {
        display: none; width: 100%; min-height: calc(100vh - 6rem);
    }
    .renderer-container.active { display: block; }
    #rc-raw { overflow-y: auto; padding: 0.75rem; background: #0a0a0a; }

    /* Floating controls */
    .floating-controls {
        position: fixed; top: 1rem; right: 1.25rem; z-index: 100;
        display: flex; gap: 0.5rem; align-items: center;
    }
    .float-btn {
        background: #1a1a2e; color: #ccc; border: 1px solid #444;
        border-radius: 6px; padding: 0.4rem 0.8rem; font-size: 0.8rem;
        cursor: pointer; transition: background 0.15s, color 0.15s;
        font-family: inherit;
    }
    .float-btn.active {
        background: #4a9eff; color: #fff; border-color: #4a9eff;
    }
    .float-sep {
        color: #999; font-size: 0.7rem; user-select: none;
    }
</style>

<div class="view-frame" id="view-frame">
    <!-- Renderer containers injected by JS -->
</div>

<div class="floating-controls">
    <button class="float-btn" id="renderer-toggle" onclick="toggleRenderer()">Human</button>
    <button class="float-btn" id="btn-view-mode" onclick="toggleViewMode()">Full</button>
</div>

<script src="/static/schematic.js"></script>
<script>
window._WFE_ALLOWED_RENDERERS = {{ renderers|safe }};
window._WFE_STREAM_URL = '{{ stream_url }}';
</script>
<script src="/static/renderers/registry.js"></script>
<script src="/static/renderers/raw.js"></script>
<script src="/static/renderers/simple-shared.js"></script>
<script src="/static/renderers/simple.js"></script>
<script>
/* ── SSE ── */
function connect() {
    var es = new EventSource(window._WFE_STREAM_URL);
    es.onerror = function() { es.close(); setTimeout(connect, 3000); };
    es.onmessage = function(e) {
        var ev = JSON.parse(e.data);
        if (ev.type === 'init') {
            if (ev.page) extractState(ev.page, ev.last_feedback || null);
            return;
        }
        if (ev.type === 'navigate') {
            if (ev.content) extractState(ev.content);
        }
        if (ev.type === 'result' && ev.result) {
            extractState(ev.result, ev.feedback || null);
        }
    };
}

/* ── Boot ── */
setMode('light');
connect();
</script>
{% endblock %}
