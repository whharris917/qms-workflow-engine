<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Observer: {{ workflow_title }}</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Consolas', 'Monaco', monospace; background: #0a0a0a; color: #aaa; }
        .header {
            display: flex; align-items: center; gap: 1.5rem;
            padding: 0.6rem 1rem; background: #111; border-bottom: 1px solid #222;
        }
        .header h1 { font-size: 0.85rem; color: #4a9eff; letter-spacing: 0.1em; text-transform: uppercase; }
        .status { font-size: 0.8rem; }
        .status-label { color: #555; }
        .connected { color: #4caf50; }
        .disconnected { color: #c0392b; }
        .path-value { color: #e6a817; }
        .mode-toggle {
            display: flex; gap: 0; margin-left: auto;
        }
        .mode-btn {
            padding: 0.3rem 0.8rem; font-size: 0.75rem; font-family: inherit;
            background: #1a1a1a; color: #666; border: 1px solid #333;
            cursor: pointer; text-transform: uppercase; letter-spacing: 0.05em;
        }
        .mode-btn:first-child { border-radius: 3px 0 0 3px; }
        .mode-btn:last-child { border-radius: 0 3px 3px 0; }
        .mode-btn + .mode-btn { border-left: none; }
        .mode-btn.active { background: #4a9eff; color: #fff; border-color: #4a9eff; }
        .panels { display: flex; height: calc(100vh - 2.2rem); }
        .panel-view {
            flex: 1; display: flex; flex-direction: column;
        }
        .view-frame {
            flex: 1; background: #111; overflow: hidden;
            color: #ccc; font-size: 0.85rem; position: relative;
        }

        /* Renderer containers — each renderer owns its container fully */
        .renderer-container {
            display: none; width: 100%; height: 100%;
            position: absolute; top: 0; left: 0;
        }
        .renderer-container.active { display: block; }

        /* Raw renderer */
        #rc-raw { overflow-y: auto; padding: 0.75rem; }
    </style>
</head>
<body>
    <div class="header">
        <h1>Observer: {{ workflow_title }} <span style="font-size:0.6em;color:#888;font-weight:normal">{{ instance_id }}</span></h1>
        <div class="status">
            <span class="status-label">stream:</span>
            <span id="conn" class="disconnected">off</span>
        </div>
        <div class="status">
            <span class="status-label">node:</span>
            <span id="path" class="path-value">&mdash;</span>
        </div>
        <div class="mode-toggle" id="mode-toggle"></div>
        <span style="color:#333;margin:0 0.3rem;">|</span>
        <div class="mode-toggle" id="view-toggle">
            <button class="mode-btn active" id="btn-full" onclick="setViewMode('full')">Full</button>
            <button class="mode-btn" id="btn-feedback" onclick="setViewMode('feedback')">Feedback</button>
        </div>
    </div>
    <div class="panels">
        <div class="panel-view">
            <div class="view-frame" id="view-frame">
                <!-- Renderer containers are injected here by JS -->
            </div>
        </div>
    </div>
<script src="/static/schematic.js"></script>
<script>
/* Jinja-dependent variables — injected inline */
window._WFE_ALLOWED_RENDERERS = {{ renderers|safe }};
window._WFE_STREAM_URL = '{{ stream_url }}';
</script>
<script src="/static/renderers/registry.js"></script>
<script src="/static/renderers/raw.js"></script>
<script src="/static/renderers/simple-shared.js"></script>
<script src="/static/renderers/simple.js"></script>
<script src="/static/renderers/exp-a.js"></script>
<script src="/static/renderers/exp-b.js"></script>
<script src="/static/renderers/exp-c.js"></script>
<script>
/* ======================================================================
   SSE CONNECTION
   ====================================================================== */
var connEl = document.getElementById('conn');
var pathEl = document.getElementById('path');

function connect() {
    var es = new EventSource(window._WFE_STREAM_URL);
    es.onopen = function() { connEl.textContent='live'; connEl.className='connected'; };
    es.onerror = function() { connEl.textContent='off'; connEl.className='disconnected'; es.close(); setTimeout(connect,3000); };
    es.onmessage = function(e) {
        var ev = JSON.parse(e.data);
        if (ev.type === 'init') {
            var pageState = (ev.page && ev.page.state) || {};
            pathEl.textContent = pageState.node || pageState.position || ev.current_path || '\u2014';
            if (ev.page) extractState(ev.page, ev.last_feedback || null);
            return;
        }
        if (ev.type === 'navigate') {
            pathEl.textContent = ev.path || '';
            if (ev.content) extractState(ev.content);
        }
        if (ev.type === 'result' && ev.result) {
            var s = ev.result.state || {};
            pathEl.textContent = s.node || s.position || '';
            extractState(ev.result, ev.feedback || null);
        }
    };
}

/* ── Boot ── */
/* Build hierarchical mode toggle from registered renderers */
buildModeToggle();
/* Default to the first renderer after raw */
var bootId = (allowedRenderers.length > 1 ? allowedRenderers[1] : allowedRenderers[0]) || 'raw';
var bootRenderer = renderers[bootId];
if (bootRenderer && bootRenderer.format) {
    selectFormat(bootRenderer.format);
} else {
    selectFormat('raw');
}
connect();
</script>
</body>
</html>
