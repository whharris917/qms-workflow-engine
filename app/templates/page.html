<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ title }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div id="page-content">{{ page_html }}</div>
    <script src="{{ url_for('static', filename='eigenform.js') }}"></script>
    <script>
        /* SSE: reload page when another client mutates state.
           Suppress for 500ms after this tab's own POSTs. */
        var _selfUpdated = 0;
        document.addEventListener('click', function(e) {
            if (e.target.closest('[data-ef-post]')) _selfUpdated = Date.now();
        });
        document.addEventListener('submit', function(e) {
            if (e.target.closest('form[data-ef-submit]')) _selfUpdated = Date.now();
        });
        document.addEventListener('change', function(e) {
            if (e.target.closest('[data-ef-change]')) _selfUpdated = Date.now();
        });

        var source = new EventSource('/pages/{{ instance_id }}/stream');
        source.onmessage = function(event) {
            if (Date.now() - _selfUpdated < 500) return;
            var scrollY = window.scrollY;
            fetch('/pages/{{ instance_id }}', {
                headers: {'Accept': 'text/html'}
            }).then(function(resp) {
                return resp.text();
            }).then(function(html) {
                var doc = new DOMParser().parseFromString(html, 'text/html');
                var content = doc.getElementById('page-content');
                if (content) {
                    document.getElementById('page-content').innerHTML = content.innerHTML;
                    window.scrollTo(0, scrollY);
                }
            });
        };
    </script>
</body>
</html>
