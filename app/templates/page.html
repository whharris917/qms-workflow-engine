{% extends "base.html" %}

{% block title %}{{ title }}{% endblock %}

{% block head_extra %}
{% if theme_css %}
<link rel="stylesheet" href="{{ url_for('static', filename=theme_css) }}">
{% endif %}
{% endblock %}

{% block content %}
<div id="page-content">{{ page_html }}</div>
<div class="c-page-footer">
    <label class="c-debug-toggle" id="debug-toggle">
        <input type="checkbox" id="debug-checkbox" onchange="toggleDebug(this.checked)">
        Debug Mode
    </label>
</div>
{% endblock %}

{% block scripts %}
<script>
    /* Debug Mode toggle:
       Off = operator-view + sleek theme (clean production look)
       On  = supervisor-view + default theme (full borders, chrome, JSON pane) */
    function _applyDebug() {
        var debug = localStorage.getItem('c-debug') === 'true';
        document.body.classList.toggle('supervisor-view', debug);
        document.body.classList.toggle('operator-view', !debug);
        document.getElementById('debug-checkbox').checked = debug;
        if (debug) {
            document.body.removeAttribute('data-theme');
        } else {
            document.body.setAttribute('data-theme', 'sleek');
        }
    }
    function toggleDebug(on) {
        var wasDebug = localStorage.getItem('c-debug') === 'true';
        localStorage.setItem('c-debug', on ? 'true' : 'false');
        /* Theme change requires server reload (templates are theme-dependent) */
        var needsReload = (on && _getThemeCookie() !== 'default') ||
                          (!on && _getThemeCookie() !== 'sleek');
        document.cookie = 'c-theme=' + (on ? 'default' : 'sleek') + ';path=/;max-age=31536000';
        if (needsReload) {
            location.reload();
        } else {
            _applyDebug();
        }
    }
    function _getThemeCookie() {
        var m = document.cookie.match(/(?:^|;\s*)c-theme=(\w+)/);
        return m ? m[1] : null;
    }

    /* Apply on load */
    _applyDebug();
</script>
<script src="{{ url_for('static', filename='morphdom-umd.min.js') }}"></script>
<script src="{{ url_for('static', filename='component.js') }}"></script>
<script>
    /* SSE: reload page when another client mutates state.
       Suppress for 500ms after this tab's own POSTs. */
    var _selfUpdated = 0;
    document.addEventListener('click', function(e) {
        if (e.target.closest('[data-c-post]')) _selfUpdated = Date.now();
    });
    document.addEventListener('submit', function(e) {
        if (e.target.closest('form[data-c-submit]')) _selfUpdated = Date.now();
    });
    document.addEventListener('change', function(e) {
        if (e.target.closest('[data-c-change]')) _selfUpdated = Date.now();
    });

    var source = new EventSource('/pages/{{ instance_id }}/stream');
    source.onmessage = function(event) {
        if (Date.now() - _selfUpdated < 500) return;
        fetch('/pages/{{ instance_id }}', {
            headers: {'Accept': 'text/html'}
        }).then(function(resp) {
            return resp.text();
        }).then(function(html) {
            var doc = new DOMParser().parseFromString(html, 'text/html');
            var content = doc.getElementById('page-content');
            if (content) _cSwap(content.innerHTML);
        });
    };
</script>
{% endblock %}
