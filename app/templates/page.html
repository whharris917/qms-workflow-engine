<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ title }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div id="page-content" hx-target="#page-content" hx-swap="innerHTML" hx-ext="json-enc">{{ page_html }}</div>
    <script src="{{ url_for('static', filename='htmx.min.js') }}"></script>
    <script src="{{ url_for('static', filename='json-enc.js') }}"></script>
    <script src="{{ url_for('static', filename='eigenform.js') }}"></script>
    <script>
        var source = new EventSource('/pages/{{ page_key }}/stream');
        source.onmessage = function(event) {
            fetch('/pages/{{ page_key }}', {
                headers: {'Accept': 'text/html'}
            }).then(function(resp) {
                return resp.text();
            }).then(function(html) {
                /* Response is full page — extract page-content div */
                var doc = new DOMParser().parseFromString(html, 'text/html');
                var content = doc.getElementById('page-content');
                if (content) {
                    document.getElementById('page-content').innerHTML = content.innerHTML;
                    htmx.process(document.getElementById('page-content'));
                }
            });
        };
    </script>
</body>
</html>
