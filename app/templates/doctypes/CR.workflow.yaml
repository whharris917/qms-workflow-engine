# CR Workflow — Process Schema
# Defines how a Change Record is populated, reviewed, and closed.
# References fields from CR.template.yaml by id.
# Controls visibility, editability, transitions, gates, and actors.

template: CR
name: Create Change Record

stages:
  - id: initiation
    label: Initiation
    description: Classify the change and provide initial context.
    actor: initiator
    fields:
      - id: title
        editable: true
      - id: affects_code
        editable: true
      - id: affects_submodule
        editable: true
        visible_when:
          field: affects_code
          equals: true
      - id: submodule
        editable: true
        visible_when:
          field: affects_submodule
          equals: true
        indicators:
          - when:
              selected_has_tag: sdlc
            style: warning
            text: This submodule contains an SDLC-governed system. Additional verification requirements apply.
          - when:
              selected_lacks_tag: sdlc
            style: success
            text: This submodule does not contain an SDLC-governed system.
      - id: purpose
        editable: true
    on_advance:
      - assign_id
    next: definition

  - id: definition
    label: Change Definition
    description: Full specification of the change — scope, justification, impact, and execution plan.
    actor: initiator
    fields:
      # Initiation fields remain visible but read-only
      - id: title
        editable: true
      - id: affects_code
        editable: true
      - id: affects_submodule
        editable: true
        visible_when:
          field: affects_code
          equals: true
      - id: submodule
        editable: true
        visible_when:
          field: affects_submodule
          equals: true
      - id: purpose
        editable: true
      # Definition fields
      - id: scope
        editable: true
      - id: current_state
        editable: true
      - id: proposed_state
        editable: true
      - id: change_description
        editable: true
      - id: justification
        editable: true
      - id: impact
        editable: true
      - id: testing_summary
        editable: true
      - id: implementation_plan
        editable: true
    gate:
      required_fields: [title, purpose, scope_changes, current_state, proposed_state, change_description, justification]
    on_advance:
      - route_for_review
    next: pre_review

  - id: pre_review
    label: Pre-Review
    description: Technical review of the change definition before approval to proceed.
    actor: reviewer
    fields:
      # All fields visible, none editable — reviewer reads and evaluates
      - id: title
      - id: affects_code
      - id: affects_submodule
        visible_when:
          field: affects_code
          equals: true
      - id: submodule
        visible_when:
          field: affects_submodule
          equals: true
      - id: purpose
      - id: scope
      - id: current_state
      - id: proposed_state
      - id: change_description
      - id: justification
      - id: impact
      - id: testing_summary
      - id: implementation_plan
    actions:
      - id: approve
        label: Recommend Approval
        next: pre_approval
      - id: reject
        label: Return for Revision
        next: definition
        on_action:
          - add_review_comment

  - id: pre_approval
    label: Pre-Approval
    description: QA approval to begin execution.
    actor: qa
    fields:
      - id: title
      - id: purpose
      - id: change_description
      - id: implementation_plan
    actions:
      - id: approve
        label: Approve for Execution
        next: execution
      - id: reject
        label: Return for Revision
        next: definition

  - id: execution
    label: Execution
    description: Implementation of the change per the approved plan.
    actor: initiator
    fields:
      - id: implementation_plan
        editable: true
        mode: execute
    gate:
      plan_complete: true
    on_advance:
      - route_for_review
    next: post_review

  - id: post_review
    label: Post-Review
    description: Technical review of the completed execution.
    actor: reviewer
    fields:
      - id: title
      - id: change_description
      - id: implementation_plan
        mode: review
    actions:
      - id: approve
        label: Recommend Closure
        next: post_approval
      - id: reject
        label: Return for Rework
        next: execution

  - id: post_approval
    label: Post-Approval
    description: QA approval to close.
    actor: qa
    fields:
      - id: title
      - id: implementation_plan
        mode: review
    actions:
      - id: approve
        label: Approve for Closure
        next: closure
      - id: reject
        label: Return for Rework
        next: execution

  - id: closure
    label: Closure
    description: Final release and archival.
    actor: initiator
    on_enter:
      - lock_all_fields
      - set_status_closed
