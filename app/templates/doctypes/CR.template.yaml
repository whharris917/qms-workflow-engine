# CR Template — Data Schema
# Defines what a Change Record IS: its fields, types, and structure.
# Says nothing about when fields appear, who fills them, or what
# happens on transitions — that's the workflow's job.

name: Change Record
abbreviation: CR
id_format: "CR-{number:03d}"

fields:
  # --- Classification ---

  - id: title
    label: Document Title
    type: string
    hint: A short, descriptive title for this Change Record.
    placeholder: "e.g. Redesign workflow engine from first principles"
    required: true

  - id: affects_code
    label: Code Impact
    type: boolean
    hint: Does this change affect code (as opposed to documents only)?

  - id: affects_submodule
    label: Controlled Submodule
    type: boolean
    hint: Does it affect a controlled submodule?

  - id: submodule
    label: Target Submodule
    type: enum
    options:
      - value: flow-state
        label: flow-state
        tags: [sdlc]
      - value: qms-cli
        label: qms-cli
        tags: [sdlc]
      - value: qms-workflow-engine
        label: qms-workflow-engine
        tags: [sdlc]
      - value: claude-qms
        label: claude-qms
      - value: Quality-Manual
        label: Quality-Manual

  - id: purpose
    label: Purpose
    type: text
    hint: What problem does this CR solve? What improvement does it introduce?
    rows: 3
    required: true

  # --- Scope ---

  - id: scope
    label: Scope
    type: group
    hint: Brief overview of affected system(s) or functionality.
    children:
      - id: scope_context
        label: Context
        type: text
        hint: Reference to parent document (INV) if applicable, or origin of the change.
        rows: 2

      - id: scope_changes
        label: Changes Summary
        type: text
        hint: High-level description of what will change.
        rows: 2

      - id: scope_files
        label: Files Affected
        type: text
        hint: List of files/documents to be modified or created.
        rows: 2

  # --- Change Specification ---

  - id: current_state
    label: Current State
    type: text
    hint: Concise declarative statement(s) describing what exists now. Use present tense.
    rows: 3

  - id: proposed_state
    label: Proposed State
    type: text
    hint: Concise declarative statement(s) describing what will exist after the change. Use present tense.
    rows: 3

  - id: change_description
    label: Change Description
    type: text
    hint: >
      Full technical details of the change. Structure is flexible based on
      complexity — may include subsections, diagrams, code snippets, or
      other explanatory content as needed.
    rows: 6

  - id: justification
    label: Justification
    type: text
    hint: >
      Why is this change needed? Explain: the problem being solved or
      improvement being made; impact of not making this change; how the
      proposed solution addresses the root cause.
    rows: 4

  # --- Impact ---

  - id: impact
    label: Impact Assessment
    type: group
    hint: Assessment of change impact across domains.
    children:
      - id: impact_files
        label: Files Affected
        type: text
        hint: Code files, configuration files.
        rows: 2

      - id: impact_documents
        label: Documents Affected
        type: text
        hint: SOPs, specifications, other controlled documents.
        rows: 2

      - id: impact_other
        label: Other
        type: text
        hint: External systems, interfaces, dependencies.
        rows: 2

  # --- Verification ---

  - id: testing_summary
    label: Testing Summary
    type: text
    hint: >
      Description of how the implementation will be verified. For code
      changes, address both automated verification (unit tests, CI) and
      integration verification (behavioral checks, flag EIs with VR=Yes).
      For document-only CRs, procedural verification is sufficient.
    rows: 4

  # --- Execution ---

  - id: implementation_plan
    label: Implementation Plan
    type: plan_table
    hint: >
      The structured execution plan for this change — execution items (EIs),
      prerequisites, dependencies, and verification requirements.
