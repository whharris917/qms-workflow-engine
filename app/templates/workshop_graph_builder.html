{% extends "base.html" %}
{% block title %}Graph Builder &middot; Workshop &middot; Razem{% endblock %}
{% block content %}
<div class="gb">

  <nav class="gb__topbar">
    <a class="gb__back" href="/workshop" aria-label="Back to workshop">&larr;</a>
    <h1 class="gb__title">Graph Builder</h1>
  </nav>

  <div class="gb__canvas">
    <div class="gb__stem"></div>
  </div>

</div>

<style>
/* Scoped to .gb. The stem is a vertical thread with components stacked
   along it as chat-bubble rows (avatar on the thread + body to the right).
   Mirrors the visual language of the Nesting Visualizations workshop:
   gradient indigo→violet thread, 28px gradient avatars, uppercase
   tracked meta labels, glass sub-panels for form-style components,
   chip-pill tab strips and stepped sequence lists for containers. */

.gb {
    --gb-accent:    #6366f1;
    --gb-accent-2:  #a855f7;
    --gb-pink:      #ec4899;
    --gb-text:      #1f2144;
    --gb-muted:     #4a4e6d;
    --gb-subtle:    #8088a8;
    --gb-font:      -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, "Helvetica Neue", sans-serif;

    position: relative;
    margin: -2rem;                 /* bleed past base.html's .content padding */
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    font-family: var(--gb-font);
    font-size: 14px;
    color: var(--gb-text);

    background:
        radial-gradient(at 15% 20%, #ffe3f0 0%, transparent 55%),
        radial-gradient(at 85% 15%, #c8d8ff 0%, transparent 55%),
        radial-gradient(at 70% 85%, #d9c8ff 0%, transparent 55%),
        radial-gradient(at 20% 90%, #c4f0f4 0%, transparent 55%),
        linear-gradient(160deg, #f7f9ff 0%, #fdf4ff 100%);
    background-attachment: fixed;
}

/* ----- Topbar ----- */
.gb__topbar {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 12px 20px;
    border-bottom: 1px solid rgba(160, 180, 220, 0.22);
    background: rgba(255, 255, 255, 0.35);
    backdrop-filter: blur(14px) saturate(160%);
    -webkit-backdrop-filter: blur(14px) saturate(160%);
}
.gb__back {
    color: var(--gb-muted);
    text-decoration: none;
    font-size: 1.1rem;
    line-height: 1;
    padding: 4px 8px;
    border-radius: 6px;
    transition: color 0.12s, background 0.12s;
}
.gb__back:hover {
    color: var(--gb-text);
    background: rgba(255, 255, 255, 0.5);
}
.gb__title {
    margin: 0;
    font-size: 1.05rem;
    font-weight: 600;
    color: var(--gb-text);
    letter-spacing: -0.005em;
}

/* ----- Canvas ----- */
.gb__canvas {
    flex: 1;
    position: relative;
    overflow: auto;
    display: flex;
    justify-content: center;
    padding: 80px 24px;
}

/* ----- Stem -----
   Each child row has its avatar at left:0 (28px wide), so its center
   sits at x=14 — exactly where the ::before thread runs. The 14px
   top/bottom insets on the thread match the avatar's vertical center
   in its row, so the thread aligns with the first and last avatars. */
.gb__stem {
    position: relative;
    display: flex;
    flex-direction: column;
    gap: 24px;
    width: 100%;
    max-width: 720px;
    min-height: 240px;            /* growth area visible in the empty state */
}
.gb__stem::before {
    content: '';
    position: absolute;
    left: 14px;
    top: 14px; bottom: 14px;
    width: 2px;
    background: linear-gradient(to bottom,
        rgba(99, 102, 241, 0.40) 0%,
        rgba(99, 102, 241, 0.65) 30%,
        var(--gb-accent-2) 100%);
    border-radius: 1px;
    pointer-events: none;
    z-index: 0;
}

/* Each row sits on the thread: avatar (28px) on the left, body to the
   right. Body has a 12px gap from the avatar. */
.gb__row {
    position: relative;
    z-index: 1;
    display: flex;
    align-items: flex-start;
    gap: 12px;
}

/* ----- Avatars ----- */
.gb__avatar {
    width: 28px;
    height: 28px;
    flex-shrink: 0;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    line-height: 1;
    font-weight: 600;
    padding: 0;
    box-sizing: border-box;
    box-shadow: 0 0 0 4px rgba(247, 249, 255, 0.95);
}
.gb__avatar--gradient {
    background: linear-gradient(135deg, var(--gb-accent), var(--gb-accent-2));
    color: white;
    box-shadow: 0 0 0 4px rgba(247, 249, 255, 0.95), 0 2px 8px rgba(99, 102, 241, 0.32);
}
.gb__avatar--dashed {
    background: rgba(255, 255, 255, 0.95);
    color: var(--gb-accent);
    border: 1.5px dashed rgba(99, 102, 241, 0.55);
    font-size: 18px;
}
button.gb__avatar--dashed {
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s, transform 0.15s, box-shadow 0.15s;
}
button.gb__avatar--dashed:hover {
    background: rgba(99, 102, 241, 0.10);
    border-color: var(--gb-accent);
    transform: scale(1.06);
    box-shadow: 0 0 0 4px rgba(247, 249, 255, 0.95), 0 4px 14px rgba(99, 102, 241, 0.18);
}

/* ----- Body (right of avatar) ----- */
.gb__body {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 8px;
}
.gb__meta {
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--gb-subtle);
    margin: 6px 0 0 0;            /* aligns visually with the 28px avatar's center */
    line-height: 1;
}
.gb__text {
    font-size: 14px;
    color: var(--gb-text);
    margin: 0;
    line-height: 1.55;
}

/* ----- Sub-panel (Text / Choice form rendering) ----- */
.gb__sub-panel {
    background: rgba(255, 255, 255, 0.78);
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    border: 1px solid rgba(160, 180, 220, 0.42);
    border-radius: 12px;
    box-shadow: 0 6px 24px rgba(59, 41, 102, 0.08);
    padding: 14px 16px;
}
.gb__sub-panel h3 {
    font-size: 14px;
    font-weight: 600;
    margin: 0 0 4px;
    color: var(--gb-text);
}
.gb__sub-panel p {
    font-size: 13px;
    color: var(--gb-muted);
    margin: 0 0 8px;
    line-height: 1.5;
}
.gb__sub-panel input[type="text"] {
    padding: 6px 10px;
    border: 1px solid rgba(160, 180, 220, 0.45);
    border-radius: 6px;
    font: inherit;
    font-size: 13px;
    background: white;
    width: 100%;
    box-sizing: border-box;
}
.gb__sub-panel input[type="text"]:focus {
    outline: none;
    border-color: rgba(99, 102, 241, 0.55);
    box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.12);
}
.gb__sub-panel button.gb__form-submit {
    margin-top: 6px;
    padding: 5px 14px;
    background: linear-gradient(135deg, var(--gb-accent), var(--gb-accent-2));
    color: white;
    border: none;
    border-radius: 6px;
    font: inherit;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    box-shadow: 0 2px 8px rgba(99, 102, 241, 0.24);
}
.gb__sub-panel label {
    display: block;
    cursor: pointer;
    padding: 2px 0;
    font-size: 13px;
    color: var(--gb-text);
}
.gb__sub-panel input[type="radio"] {
    margin-right: 8px;
    accent-color: var(--gb-accent);
}

/* ----- Container row (Tabs / Sequence) -----
   Vertical layout: chat-bubble header on top, sub-flow region below.
   The main page thread continues straight at x=14 of the stem; the
   sub-flow region branches off horizontally to a sub-line at x=44,
   runs through the rows, and merges back. */
.gb__row--container {
    flex-direction: column;
    align-items: stretch;
    gap: 0;
}
.gb__container-header {
    display: flex;
    align-items: flex-start;
    gap: 12px;
}
.gb__container-flow {
    position: relative;
    margin-top: 8px;
    /* Height is now natural — driven by .gb__sub-flow-list which holds
       the steps/tabs in flex flow. Each row can be variable-height to
       accommodate its own nested components. */
}
.gb__sub-flow-list {
    display: flex;
    flex-direction: column;
    padding: 30px 0;     /* clearance for the 30px branch and merge curves */
    gap: 8px;
}

/* ----- Wiring (branch / sub-line / merge / stems) -----
   All accent-colored 2px lines positioned absolutely within the
   sub-flow region. Branch and merge connect main thread (x=14) to
   sub-line (x=44); sub-line runs the full height inside the 12px
   top/bottom insets; stems extend from sub-line at each tab row's
   center to where the tab node begins (x=66). */
.gb__flow-line {
    position: absolute;
    background: var(--gb-accent-2);
    border-radius: 1px;
    pointer-events: none;
}
/* Sub-line spans the vertical gap between the branch curve (at top:30)
   and the merge curve (at bottom:30). Solid violet matches the curve
   stroke so the join is seamless. */
.gb__flow-line--sub {
    left: 44px;
    top: 30px;
    bottom: 30px;
    width: 2px;
    background: var(--gb-accent-2);
}

/* Branch and merge curves — cubic-Bezier S-curves drawn as SVG so the
   right turns at the corners (where main thread meets the branch and
   where the sub-line meets the merge) blend smoothly, like a railroad
   track easing from one column to another. */
.gb__flow-curve {
    position: absolute;
    pointer-events: none;
    width: 60px;
    height: 30px;
    overflow: visible;
}
.gb__flow-curve--branch   { left: 0; top: 0; }
.gb__flow-curve--merge    { left: 0; bottom: 0; }
.gb__flow-curve--branch-h { left: 0; top: 0; }
.gb__flow-curve--merge-h  { left: 0; bottom: 0; }
.gb__flow-curve path {
    stroke: var(--gb-accent-2);
    stroke-width: 2;
    fill: none;
}

/* ----- Horizontal Tabs layout -----
   Tabs container in horizontal mode: parallel branches arranged as
   columns. Each column owns a vertical thread that connects the top
   bus to the bottom bus, with the tab node and any nested control
   flow sitting along it. */
.gb__container-flow--horiz {
    overflow-x: auto;        /* allow horizontal scroll if many tabs */
}
.gb__tabs-columns {
    display: flex;
    flex-direction: row;
    align-items: stretch;    /* all columns share the tallest column's height */
    gap: 24px;
    padding: 30px 30px 30px 30px;
    /* padding-left:30 puts the first column's content at x=30, so its
       thread (left:14 within the column) lands at x=44 — which matches
       the branch curve's endpoint. */
}
.gb__tab-column {
    position: relative;
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
    min-width: 140px;
}
.gb__tab-column::before {
    content: '';
    position: absolute;
    left: 14px;
    top: 0;
    bottom: 0;
    width: 2px;
    background: var(--gb-accent-2);
    pointer-events: none;
    z-index: 0;
}
.gb__tab-column-header {
    position: relative;
    z-index: 2;              /* above the column thread */
    height: 22px;
    display: flex;
    align-items: center;
    gap: 10px;
}
/* Column owns the thread; the nested-stem's own thread is redundant
   (would render at the same x, same color) so hide it inside columns. */
.gb__tab-column .gb__nested-stem::before {
    display: none;
}
.gb__tab-column .gb__nested-stem {
    margin-top: 12px;
    z-index: 2;
    position: relative;
}

/* Top and bottom buses: horizontal lines at the top and bottom of the
   columns area, connecting all column threads. Their left/width are
   set inline by JS based on measured column positions. */
.gb__flow-line--top-bus,
.gb__flow-line--bottom-bus {
    position: absolute;
    height: 2px;
    background: var(--gb-accent-2);
    border-radius: 1px;
    pointer-events: none;
}
.gb__flow-line--top-bus    { top: 30px; }
.gb__flow-line--bottom-bus { bottom: 30px; }
/* Tab stems are now drawn as ::before of each tab sub-row's header
   (see below), so .gb__flow-line--stem is no longer used by JS but
   the rule is kept for any future explicit-stem needs. */
.gb__flow-line--stem {
    left: 44px;
    width: 22px;
    height: 2px;
}

/* Synchronizing join node at the bottom of the Tabs bus, where the
   sub-line meets the merge connector. Reads as "wait here for all
   parallel tabs to complete" — borrowed from BPMN's parallel-join
   gateway (a 12x12 square rotated 45° = a diamond). */
.gb__flow-join {
    position: absolute;
    left: 44px;
    bottom: 30px;            /* sits where the sub-line meets the merge curve */
    width: 12px;
    height: 12px;
    transform: translate(-50%, 50%) rotate(45deg);
    background: linear-gradient(135deg, var(--gb-accent), var(--gb-accent-2));
    box-shadow: 0 1px 4px rgba(99, 102, 241, 0.32);
    pointer-events: none;
    z-index: 1;
}

/* ----- Sub-rows (steps / tabs) -----
   Each row has a fixed-height header (the node + label part on the
   bus) and an optional nested-content area below for the slot's own
   components. The header is positioned via flex flow inside
   .gb__sub-flow-list — its vertical position is determined by the
   layout, so the bus stem (Tabs) is drawn as ::before of the header
   itself rather than absolutely on the flow region. */
.gb__sub-row {
    position: relative;
    display: flex;
    flex-direction: column;
    z-index: 2;
}
.gb__sub-row-header {
    position: relative;
    height: 22px;
    display: flex;
    align-items: center;
    gap: 10px;
}
.gb__sub-row--seq .gb__sub-row-header {
    padding-left: 33px;     /* node center at x=44 (= 33 + 22/2) */
}
.gb__sub-row--tab .gb__sub-row-header {
    padding-left: 66px;     /* node starts where the stem ends */
}
/* Tab stem: horizontal connector from the bus (x=44) to the tab node
   (x=66) at the header's vertical center. */
.gb__sub-row--tab .gb__sub-row-header::before {
    content: '';
    position: absolute;
    left: 44px;
    top: 10px;
    width: 22px;
    height: 2px;
    background: var(--gb-accent-2);
    border-radius: 1px;
}

/* Nested content for non-add slots: indented so the nested-stem's
   thread (at left:14 of the nested-stem) lands directly under its
   parent node's center.
     Tabs:     tab node at x=77 of flow region → nested-stem at x=63
               (63 + 14 = 77).
     Sequence: step node at x=44 of flow region → nested-stem at x=30
               (30 + 14 = 44). The Seq nested thread coincides with the
               parent's wire (also at x=44), so the wire visually
               continues straight through the step's content. */
.gb__sub-row-content {
    padding-top: 8px;
    padding-bottom: 12px;
}
.gb__sub-row--tab .gb__sub-row-content {
    padding-left: 63px;
}
.gb__sub-row--seq .gb__sub-row-content {
    padding-left: 30px;
}
.gb__nested-stem {
    position: relative;
    display: flex;
    flex-direction: column;
    gap: 16px;
}
/* Each tab/step's nested-stem has its own vertical thread, matching the
   root .gb__stem. The thread extends 8px above the nested-stem's box
   into the sub-row-content's padding-top area, so it visually reaches
   the parent node's bottom (= row.top + 22 = node.bottom for the 22px
   header). Components inside sit on the thread; the line therefore
   descends from the parent node down through every nested component. */
.gb__nested-stem::before {
    content: '';
    position: absolute;
    left: 14px;
    top: -8px;
    bottom: 14px;
    width: 2px;
    background: linear-gradient(to bottom,
        rgba(99, 102, 241, 0.40) 0%,
        rgba(99, 102, 241, 0.65) 30%,
        var(--gb-accent-2) 100%);
    border-radius: 1px;
    pointer-events: none;
    z-index: 0;
}
.gb__sub-node {
    width: 22px;
    height: 22px;
    flex-shrink: 0;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    box-sizing: border-box;
    padding: 0;
}
.gb__sub-node--seq,
.gb__sub-node--tab:not(.gb__sub-node--add) {
    background: linear-gradient(135deg, var(--gb-accent), var(--gb-accent-2));
    color: white;
    font-size: 11px;
    font-weight: 600;
    line-height: 1;
}
/* Sequence nodes sit on the sub-line — the 22px gradient circle covers
   the line locally (opaque background) while the line stays visible
   in the (ROW_HEIGHT − node-height) gap between adjacent nodes. No
   canvas halo: that would extend coverage past the node and erase the
   visible "wire between gates" segments. */
.gb__sub-node--seq:not(.gb__sub-node--add) {
    box-shadow: 0 1px 4px rgba(99, 102, 241, 0.32);
}
.gb__sub-node--tab:not(.gb__sub-node--add) {
    box-shadow: 0 1px 4px rgba(99, 102, 241, 0.32);
}
.gb__sub-node--add {
    background: rgba(255, 255, 255, 0.95);
    border: 1.5px dashed rgba(99, 102, 241, 0.55);
    color: var(--gb-accent);
    font: inherit;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s, transform 0.15s, box-shadow 0.15s;
}
button.gb__sub-node--add:hover {
    background: rgba(99, 102, 241, 0.10);
    border-color: var(--gb-accent);
    transform: scale(1.06);
}
.gb__sub-label {
    font-size: 13px;
    color: var(--gb-text);
    line-height: 1;
}
.gb__sub-label--add {
    color: var(--gb-subtle);
}

/* ----- Picker (replaces the trailing ghost when in picking mode) ----- */
.gb__picker {
    background: rgba(255, 255, 255, 0.78);
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    border: 1px solid rgba(160, 180, 220, 0.42);
    border-radius: 14px;
    box-shadow: 0 6px 24px rgba(59, 41, 102, 0.08);
    padding: 14px 16px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    max-width: 320px;
    width: 100%;
}
.gb__picker-title {
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--gb-subtle);
    margin: 0 0 6px 0;
}
.gb__picker-option {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 2px;
    padding: 8px 12px;
    background: rgba(255, 255, 255, 0.55);
    border: 1px solid rgba(160, 180, 220, 0.32);
    border-radius: 10px;
    cursor: pointer;
    text-align: left;
    font: inherit;
    transition: background 0.12s, border-color 0.12s, transform 0.12s;
}
.gb__picker-option:hover {
    background: rgba(99, 102, 241, 0.08);
    border-color: var(--gb-accent);
    transform: translateY(-1px);
}
.gb__picker-label {
    font-size: 13px;
    font-weight: 600;
    color: var(--gb-text);
}
.gb__picker-desc {
    font-size: 11.5px;
    color: var(--gb-muted);
}
.gb__picker-cancel {
    margin-top: 4px;
    align-self: flex-start;
    padding: 4px 12px;
    border: 1px solid rgba(160, 180, 220, 0.42);
    background: transparent;
    color: var(--gb-subtle);
    border-radius: 999px;
    cursor: pointer;
    font: inherit;
    font-size: 11.5px;
    transition: color 0.12s, border-color 0.12s;
}
.gb__picker-cancel:hover {
    color: var(--gb-text);
    border-color: var(--gb-accent);
}

</style>
<script>
// ----- Graph Builder — control-flow map -----
//
// This is a birds-eye view of a page's CONTROL FLOW. The picker offers
// only the three control-flow container types — Tabs, Sequence, Group —
// and the graph is built from those. Data-entry/info components live
// "inside" each scope but aren't shown here; the eventual Page Editor
// view will reveal them and allow editing the compiled-page preview.
//
// Visual model: a vertical thread with a chat-bubble row per node. For
// each container, the row has a header (avatar + meta) plus a sub-flow
// region whose wiring matches the container's control-flow semantics:
//   Tabs     — bus with side-stems → tab nodes + sync-join diamond
//   Sequence — wire with inline gates (step nodes ON the wire)
//   Group    — same bus + side-stems as Tabs but NO sync diamond
//              (children render together, no gating to merge through)
//
// State: `state.components` is the root list. Tabs/Sequence/Group each
// carry an array of slots ({ label, components: [] }). pickingArray is
// a direct reference to the array currently being added to — same UX
// at every nesting level.
(function () {
    const stem = document.querySelector('.gb__stem');
    if (!stem) return;

    const TYPES = [
        { id: 'tabs',     glyph: '⫼', label: 'Tabs',     desc: 'Parallel branches; one shown at a time' },
        { id: 'sequence', glyph: '↓', label: 'Sequence', desc: 'Steps completed in order' },
        { id: 'group',    glyph: '∥', label: 'Group',    desc: 'A generic scope; components can be added later' },
    ];
    const TYPE_BY_ID = Object.fromEntries(TYPES.map(t => [t.id, t]));

    const state = {
        components: [],
        pickingArray: null,
    };
    let nextId = 1;

    function newComponent(type) {
        const c = { id: nextId++, type };
        // Each container type carries its own slot array. They're
        // structurally identical — { label, components: [] }[] — so the
        // sub-row builder and recursive render pipeline are shared.
        if (type === 'tabs')     c.tabs    = [];
        if (type === 'sequence') c.steps   = [];
        // Group is a generic node — its components array holds whatever
        // gets added later (via drill-down or a Page-Editor mode). For
        // now the graph view shows the Group as a labeled node only,
        // with no inline rendering of what it contains.
        if (type === 'group')    c.components = [];
        return c;
    }
    function newSlot(prefix, n) {
        return { label: prefix + ' ' + n, components: [] };
    }

    // ----- Avatar primitives -----
    function gradientAvatar(glyph) {
        const av = document.createElement('span');
        av.className = 'gb__avatar gb__avatar--gradient';
        av.textContent = glyph;
        return av;
    }
    function dashedAvatar(glyph, options) {
        const tag = (options && options.button) ? 'button' : 'span';
        const av = document.createElement(tag);
        av.className = 'gb__avatar gb__avatar--dashed';
        av.textContent = glyph;
        if (options && options.button) av.type = 'button';
        return av;
    }

    // ----- Container sub-flow geometry -----
    // The sub-flow is a region BELOW the container's chat-bubble header
    // that renders the steps/tabs as a "siding" off the main page thread.
    // A horizontal branch connector at the top runs from the main thread
    // (x=14) right to the sub-line (x=44); the sub-line runs vertically
    // through the sub-rows; a horizontal merge connector at the bottom
    // returns to the main thread. For Tabs, each row gets a horizontal
    // stem off the sub-line ending in a tab node — the bus stays
    // continuous (parallel taps). For Sequence, each step's gradient
    // node sits ON the sub-line, covering it locally — the wire is
    // gated at every step.
    function addFlowWire(flow, kind) {
        if (kind === 'branch' || kind === 'merge'
            || kind === 'branch-h' || kind === 'merge-h') {
            addFlowCurve(flow, kind);
            return;
        }
        const w = document.createElement('span');
        w.className = 'gb__flow-line gb__flow-line--' + kind;
        flow.appendChild(w);
    }

    function addFlowCurve(flow, kind) {
        // Cubic Bezier curves that smooth the right turns at the corners.
        //   branch / merge  — vertical → vertical S-curve (Sequence and
        //                     anything that branches "down to a column").
        //   branch-h        — vertical → horizontal quarter-arc (entering
        //                     the top bus of horizontally-laid Tabs).
        //   merge-h         — horizontal → vertical quarter-arc (leaving
        //                     the bottom bus back to the main thread).
        const SVG_NS = 'http://www.w3.org/2000/svg';
        const svg = document.createElementNS(SVG_NS, 'svg');
        svg.setAttribute('class', 'gb__flow-curve gb__flow-curve--' + kind);
        svg.setAttribute('width', '60');
        svg.setAttribute('height', '30');
        svg.setAttribute('viewBox', '0 0 60 30');
        const path = document.createElementNS(SVG_NS, 'path');
        let d;
        if      (kind === 'branch')   d = 'M 14,0 C 14,15 44,15 44,30';
        else if (kind === 'merge')    d = 'M 44,0 C 44,15 14,15 14,30';
        else if (kind === 'branch-h') d = 'M 14,0 C 14,15 29,30 44,30';
        else                          d = 'M 44,0 C 29,0 14,15 14,30';
        path.setAttribute('d', d);
        svg.appendChild(path);
        flow.appendChild(svg);
    }

    function buildSubRow(opts) {
        // opts: { variant ('seq'|'tab'), glyph, slot, isAdd, onAdd, addLabel }
        // For non-add rows, the slot is { label, components } and the row
        // recursively renders its components below the header.
        const row = document.createElement('div');
        row.className = 'gb__sub-row gb__sub-row--' + opts.variant
                      + (opts.isAdd ? ' gb__sub-row--add' : '');

        const header = document.createElement('div');
        header.className = 'gb__sub-row-header';

        const node = document.createElement(opts.isAdd ? 'button' : 'span');
        node.className = 'gb__sub-node gb__sub-node--' + opts.variant
                       + (opts.isAdd ? ' gb__sub-node--add' : '');
        if (opts.isAdd) {
            node.type = 'button';
            node.textContent = '+';
            const aria = opts.variant === 'seq' ? 'Add a step' : 'Add a tab';
            node.title = aria;
            node.setAttribute('aria-label', aria);
            node.addEventListener('click', opts.onAdd);
        } else if (opts.glyph) {
            node.textContent = opts.glyph;
        }
        header.appendChild(node);

        const lbl = document.createElement('span');
        lbl.className = 'gb__sub-label' + (opts.isAdd ? ' gb__sub-label--add' : '');
        lbl.textContent = opts.isAdd ? opts.addLabel : opts.slot.label;
        header.appendChild(lbl);

        row.appendChild(header);

        // Nested content area — every non-add slot recursively renders
        // its own components list with the same picker UX as the root.
        if (!opts.isAdd) {
            const content = document.createElement('div');
            content.className = 'gb__sub-row-content';
            const nestedStem = document.createElement('div');
            nestedStem.className = 'gb__nested-stem';
            renderStem(opts.slot.components, nestedStem);
            content.appendChild(nestedStem);
            row.appendChild(content);
        }

        return row;
    }

    function buildSequenceFlow(component) {
        const flow = document.createElement('div');
        flow.className = 'gb__container-flow gb__container-flow--seq';

        addFlowWire(flow, 'branch');
        addFlowWire(flow, 'sub');
        addFlowWire(flow, 'merge');

        const list = document.createElement('div');
        list.className = 'gb__sub-flow-list';

        component.steps.forEach((slot, i) => {
            list.appendChild(buildSubRow({
                variant: 'seq',
                glyph: String(i + 1),
                slot: slot,
                isAdd: false,
            }));
        });
        list.appendChild(buildSubRow({
            variant: 'seq',
            isAdd: true,
            addLabel: 'Add step',
            onAdd: () => {
                component.steps.push(newSlot('Step', component.steps.length + 1));
                render();
            },
        }));

        flow.appendChild(list);
        return flow;
    }

    function buildTabsFlow(component) {
        // Horizontal Tabs: parallel branches arranged side-by-side as
        // columns. The top bus (horizontal) feeds each column from above;
        // each column has its own vertical thread descending through the
        // tab node and any nested control flow; the bottom bus collects
        // them all and the merge curve returns to the main thread.
        const flow = document.createElement('div');
        flow.className = 'gb__container-flow gb__container-flow--tabs gb__container-flow--horiz';

        // Branch: vertical → horizontal quarter-arc.
        addFlowWire(flow, 'branch-h');

        // Top and bottom buses: their left/width are positioned by JS
        // after layout, since column widths are content-driven.
        const topBus = document.createElement('span');
        topBus.className = 'gb__flow-line gb__flow-line--top-bus';
        flow.appendChild(topBus);

        const cols = document.createElement('div');
        cols.className = 'gb__tabs-columns';

        component.tabs.forEach((slot) => {
            cols.appendChild(buildTabColumn(slot, false));
        });
        cols.appendChild(buildTabColumn(null, true, () => {
            component.tabs.push(newSlot('Tab', component.tabs.length + 1));
            render();
        }));

        flow.appendChild(cols);

        const bottomBus = document.createElement('span');
        bottomBus.className = 'gb__flow-line gb__flow-line--bottom-bus';
        flow.appendChild(bottomBus);

        // Synchronizing join at the LEFT end of the bottom bus, where the
        // merge curve departs back to the main thread.
        const join = document.createElement('span');
        join.className = 'gb__flow-join';
        flow.appendChild(join);

        // Merge: horizontal → vertical quarter-arc.
        addFlowWire(flow, 'merge-h');

        return flow;
    }

    function buildTabColumn(slot, isAdd, onAdd) {
        const col = document.createElement('div');
        col.className = 'gb__tab-column' + (isAdd ? ' gb__tab-column--add' : '');

        const header = document.createElement('div');
        header.className = 'gb__tab-column-header';

        const node = document.createElement(isAdd ? 'button' : 'span');
        node.className = 'gb__sub-node gb__sub-node--tab' + (isAdd ? ' gb__sub-node--add' : '');
        if (isAdd) {
            node.type = 'button';
            node.textContent = '+';
            node.title = 'Add a tab';
            node.setAttribute('aria-label', 'Add a tab');
            node.addEventListener('click', onAdd);
        }
        header.appendChild(node);

        const lbl = document.createElement('span');
        lbl.className = 'gb__sub-label' + (isAdd ? ' gb__sub-label--add' : '');
        lbl.textContent = isAdd ? 'Add tab' : slot.label;
        header.appendChild(lbl);

        col.appendChild(header);

        if (!isAdd) {
            // Nested control flow inside this tab — same recursive renderStem
            // as everywhere else. The column owns its thread (::before), so
            // nested-stem's own thread is hidden via CSS inside columns.
            const nestedStem = document.createElement('div');
            nestedStem.className = 'gb__nested-stem';
            renderStem(slot.components, nestedStem);
            col.appendChild(nestedStem);
        }

        return col;
    }

    // No buildGroupFlow — Group renders as a chat-bubble header only.
    // Its components array is populated later (drill-down / Page Editor),
    // not via inline graph affordances.

    // Tabs and Sequence carry their own sub-flow wiring; Group is just
    // a generic labeled node (its contents are accessed elsewhere).
    const CONTAINER_DESCS = {
        tabs:     'Parallel branches — every tap is reachable simultaneously; all must complete to merge.',
        sequence: 'Sequential steps — each gates the next.',
        group:    'A generic scope — components can be added later.',
    };

    // ----- Row builder -----
    function buildComponentRow(component) {
        // Vertical layout: a chat-bubble header on top (avatar + meta +
        // description). Tabs and Sequence append a sub-flow region whose
        // wiring matches their control-flow semantics; Group stops at
        // the header.
        const meta = TYPE_BY_ID[component.type];

        const row = document.createElement('div');
        row.className = 'gb__row gb__row--container gb__row--' + component.type;

        const header = document.createElement('div');
        header.className = 'gb__container-header';

        header.appendChild(gradientAvatar(meta.glyph));

        const body = document.createElement('div');
        body.className = 'gb__body';

        const metaEl = document.createElement('div');
        metaEl.className = 'gb__meta';
        metaEl.textContent = meta.label;
        body.appendChild(metaEl);

        const desc = document.createElement('p');
        desc.className = 'gb__text';
        desc.textContent = CONTAINER_DESCS[component.type];
        body.appendChild(desc);

        header.appendChild(body);
        row.appendChild(header);

        if (component.type === 'tabs') {
            row.appendChild(buildTabsFlow(component));
        } else if (component.type === 'sequence') {
            row.appendChild(buildSequenceFlow(component));
        }
        // Group has no inline flow region.

        return row;
    }

    function buildGhostRow(targetArray) {
        const row = document.createElement('div');
        row.className = 'gb__row gb__row--ghost';

        const av = dashedAvatar('+', { button: true });
        av.setAttribute('aria-label', 'Add component');
        av.addEventListener('click', () => {
            state.pickingArray = targetArray;
            render();
        });
        row.appendChild(av);

        return row;
    }

    function buildPickerRow(targetArray) {
        const row = document.createElement('div');
        row.className = 'gb__row gb__row--picker';

        // Decorative dashed `+` avatar — keeps the visual rhythm aligned
        // with the thread while the picker is open.
        row.appendChild(dashedAvatar('+'));

        const picker = document.createElement('div');
        picker.className = 'gb__picker';
        picker.setAttribute('role', 'menu');

        const title = document.createElement('div');
        title.className = 'gb__picker-title';
        title.textContent = 'Add component';
        picker.appendChild(title);

        TYPES.forEach(t => {
            const opt = document.createElement('button');
            opt.type = 'button';
            opt.className = 'gb__picker-option';
            opt.dataset.type = t.id;
            opt.setAttribute('role', 'menuitem');

            const lbl = document.createElement('span');
            lbl.className = 'gb__picker-label';
            lbl.textContent = t.label;
            opt.appendChild(lbl);

            const desc = document.createElement('span');
            desc.className = 'gb__picker-desc';
            desc.textContent = t.desc;
            opt.appendChild(desc);

            opt.addEventListener('click', () => {
                targetArray.push(newComponent(t.id));
                state.pickingArray = null;
                render();
            });
            picker.appendChild(opt);
        });

        const cancel = document.createElement('button');
        cancel.type = 'button';
        cancel.className = 'gb__picker-cancel';
        cancel.textContent = 'Cancel';
        cancel.addEventListener('click', () => {
            state.pickingArray = null;
            render();
        });
        picker.appendChild(cancel);

        row.appendChild(picker);
        return row;
    }

    // ----- Render -----
    // renderStem is the recursive workhorse: given a components array and
    // a DOM container, it renders each component row followed by either
    // the picker (if state.pickingArray points at this exact array) or
    // a + ghost (otherwise). Container components call renderStem on
    // their nested arrays via buildSubRow → same UX everywhere.
    function renderStem(arr, container) {
        arr.forEach(c => container.appendChild(buildComponentRow(c)));
        if (state.pickingArray === arr) {
            container.appendChild(buildPickerRow(arr));
        } else {
            container.appendChild(buildGhostRow(arr));
        }
    }

    function positionHorizontalBuses(flow) {
        // The top and bottom buses span from the FIRST column's thread
        // to the LAST column's thread (which is the trailing add column).
        // Column widths are content-driven, so we measure positions after
        // layout and write left/width inline.
        const cols = flow.querySelectorAll(':scope > .gb__tabs-columns > .gb__tab-column');
        if (cols.length === 0) return;
        const flowRect = flow.getBoundingClientRect();
        const firstRect = cols[0].getBoundingClientRect();
        const lastRect = cols[cols.length - 1].getBoundingClientRect();
        // Each column's thread is at left:14 of the column.
        const firstX = firstRect.left - flowRect.left + 14;
        const lastX  = lastRect.left  - flowRect.left + 14;
        const width  = lastX - firstX;

        const top = flow.querySelector(':scope > .gb__flow-line--top-bus');
        const bot = flow.querySelector(':scope > .gb__flow-line--bottom-bus');
        if (top) { top.style.left = firstX + 'px'; top.style.width = width + 'px'; }
        if (bot) { bot.style.left = firstX + 'px'; bot.style.width = width + 'px'; }

        // Sync diamond sits at the LEFT end of the bottom bus, where the
        // merge curve starts. It defaults to left:44 in CSS (matching
        // vertical Tabs); for horizontal we override with the measured x.
        const join = flow.querySelector(':scope > .gb__flow-join');
        if (join) join.style.left = firstX + 'px';
    }

    function render() {
        stem.innerHTML = '';
        renderStem(state.components, stem);
        // After the DOM is in place, lay out any horizontal Tabs buses.
        // getBoundingClientRect triggers layout, so positions are correct.
        document.querySelectorAll('.gb__container-flow--horiz')
            .forEach(positionHorizontalBuses);
    }

    render();
})();
</script>
{% endblock %}
