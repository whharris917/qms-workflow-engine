{% extends "base.html" %}
{% block title %}Workflow Sandbox - QMS Workflow Engine{% endblock %}
{% block content %}
<div class="sb-container">
    <div class="sb-tabs">
        <button class="sb-tab active" onclick="switchSbTab('source', this)">Source</button>
        <button class="sb-tab" onclick="switchSbTab('editor', this)">Interactive Editor</button>
    </div>
    <div class="sb-body">
        <div class="sb-pane" id="sb-pane-source"></div>
        <div class="sb-pane" id="sb-pane-editor" style="display:none;">
            <div class="ge-toolbar">
                <button class="ge-tool-btn" onclick="addNode()">+ Node</button>
            </div>
            <svg id="ge-canvas"></svg>
            <div class="ge-context-menu" id="ge-context-menu" style="display:none;"></div>
            <div class="ge-field-props" id="ge-field-props" style="display:none;">
                <div class="ge-fp-header">
                    <span class="ge-fp-title" id="fp-title">Field</span>
                    <button class="ge-fp-close" onclick="closeFieldProps()">&times;</button>
                </div>
                <label class="ge-fp-label">Name
                    <input type="text" id="fp-name" class="ge-fp-input">
                </label>
                <label class="ge-fp-label">Type
                    <select id="fp-type" class="ge-fp-input">
                        <option value="string">String</option>
                        <option value="text">Text</option>
                        <option value="boolean">Boolean</option>
                        <option value="enum">Enum</option>
                        <option value="number">Number</option>
                        <option value="date">Date</option>
                        <option value="signature">Signature</option>
                    </select>
                </label>
                <div class="ge-fp-actions">
                    <button class="ge-fp-save" onclick="saveFieldProps()">Done</button>
                    <button class="ge-fp-delete" onclick="deleteFieldFromProps()">Delete</button>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
    .sb-container {
        display: flex;
        flex-direction: column;
        height: calc(100vh - 4rem);
        background: #fff;
        border: 1px solid #e0e0e0;
        border-radius: 8px;
        overflow: hidden;
    }
    .sb-tabs {
        display: flex;
        border-bottom: 1px solid #e0e0e0;
        flex-shrink: 0;
    }
    .sb-tab {
        padding: 0.6rem 1.25rem;
        border: none;
        background: none;
        font-size: 0.88rem;
        font-weight: 500;
        color: #555;
        cursor: pointer;
        border-bottom: 2px solid transparent;
        transition: color 0.15s, border-color 0.15s;
    }
    .sb-tab:hover { color: #1a1a2e; }
    .sb-tab.active {
        color: #1a1a2e;
        font-weight: 600;
        border-bottom-color: #2a6bcf;
    }
    .sb-body {
        flex: 1;
        overflow: auto;
    }
    .sb-pane {
        height: 100%;
        overflow: auto;
    }

    /* Graph editor */
    #sb-pane-editor {
        display: flex;
        flex-direction: column;
        overflow: hidden;
        position: relative;
    }
    .ge-toolbar {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.4rem 0.75rem;
        border-bottom: 1px solid #eee;
        background: #fafafa;
        flex-shrink: 0;
    }
    .ge-tool-btn {
        padding: 0.3rem 0.7rem;
        border: 1px solid #dde1e6;
        border-radius: 5px;
        background: #fff;
        font-size: 0.8rem;
        font-weight: 500;
        color: #2a6bcf;
        cursor: pointer;
    }
    .ge-tool-btn:hover { background: #eef2f8; }
    #ge-canvas {
        flex: 1;
        width: 100%;
        background: #f8f9fb;
        cursor: default;
    }
    .ge-context-menu {
        position: absolute;
        background: #fff;
        border: 1px solid #dde1e6;
        border-radius: 6px;
        box-shadow: 0 4px 16px rgba(0,0,0,0.12);
        padding: 0.25rem 0;
        min-width: 160px;
        z-index: 50;
    }
    .ge-context-item {
        display: block;
        width: 100%;
        padding: 0.45rem 0.85rem;
        border: none;
        background: none;
        text-align: left;
        font-size: 0.82rem;
        color: #333;
        cursor: pointer;
    }
    .ge-context-item:hover {
        background: #eef2f8;
        color: #1a1a2e;
    }

    /* Field properties popover */
    .ge-field-props {
        position: absolute;
        background: #fff;
        border: 1px solid #dde1e6;
        border-radius: 8px;
        box-shadow: 0 4px 16px rgba(0,0,0,0.12);
        padding: 0;
        width: 220px;
        z-index: 60;
        overflow: hidden;
    }
    .ge-fp-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0.5rem 0.7rem;
        border-bottom: 1px solid #eee;
        background: #fafafa;
    }
    .ge-fp-title { font-size: 0.82rem; font-weight: 600; color: #1a1a2e; }
    .ge-fp-close { background: none; border: none; font-size: 1.1rem; color: #888; cursor: pointer; }
    .ge-fp-label {
        display: block;
        padding: 0.4rem 0.7rem 0.2rem;
        font-size: 0.78rem;
        font-weight: 500;
        color: #555;
    }
    .ge-fp-input {
        width: 100%;
        padding: 0.3rem 0.45rem;
        border: 1px solid #dde1e6;
        border-radius: 4px;
        font-size: 0.8rem;
        font-family: inherit;
        margin-top: 0.15rem;
    }
    .ge-fp-input:focus { outline: none; border-color: #4a9eff; }
    .ge-fp-actions {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0.5rem 0.7rem;
        border-top: 1px solid #eee;
        margin-top: 0.3rem;
    }
    .ge-fp-save {
        padding: 0.3rem 0.7rem;
        background: #2a6bcf;
        color: #fff;
        border: none;
        border-radius: 4px;
        font-size: 0.78rem;
        font-weight: 500;
        cursor: pointer;
    }
    .ge-fp-save:hover { background: #1a4a9e; }
    .ge-fp-delete {
        padding: 0.3rem 0.5rem;
        background: none;
        border: 1px solid #e6a9a3;
        color: #c0392b;
        border-radius: 4px;
        font-size: 0.78rem;
        cursor: pointer;
    }
    .ge-fp-delete:hover { background: #fdecea; }
</style>

<script>
function switchSbTab(tab, btn) {
    document.querySelectorAll('.sb-tab').forEach(t => t.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('sb-pane-source').style.display = tab === 'source' ? '' : 'none';
    document.getElementById('sb-pane-editor').style.display = tab === 'editor' ? 'flex' : 'none';
}

// ── Graph data ──
const graph = {
    nodes: [],   // { id, x, y, label, fields: [] }
    edges: [],   // { id, from, to, conditions: [], hooks: [] }
    nextId: 1,
};

const NODE_W = 180, NODE_HEADER = 32, NODE_FIELD_H = 22, NODE_BTN_H = 26, NODE_PAD_BOTTOM = 6, NODE_R = 6;
const PORT_R = 6;
const GAP_X = 60, GAP_Y = 70, PAD = 40;
const SYMBOL_SIZE = 44;  // width/height of annotation symbols
const SYMBOL_GAP = 12;   // gap between stacked symbols

let svg, edgeDrawState = null, selection = null;
let editingField = null;  // { nodeId, fieldIdx } — field currently being named
let editingNodeLabel = null;  // nodeId — node label currently being renamed

function nodeH(n) {
    const fieldCount = (n.fields || []).length;
    return NODE_HEADER + fieldCount * NODE_FIELD_H + NODE_BTN_H + NODE_PAD_BOTTOM;
}

function initEditor() {
    svg = document.getElementById('ge-canvas');
    svg.addEventListener('pointerdown', onCanvasPointerDown);
    svg.addEventListener('pointermove', onCanvasPointerMove);
    svg.addEventListener('pointerup', onCanvasPointerUp);
    svg.addEventListener('selectstart', e => e.preventDefault());
    svg.addEventListener('contextmenu', onContextMenu);
    document.addEventListener('mousedown', (e) => {
        const menu = document.getElementById('ge-context-menu');
        if (!menu.contains(e.target)) hideContextMenu();
    });
}

// ── Context menu ──
function onContextMenu(e) {
    e.preventDefault();
    e.stopPropagation();
    const menu = document.getElementById('ge-context-menu');
    const container = document.getElementById('sb-pane-editor');
    const cr = container.getBoundingClientRect();

    // Determine what was right-clicked
    const nodeG = e.target.closest('[data-node-id]');
    const edgeTarget = e.target.dataset.edgeId ? e.target : null;
    menu.innerHTML = '';

    if (edgeTarget) {
        const edgeId = edgeTarget.dataset.edgeId;
        selection = { type: 'edge', id: edgeId };
        renderGraph();
        addMenuItem(menu, 'Add Condition', () => { hideContextMenu(); addEdgeCondition(edgeId); });
        addMenuItem(menu, 'Add Hook', () => { hideContextMenu(); addEdgeHook(edgeId); });
    } else if (nodeG) {
        const nodeId = nodeG.dataset.nodeId;
        addMenuItem(menu, 'Add Connected Node', () => { hideContextMenu(); addConnectedNode(nodeId); });
    } else {
        addMenuItem(menu, 'Add Node', () => { hideContextMenu(); addNode(); });
    }

    menu.style.left = (e.clientX - cr.left) + 'px';
    menu.style.top = (e.clientY - cr.top) + 'px';
    menu.style.display = '';
}

function hideContextMenu() {
    document.getElementById('ge-context-menu').style.display = 'none';
}

function addMenuItem(menu, text, onclick) {
    const item = document.createElement('button');
    item.className = 'ge-context-item';
    item.textContent = text;
    item.onmousedown = (ev) => { ev.stopPropagation(); };
    item.onclick = onclick;
    menu.appendChild(item);
}

function addEdgeCondition(edgeId) {
    const edge = graph.edges.find(e => e.id === edgeId);
    if (!edge) return;
    if (!edge.conditions) edge.conditions = [];
    edge.conditions.push({ id: 'c' + graph.nextId++, name: '' });
    autoLayout(true);
}

function addEdgeHook(edgeId) {
    const edge = graph.edges.find(e => e.id === edgeId);
    if (!edge) return;
    if (!edge.hooks) edge.hooks = [];
    edge.hooks.push({ id: 'h' + graph.nextId++, name: '' });
    autoLayout(true);
}

function svgPt(e) {
    const r = svg.getBoundingClientRect();
    return { x: e.clientX - r.left, y: e.clientY - r.top };
}

// ── Auto-layout ──
// Computes target positions via layered top-to-bottom layout, then animates.
function autoLayout(animate) {
    const nodes = graph.nodes;
    const edges = graph.edges;
    if (!nodes.length) return;

    // Build adjacency
    const children = {};
    const inDeg = {};
    nodes.forEach(n => { children[n.id] = []; inDeg[n.id] = 0; });
    edges.forEach(e => {
        children[e.from].push(e.to);
        inDeg[e.to] = (inDeg[e.to] || 0) + 1;
    });

    // Separate disconnected (no edges) from connected
    const connected = new Set();
    edges.forEach(e => { connected.add(e.from); connected.add(e.to); });

    // Assign layers via longest-path BFS
    const layer = {};
    nodes.forEach(n => { layer[n.id] = 0; });
    const roots = nodes.filter(n => connected.has(n.id) && inDeg[n.id] === 0).map(n => n.id);
    if (!roots.length && connected.size) roots.push(nodes.find(n => connected.has(n.id)).id);

    const visited = new Set();
    const queue = [...roots];
    while (queue.length) {
        const id = queue.shift();
        if (visited.has(id)) continue;
        visited.add(id);
        for (const cid of children[id]) {
            layer[cid] = Math.max(layer[cid], layer[id] + 1);
            inDeg[cid]--;
            if (inDeg[cid] <= 0) queue.push(cid);
        }
    }

    // Disconnected nodes go below
    const maxConnLayer = visited.size ? Math.max(...[...visited].map(id => layer[id])) : -1;
    nodes.filter(n => !connected.has(n.id)).forEach(n => {
        layer[n.id] = maxConnLayer + 1;
    });

    // Group by layer
    const layers = {};
    nodes.forEach(n => {
        const l = layer[n.id];
        if (!layers[l]) layers[l] = [];
        layers[l].push(n);
    });

    // Compute extra gap needed between layers for edge annotations
    function edgeAnnotationCount(e) {
        return ((e.conditions || []).length) + ((e.hooks || []).length);
    }

    // For each layer gap (between layer i and i+1), find max annotations
    const sortedLayers = Object.keys(layers).map(Number).sort((a, b) => a - b);
    const layerGap = {};  // layerIndex → gap height
    sortedLayers.forEach((l, li) => {
        let maxAnnotations = 0;
        edges.forEach(e => {
            const fromLayer = layer[e.from];
            const toLayer = layer[e.to];
            if (fromLayer === l && toLayer === l + 1) {
                maxAnnotations = Math.max(maxAnnotations, edgeAnnotationCount(e));
            }
        });
        const extraSpace = maxAnnotations > 0 ? maxAnnotations * (SYMBOL_SIZE + SYMBOL_GAP) : 0;
        layerGap[li] = GAP_Y + extraSpace;
    });

    // Compute target positions
    const svgRect = svg.getBoundingClientRect();
    const canvasW = svgRect.width || 800;
    const targets = {};

    let cumulativeY = PAD;
    sortedLayers.forEach((l, li) => {
        const row = layers[l];
        const totalW = row.length * NODE_W + (row.length - 1) * GAP_X;
        const startX = (canvasW - totalW) / 2;
        row.forEach((n, ni) => {
            targets[n.id] = {
                x: startX + ni * (NODE_W + GAP_X),
                y: cumulativeY,
            };
        });
        // Advance by tallest node in this row + gap
        const maxH = Math.max(...row.map(n => nodeH(n)));
        cumulativeY += maxH + (layerGap[li] || GAP_Y);
    });

    if (animate) {
        animateTo(targets);
    } else {
        nodes.forEach(n => { n.x = targets[n.id].x; n.y = targets[n.id].y; });
        renderGraph();
    }
}

// ── Animation ──
let animationId = null;

function animateTo(targets) {
    if (animationId) cancelAnimationFrame(animationId);
    const duration = 300;
    const start = performance.now();

    // Snapshot current positions
    const from = {};
    graph.nodes.forEach(n => { from[n.id] = { x: n.x, y: n.y }; });

    function tick(now) {
        const t = Math.min((now - start) / duration, 1);
        const ease = t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t; // ease in-out quad
        graph.nodes.forEach(n => {
            const f = from[n.id], tgt = targets[n.id];
            n.x = f.x + (tgt.x - f.x) * ease;
            n.y = f.y + (tgt.y - f.y) * ease;
        });
        renderGraph();
        if (t < 1) {
            animationId = requestAnimationFrame(tick);
        } else {
            animationId = null;
        }
    }
    animationId = requestAnimationFrame(tick);
}

// ── Add node ──
function addNode() {
    const id = 'n' + graph.nextId++;
    // Start at a reasonable spot before animation moves it
    const svgRect = svg.getBoundingClientRect();
    const canvasW = svgRect.width || 800;
    let maxY = 0;
    graph.nodes.forEach(n => maxY = Math.max(maxY, n.y + NODE_H));
    graph.nodes.push({ id, x: canvasW / 2 - NODE_W / 2, y: maxY > 0 ? maxY + GAP_Y : PAD, label: 'Stage ' + graph.nodes.length, fields: [] });
    selectNode(id);
    autoLayout(true);
}

function addFieldToNode(nodeId) {
    const node = graph.nodes.find(n => n.id === nodeId);
    if (!node) return;
    if (!node.fields) node.fields = [];
    node.fields.push({ id: 'f' + graph.nextId++, name: '', type: 'string' });
    editingField = { nodeId, fieldIdx: node.fields.length - 1 };
    // Layout without animation so the input isn't destroyed mid-render
    autoLayout(false);
}

function commitFieldName() {
    if (!editingField) return;
    const node = graph.nodes.find(n => n.id === editingField.nodeId);
    if (node) {
        const f = node.fields[editingField.fieldIdx];
        if (f && !f.name) {
            node.fields.splice(editingField.fieldIdx, 1);
        }
    }
    editingField = null;
    autoLayout(true);
}

// ── Field properties popover ──
let fieldPropsTarget = null;  // { nodeId, fieldIdx }

function openFieldProps(nodeId, fieldIdx) {
    const node = graph.nodes.find(n => n.id === nodeId);
    if (!node || !node.fields[fieldIdx]) return;
    const f = node.fields[fieldIdx];
    fieldPropsTarget = { nodeId, fieldIdx };

    document.getElementById('fp-title').textContent = f.name || 'Field';
    document.getElementById('fp-name').value = f.name || '';
    document.getElementById('fp-type').value = f.type || 'string';

    // Position near the field row
    const container = document.getElementById('sb-pane-editor');
    const cr = container.getBoundingClientRect();
    const panel = document.getElementById('ge-field-props');
    // Place to the right of the node
    const px = node.x + NODE_W + 10 - container.scrollLeft;
    const fy = node.y + NODE_HEADER + fieldIdx * NODE_FIELD_H;
    // Account for toolbar height
    const toolbar = container.querySelector('.ge-toolbar');
    const toolbarH = toolbar ? toolbar.offsetHeight : 0;
    const py = fy + toolbarH - container.scrollTop;
    panel.style.left = px + 'px';
    panel.style.top = py + 'px';
    panel.style.display = '';
}

function closeFieldProps() {
    document.getElementById('ge-field-props').style.display = 'none';
    fieldPropsTarget = null;
}

function saveFieldProps() {
    if (!fieldPropsTarget) return;
    const node = graph.nodes.find(n => n.id === fieldPropsTarget.nodeId);
    if (!node) return;
    const f = node.fields[fieldPropsTarget.fieldIdx];
    if (!f) return;
    f.name = document.getElementById('fp-name').value.trim() || f.name;
    f.type = document.getElementById('fp-type').value;
    closeFieldProps();
    renderGraph();
}

function deleteFieldFromProps() {
    if (!fieldPropsTarget) return;
    const node = graph.nodes.find(n => n.id === fieldPropsTarget.nodeId);
    if (!node) return;
    node.fields.splice(fieldPropsTarget.fieldIdx, 1);
    closeFieldProps();
    autoLayout(true);
}

function addConnectedNode(fromId) {
    const id = 'n' + graph.nextId++;
    const parent = graph.nodes.find(n => n.id === fromId);
    graph.nodes.push({ id, x: parent.x, y: parent.y + nodeH(parent) + GAP_Y, label: 'Stage ' + graph.nodes.length, fields: [] });
    graph.edges.push({ id: 'e' + graph.nextId++, from: fromId, to: id });
    selectNode(id);
    autoLayout(true);
}

// ── Selection ──
function selectNode(id) {
    selection = { type: 'node', id };
}

function clearSelection() {
    selection = null;
}

// ── Render ──
function renderGraph() {
    // Don't destroy the DOM while an inline input is focused
    if (editingField || editingNodeLabel) {
        const active = document.activeElement;
        if (active && active.tagName === 'INPUT' && svg.contains(active)) return;
    }
    while (svg.firstChild) svg.removeChild(svg.firstChild);

    // Defs: arrowheads
    const defs = svgEl('defs');
    const marker = svgEl('marker', { id: 'ge-arrow', viewBox: '0 0 10 10', refX: '10', refY: '5',
        markerWidth: '8', markerHeight: '8', orient: 'auto-start-reverse' });
    marker.appendChild(svgEl('path', { d: 'M 0 0 L 10 5 L 0 10 z', fill: '#555' }));
    defs.appendChild(marker);
    const markerBlue = svgEl('marker', { id: 'ge-arrow-blue', viewBox: '0 0 10 10', refX: '10', refY: '5',
        markerWidth: '8', markerHeight: '8', orient: 'auto-start-reverse' });
    markerBlue.appendChild(svgEl('path', { d: 'M 0 0 L 10 5 L 0 10 z', fill: '#2a6bcf' }));
    defs.appendChild(markerBlue);
    svg.appendChild(defs);

    // Edges + inline annotation symbols
    graph.edges.forEach(e => {
        const fromNode = graph.nodes.find(n => n.id === e.from);
        const toNode = graph.nodes.find(n => n.id === e.to);
        if (!fromNode || !toNode) return;

        const x1 = fromNode.x + NODE_W / 2, y1 = fromNode.y + nodeH(fromNode);
        const x2 = toNode.x + NODE_W / 2, y2 = toNode.y;
        const isSel = selection && selection.type === 'edge' && selection.id === e.id;
        const strokeColor = isSel ? '#2a6bcf' : '#555';
        const strokeW = isSel ? '3' : '2';
        const markerUrl = isSel ? 'url(#ge-arrow-blue)' : 'url(#ge-arrow)';

        const annotations = [
            ...((e.conditions || []).map(c => ({ type: 'condition', obj: c }))),
            ...((e.hooks || []).map(h => ({ type: 'hook', obj: h }))),
        ];

        if (!annotations.length) {
            // Simple edge — no symbols
            const d = edgePath(x1, y1, x2, y2);
            const hit = svgEl('path', { d, fill: 'none', stroke: 'transparent', 'stroke-width': '14', cursor: 'pointer' });
            hit.dataset.edgeId = e.id;
            svg.appendChild(hit);
            svg.appendChild(svgEl('path', { d, fill: 'none', stroke: strokeColor, 'stroke-width': strokeW, 'marker-end': markerUrl, 'pointer-events': 'none' }));
        } else {
            // Compute symbol center positions along the vertical span
            const totalSymH = annotations.length * SYMBOL_SIZE + (annotations.length - 1) * SYMBOL_GAP;
            const midY = (y1 + y2) / 2;
            const symStartY = midY - totalSymH / 2 + SYMBOL_SIZE / 2;
            const symX = (x1 + x2) / 2;  // centered horizontally on the edge

            // Build waypoints: source port → each symbol center → target port
            const waypoints = [{ x: x1, y: y1 }];
            annotations.forEach((a, ai) => {
                waypoints.push({ x: symX, y: symStartY + ai * (SYMBOL_SIZE + SYMBOL_GAP) });
            });
            waypoints.push({ x: x2, y: y2 });

            // Draw edge segments between waypoints, skipping through symbols
            const hs = SYMBOL_SIZE / 2;
            for (let i = 0; i < waypoints.length - 1; i++) {
                const wp0 = waypoints[i];
                const wp1 = waypoints[i + 1];
                // Start: if leaving a symbol, start below it; if from port, start at port
                const sy = (i > 0) ? wp0.y + hs : wp0.y;
                // End: if entering a symbol, end above it; if to port, end at port
                const ey = (i < waypoints.length - 2) ? wp1.y - hs : wp1.y;
                const d = edgePath(wp0.x, sy, wp1.x, ey);
                // Hit target
                const hit = svgEl('path', { d, fill: 'none', stroke: 'transparent', 'stroke-width': '14', cursor: 'pointer' });
                hit.dataset.edgeId = e.id;
                svg.appendChild(hit);
                // Visible segment
                const isLast = i === waypoints.length - 2;
                svg.appendChild(svgEl('path', {
                    d, fill: 'none', stroke: strokeColor, 'stroke-width': strokeW,
                    'marker-end': isLast ? markerUrl : '',
                    'pointer-events': 'none',
                }));
            }

            // Draw symbols on top
            annotations.forEach((a, ai) => {
                const cx = symX;
                const cy = symStartY + ai * (SYMBOL_SIZE + SYMBOL_GAP);
                const g = svgEl('g');
                g.style.cursor = 'pointer';
                g.dataset.annotationType = a.type;
                g.dataset.annotationId = a.obj.id;
                g.dataset.edgeId = e.id;

                if (a.type === 'condition') {
                    const sz = SYMBOL_SIZE / 2;
                    g.appendChild(svgEl('polygon', {
                        points: `${cx},${cy - sz} ${cx + sz},${cy} ${cx},${cy + sz} ${cx - sz},${cy}`,
                        fill: '#fff3e0', stroke: '#e65100', 'stroke-width': '2',
                    }));
                    const icon = svgEl('text', {
                        x: cx, y: cy - 2,
                        'font-size': '16', 'font-weight': '700', fill: '#e65100',
                        'text-anchor': 'middle', 'dominant-baseline': 'central',
                        'pointer-events': 'none',
                    });
                    icon.textContent = '?';
                    g.appendChild(icon);
                    const lbl = svgEl('text', {
                        x: cx, y: cy + 11,
                        'font-size': '7', 'font-weight': '700', fill: '#e65100',
                        'text-anchor': 'middle', 'dominant-baseline': 'central',
                        'pointer-events': 'none', 'letter-spacing': '0.05em',
                    });
                    lbl.textContent = 'GATE';
                    g.appendChild(lbl);
                } else {
                    const hs2 = SYMBOL_SIZE / 2;
                    g.appendChild(svgEl('rect', {
                        x: cx - hs2, y: cy - hs2, width: SYMBOL_SIZE, height: SYMBOL_SIZE,
                        rx: '6', fill: '#e3f2fd', stroke: '#1565c0', 'stroke-width': '2',
                    }));
                    const icon = svgEl('text', {
                        x: cx, y: cy - 2,
                        'font-size': '18', fill: '#1565c0',
                        'text-anchor': 'middle', 'dominant-baseline': 'central',
                        'pointer-events': 'none',
                    });
                    icon.textContent = '\u26A1';
                    g.appendChild(icon);
                    const lbl = svgEl('text', {
                        x: cx, y: cy + 12,
                        'font-size': '7', 'font-weight': '700', fill: '#1565c0',
                        'text-anchor': 'middle', 'dominant-baseline': 'central',
                        'pointer-events': 'none', 'letter-spacing': '0.05em',
                    });
                    lbl.textContent = 'HOOK';
                    g.appendChild(lbl);
                }
                svg.appendChild(g);
            });
        }
    });

    // In-progress edge draw
    if (edgeDrawState) {
        const from = graph.nodes.find(n => n.id === edgeDrawState.fromId);
        if (from) {
            const x1 = from.x + NODE_W / 2, y1 = from.y + nodeH(from);
            const line = svgEl('path', {
                d: edgePath(x1, y1, edgeDrawState.mx, edgeDrawState.my),
                fill: 'none', stroke: '#2a6bcf', 'stroke-width': '2', 'stroke-dasharray': '6,3',
                'pointer-events': 'none', 'marker-end': 'url(#ge-arrow-blue)',
            });
            svg.appendChild(line);
        }
    }

    // Nodes
    graph.nodes.forEach(n => {
        const h = nodeH(n);
        const g = svgEl('g');
        const isSel = selection && selection.type === 'node' && selection.id === n.id;

        // Background
        g.appendChild(svgEl('rect', {
            x: n.x, y: n.y, width: NODE_W, height: h, rx: NODE_R,
            fill: '#fff', stroke: isSel ? '#2a6bcf' : '#bbb',
            'stroke-width': isSel ? '2.5' : '1.5',
        }));

        // Header label (double-click to rename)
        if (editingNodeLabel === n.id) {
            const fo = document.createElementNS('http://www.w3.org/2000/svg', 'foreignObject');
            fo.setAttribute('x', n.x + 4);
            fo.setAttribute('y', n.y + 2);
            fo.setAttribute('width', NODE_W - 8);
            fo.setAttribute('height', NODE_HEADER - 4);
            const input = document.createElement('input');
            input.type = 'text';
            input.value = n.label;
            input.style.cssText = 'width:100%;height:100%;border:1px solid #4a9eff;border-radius:3px;padding:0 4px;font-size:13px;font-weight:600;font-family:inherit;outline:none;box-sizing:border-box;background:#fff;text-align:center;';
            input.addEventListener('keydown', (ev) => {
                ev.stopPropagation();
                if (ev.key === 'Enter') {
                    n.label = input.value.trim() || n.label;
                    editingNodeLabel = null;
                    renderGraph();
                } else if (ev.key === 'Escape') {
                    editingNodeLabel = null;
                    renderGraph();
                }
            });
            input.addEventListener('blur', () => {
                n.label = input.value.trim() || n.label;
                editingNodeLabel = null;
                renderGraph();
            });
            fo.appendChild(input);
            g.appendChild(fo);
            requestAnimationFrame(() => { input.focus(); input.select(); });
        } else {
            // Clickable header region
            const headerHit = svgEl('rect', {
                x: n.x, y: n.y, width: NODE_W, height: NODE_HEADER,
                fill: 'transparent', cursor: 'text',
                'data-action': 'rename-node', 'data-node-id': n.id,
            });
            g.appendChild(headerHit);
            const txt = svgEl('text', {
                x: n.x + NODE_W / 2, y: n.y + NODE_HEADER / 2,
                'text-anchor': 'middle', 'dominant-baseline': 'central',
                'font-size': '13', 'font-weight': '600', fill: '#1a1a2e',
                'pointer-events': 'none',
            });
            txt.textContent = n.label;
            g.appendChild(txt);
        }

        // Separator line under header
        g.appendChild(svgEl('line', {
            x1: n.x + 1, y1: n.y + NODE_HEADER, x2: n.x + NODE_W - 1, y2: n.y + NODE_HEADER,
            stroke: '#eee', 'stroke-width': '1', 'pointer-events': 'none',
        }));

        // Fields
        const fields = n.fields || [];
        fields.forEach((f, fi) => {
            const fy = n.y + NODE_HEADER + fi * NODE_FIELD_H;
            const isEditing = editingField && editingField.nodeId === n.id && editingField.fieldIdx === fi;

            if (isEditing) {
                // Inline HTML input via foreignObject
                const fo = document.createElementNS('http://www.w3.org/2000/svg', 'foreignObject');
                fo.setAttribute('x', n.x + 6);
                fo.setAttribute('y', fy + 1);
                fo.setAttribute('width', NODE_W - 12);
                fo.setAttribute('height', NODE_FIELD_H - 2);
                const input = document.createElement('input');
                input.type = 'text';
                input.value = f.name;
                input.placeholder = 'Field name...';
                input.style.cssText = 'width:100%;height:100%;border:1px solid #4a9eff;border-radius:3px;padding:0 4px;font-size:11px;font-family:inherit;outline:none;box-sizing:border-box;background:#fff;';
                input.addEventListener('keydown', (ev) => {
                    ev.stopPropagation();
                    if (ev.key === 'Enter') {
                        f.name = input.value.trim();
                        commitFieldName();
                    } else if (ev.key === 'Escape') {
                        f.name = '';
                        commitFieldName();
                    }
                });
                input.addEventListener('blur', () => {
                    f.name = input.value.trim();
                    commitFieldName();
                });
                fo.appendChild(input);
                g.appendChild(fo);
                // Auto-focus after append
                requestAnimationFrame(() => input.focus());
            } else {
                // Type badge
                const typeColors = { string: '#1565c0', text: '#1565c0', boolean: '#e65100', enum: '#7b1fa2', number: '#2e7d32', date: '#00695c', signature: '#c62828' };
                const typeBgs = { string: '#e3f2fd', text: '#e3f2fd', boolean: '#fff3e0', enum: '#f3e5f5', number: '#e8f5e9', date: '#e0f2f1', signature: '#fce4ec' };
                const ft = f.type || 'string';
                const badgeW = ft.length * 5.5 + 8;
                g.appendChild(svgEl('rect', {
                    x: n.x + 8, y: fy + 3, width: badgeW, height: NODE_FIELD_H - 6,
                    rx: '3', fill: typeBgs[ft] || '#f5f5f5', 'pointer-events': 'none',
                }));
                const badgeTxt = svgEl('text', {
                    x: n.x + 8 + badgeW / 2, y: fy + NODE_FIELD_H / 2,
                    'text-anchor': 'middle', 'dominant-baseline': 'central',
                    'font-size': '8', 'font-weight': '700', fill: typeColors[ft] || '#555',
                    'pointer-events': 'none', 'text-transform': 'uppercase',
                });
                badgeTxt.textContent = ft.toUpperCase();
                g.appendChild(badgeTxt);

                // Field name
                const ftxt = svgEl('text', {
                    x: n.x + 8 + badgeW + 5, y: fy + NODE_FIELD_H / 2,
                    'dominant-baseline': 'central',
                    'font-size': '11', fill: '#333',
                    'pointer-events': 'none',
                });
                ftxt.textContent = f.name || 'unnamed';
                g.appendChild(ftxt);

                // Pencil edit button
                const pencilG = svgEl('g');
                pencilG.style.cursor = 'pointer';
                pencilG.dataset.action = 'edit-field';
                pencilG.dataset.nodeId = n.id;
                pencilG.dataset.fieldIdx = fi;
                const pencilTxt = svgEl('text', {
                    x: n.x + NODE_W - 14, y: fy + NODE_FIELD_H / 2,
                    'text-anchor': 'middle', 'dominant-baseline': 'central',
                    'font-size': '11', fill: '#888', cursor: 'pointer',
                });
                pencilTxt.textContent = '\u270E';
                pencilG.appendChild(pencilTxt);
                g.appendChild(pencilG);
            }
        });

        // "+ New Field" button
        const btnY = n.y + NODE_HEADER + fields.length * NODE_FIELD_H;
        const btnG = svgEl('g');
        btnG.style.cursor = 'pointer';
        btnG.dataset.action = 'add-field';
        btnG.dataset.nodeId = n.id;
        // Button background
        btnG.appendChild(svgEl('rect', {
            x: n.x + 8, y: btnY + 3, width: NODE_W - 16, height: NODE_BTN_H - 6,
            rx: '4', fill: '#f5f7fa', stroke: '#dde1e6', 'stroke-width': '1',
        }));
        const btnTxt = svgEl('text', {
            x: n.x + NODE_W / 2, y: btnY + NODE_BTN_H / 2,
            'text-anchor': 'middle', 'dominant-baseline': 'central',
            'font-size': '11', 'font-weight': '500', fill: '#2a6bcf',
            'pointer-events': 'none',
        });
        btnTxt.textContent = '+ New Field';
        btnG.appendChild(btnTxt);
        g.appendChild(btnG);

        // Output port (bottom)
        g.appendChild(svgEl('circle', {
            cx: n.x + NODE_W / 2, cy: n.y + h,
            r: PORT_R, fill: '#fff', stroke: '#2a6bcf', 'stroke-width': '2',
            class: 'ge-port ge-port-out', 'data-node-id': n.id,
            cursor: 'crosshair',
        }));

        // Input port (top)
        g.appendChild(svgEl('circle', {
            cx: n.x + NODE_W / 2, cy: n.y,
            r: PORT_R, fill: '#fff', stroke: '#2a6bcf', 'stroke-width': '2',
            class: 'ge-port ge-port-in', 'data-node-id': n.id,
            cursor: 'crosshair',
        }));

        g.dataset.nodeId = n.id;
        svg.appendChild(g);
    });
}

function edgePath(x1, y1, x2, y2) {
    const dy = y2 - y1;
    const cy = Math.max(Math.abs(dy) * 0.4, 30);
    return `M ${x1} ${y1} C ${x1} ${y1 + cy}, ${x2} ${y2 - cy}, ${x2} ${y2}`;
}

function svgEl(tag, attrs) {
    const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
    if (attrs) Object.entries(attrs).forEach(([k, v]) => el.setAttribute(k, v));
    return el;
}

// ── Interaction ──
function onCanvasPointerDown(e) {
    const pt = svgPt(e);
    const target = e.target;

    // Rename node header
    const renameBtn = target.closest('[data-action="rename-node"]');
    if (renameBtn) {
        editingNodeLabel = renameBtn.dataset.nodeId;
        renderGraph();
        return;
    }

    // Edit field pencil
    const editFieldBtn = target.closest('[data-action="edit-field"]');
    if (editFieldBtn) {
        openFieldProps(editFieldBtn.dataset.nodeId, parseInt(editFieldBtn.dataset.fieldIdx));
        return;
    }

    // "+ New Field" button
    const addFieldBtn = target.closest('[data-action="add-field"]');
    if (addFieldBtn) {
        const nodeId = addFieldBtn.dataset.nodeId;
        addFieldToNode(nodeId);
        return;
    }

    // Click edge → select
    if (target.dataset.edgeId) {
        selection = { type: 'edge', id: target.dataset.edgeId };
        renderGraph();
        return;
    }

    // Port drag → start edge
    if (target.classList.contains('ge-port-out')) {
        edgeDrawState = { fromId: target.dataset.nodeId, mx: pt.x, my: pt.y };
        svg.setPointerCapture(e.pointerId);
        e.stopPropagation();
        return;
    }

    // Click node → select
    const nodeG = target.closest('[data-node-id]');
    if (nodeG && !target.classList.contains('ge-port')) {
        selectNode(nodeG.dataset.nodeId);
        renderGraph();
        return;
    }

    // Click canvas → deselect
    clearSelection();
    renderGraph();
}

function onCanvasPointerMove(e) {
    if (edgeDrawState) {
        const pt = svgPt(e);
        edgeDrawState.mx = pt.x;
        edgeDrawState.my = pt.y;
        renderGraph();
    }
}

function onCanvasPointerUp(e) {
    if (edgeDrawState) {
        const target = document.elementFromPoint(e.clientX, e.clientY);
        if (target && target.classList.contains('ge-port-in')) {
            const toId = target.dataset.nodeId;
            if (toId !== edgeDrawState.fromId) {
                const exists = graph.edges.some(ed => ed.from === edgeDrawState.fromId && ed.to === toId);
                if (!exists) {
                    graph.edges.push({ id: 'e' + graph.nextId++, from: edgeDrawState.fromId, to: toId });
                    edgeDrawState = null;
                    autoLayout(true);
                    return;
                }
            }
        }
        edgeDrawState = null;
        renderGraph();
    }
}


// Init on load
document.addEventListener('DOMContentLoaded', initEditor);
</script>
