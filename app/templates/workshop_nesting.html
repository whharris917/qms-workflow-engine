{% extends "base.html" %}
{% block title %}Nesting Visualizations &middot; Workshop &middot; Razem{% endblock %}
{% block content %}
<div class="nest-ws">

  <nav class="nest-ws__topbar" aria-label="Experiment switcher">
    <a class="nest-ws__back" href="/workshop">&larr;</a>
    <div class="nest-ws__tabs" role="tablist">
      <div class="nest-ws__row">
        <button class="nest-ws__tab is-active" role="tab" aria-selected="true" data-tab="exp-a">Experiment A</button>
        <button class="nest-ws__tab" role="tab" aria-selected="false" data-tab="exp-b">Experiment B</button>
        <button class="nest-ws__tab" role="tab" aria-selected="false" data-tab="exp-c">Experiment C</button>
        <button class="nest-ws__tab" role="tab" aria-selected="false" data-tab="exp-d">Experiment D</button>
      </div>
    </div>
  </nav>

  <section class="nest-ws__canvas is-active" role="tabpanel" data-panel="exp-a">
    <div class="expA-root"></div>
  </section>

  <section class="nest-ws__canvas" role="tabpanel" data-panel="exp-b" hidden>
    <div class="expB-root"></div>
  </section>

  <section class="nest-ws__canvas" role="tabpanel" data-panel="exp-c" hidden>
    <div class="expC-root"></div>
  </section>

  <section class="nest-ws__canvas" role="tabpanel" data-panel="exp-d" hidden>
    <div class="expD-root"></div>
  </section>

</div>

<style>
/* Scoped to .nest-ws. The whole viewport (minus sidebar) is the canvas; the
   topbar is the only persistent chrome. */

.nest-ws {
    --nw-accent:      #6366f1;
    --nw-accent-2:    #a855f7;
    --nw-pink:        #ec4899;
    --nw-text:        #1f2144;
    --nw-muted:       #4a4e6d;
    --nw-subtle:      #8088a8;
    --nw-chip-bg:     rgba(255, 255, 255, 0.62);
    --nw-chip-border: rgba(160, 180, 220, 0.38);
    --nw-font:        -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, "Helvetica Neue", sans-serif;

    position: relative;
    margin: -2rem;                /* bleed past base.html's .content padding */
    min-height: calc(100vh);
    display: flex;
    flex-direction: column;
    font-family: var(--nw-font);
    font-size: 15px;
    line-height: 1.55;
    color: var(--nw-text);

    background:
        radial-gradient(at 15% 20%, #ffe3f0 0%, transparent 55%),
        radial-gradient(at 85% 15%, #c8d8ff 0%, transparent 55%),
        radial-gradient(at 70% 85%, #d9c8ff 0%, transparent 55%),
        radial-gradient(at 20% 90%, #c4f0f4 0%, transparent 55%),
        linear-gradient(160deg, #f7f9ff 0%, #fdf4ff 100%);
    background-attachment: fixed;
}

/* ----- Topbar ----- */
.nest-ws__topbar {
    flex-shrink: 0;
    display: flex;
    align-items: flex-start;
    gap: 14px;
    padding: 12px 20px;
    border-bottom: 1px solid rgba(160, 180, 220, 0.22);
    background: rgba(255, 255, 255, 0.35);
    backdrop-filter: blur(14px) saturate(160%);
    -webkit-backdrop-filter: blur(14px) saturate(160%);
}

.nest-ws__back {
    color: var(--nw-muted);
    text-decoration: none;
    font-size: 1.1rem;
    line-height: 1;
    padding: 4px 8px;
    border-radius: 6px;
    transition: color 0.12s, background 0.12s;
}
.nest-ws__back:hover {
    color: var(--nw-text);
    background: rgba(255, 255, 255, 0.5);
}

.nest-ws__tabs {
    display: flex;
    flex-direction: column;
    gap: 6px;
    flex: 1 1 auto;
    min-width: 0;
}
.nest-ws__row {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    align-items: center;
}
.nest-ws__row--child { padding-left: 28px; }
.nest-ws__lineage {
    font-size: 11px;
    color: var(--nw-subtle);
    font-style: italic;
    margin-right: 4px;
}
.nest-ws__tab {
    font: inherit;
    font-size: 0.88em;
    font-weight: 500;
    color: var(--nw-muted);
    background: var(--nw-chip-bg);
    border: 1px solid var(--nw-chip-border);
    border-radius: 999px;
    padding: 6px 14px;
    cursor: pointer;
    transition: transform 0.12s ease, color 0.12s ease, box-shadow 0.12s ease;
}
.nest-ws__tab:hover {
    color: var(--nw-text);
    transform: translateY(-1px);
}
.nest-ws__tab.is-active {
    color: #ffffff;
    background: linear-gradient(135deg, var(--nw-accent) 0%, var(--nw-accent-2) 100%);
    border-color: transparent;
    box-shadow: 0 4px 14px rgba(99, 102, 241, 0.35);
}

/* ----- Canvas: full-bleed, no frame. ----- */
.nest-ws__canvas {
    flex: 1;
    position: relative;
}
.nest-ws__canvas[hidden] {
    display: none;
}

/* =====================================================================
   Shared primitives for the current step + leaf panel. The .exp431x-
   namespace is a holdover from earlier experimental rounds; kept stable
   so the buildStep / buildLeafPanel helpers stay self-contained.
   ===================================================================== */
.exp431x-step {
    display: flex;
    flex-direction: column;
    gap: 12px;
}
.exp431x-bubble {
    display: flex;
    gap: 12px;
    align-items: flex-start;
}
.exp431x-avatar {
    width: 28px;
    height: 28px;
    flex-shrink: 0;
    border-radius: 50%;
    background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
    color: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    box-shadow: 0 2px 8px rgba(99, 102, 241, 0.32);
}
.exp431x-bubble-body {
    flex: 1;
    min-width: 0;
}
.exp431x-bubble-meta {
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: #8088a8;
    margin-bottom: 4px;
    display: flex;
    justify-content: space-between;
    gap: 8px;
}
.exp431x-bubble-progress {
    font-size: 11px;
    font-weight: 500;
    text-transform: none;
    letter-spacing: 0;
    color: #8088a8;
    font-variant-numeric: tabular-nums;
}
.exp431x-bubble-text {
    margin: 0;
    color: #1f2144;
    line-height: 1.55;
    font-size: 13.5px;
}
.exp431x-bubble-text + .exp431x-bubble-text { margin-top: 0.55em; }

.exp431x-tabs {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    padding-left: 40px;
}
.exp431x-tab {
    font: inherit;
    font-size: 13px;
    padding: 7px 14px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.62);
    border: 1px solid rgba(160, 180, 220, 0.42);
    color: #4a4e6d;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    transition: transform 0.12s, color 0.12s, box-shadow 0.12s, background 0.12s, border-color 0.12s;
}
.exp431x-tab:hover {
    color: #1f2144;
    transform: translateY(-1px);
    background: rgba(255, 255, 255, 0.82);
}
.exp431x-tab.is-done .exp431x-tab-label {
    text-decoration: line-through;
    text-decoration-color: rgba(74, 78, 109, 0.4);
    color: #8088a8;
}
.exp431x-tab.is-active.is-done .exp431x-tab-label {
    color: rgba(255, 255, 255, 0.9);
    text-decoration-color: rgba(255, 255, 255, 0.55);
}
.exp431x-tab-pip {
    font-size: 11px;
    font-variant-numeric: tabular-nums;
    padding: 1px 7px;
    border-radius: 10px;
    background: rgba(99, 102, 241, 0.1);
    color: #6366f1;
    flex-shrink: 0;
}
.exp431x-tab.is-active .exp431x-tab-pip {
    background: rgba(255, 255, 255, 0.22);
    color: #ffffff;
}
.exp431x-tab-pip.is-complete {
    background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
    color: #ffffff;
    font-weight: 600;
}
.exp431x-tab.is-active .exp431x-tab-pip.is-complete {
    background: rgba(255, 255, 255, 0.92);
    color: #6366f1;
}
.exp431x-tab-check {
    width: 14px;
    height: 14px;
    flex-shrink: 0;
    border: 1.5px solid rgba(168, 85, 247, 0.45);
    border-radius: 4px;
    background: transparent;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 9px;
    color: transparent;
}
.exp431x-tab.is-done .exp431x-tab-check {
    background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
    border-color: transparent;
    color: #ffffff;
}
.exp431x-tab.is-active .exp431x-tab-check {
    border-color: rgba(255, 255, 255, 0.7);
}
.exp431x-tab.is-active.is-done .exp431x-tab-check {
    background: #ffffff;
    border-color: transparent;
    color: #6366f1;
}

.exp431x-leaf-panel {
    background: rgba(255, 255, 255, 0.78);
    border: 1px solid rgba(160, 180, 220, 0.42);
    border-radius: 16px;
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    box-shadow: 0 6px 24px rgba(59, 41, 102, 0.08);
    padding: 22px 24px;
    /* Sits above the absolutely-positioned thread that runs through its
       area. Without this the thread would paint on top of the panel. */
    position: relative;
    z-index: 1;
}
.exp431x-leaf-crumb {
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #8088a8;
    margin-bottom: 4px;
}
.exp431x-leaf-title {
    font-size: 1.3em;
    font-weight: 600;
    margin: 0 0 14px;
    background: linear-gradient(90deg, #6366f1 0%, #ec4899 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
}
.exp431x-leaf-body {
    padding: 16px 18px;
    background: rgba(255, 255, 255, 0.55);
    border: 1px solid rgba(160, 180, 220, 0.32);
    border-radius: 10px;
    color: #1f2144;
    margin-bottom: 14px;
    line-height: 1.55;
    font-size: 13.5px;
}
.exp431x-toggle-btn {
    font: inherit;
    font-size: 0.92em;
    padding: 9px 18px;
    border: 1px solid rgba(99, 102, 241, 0.45);
    background: rgba(255, 255, 255, 0.6);
    color: #6366f1;
    border-radius: 999px;
    cursor: pointer;
    font-weight: 500;
    transition: background 0.12s, color 0.12s, border-color 0.12s, filter 0.12s;
}
.exp431x-toggle-btn:hover {
    background: rgba(99, 102, 241, 0.08);
    border-color: #6366f1;
}
.exp431x-toggle-btn.is-done {
    background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
    color: #ffffff;
    border-color: transparent;
    box-shadow: 0 4px 14px rgba(99, 102, 241, 0.32);
}
.exp431x-toggle-btn.is-done:hover { filter: brightness(1.05); }

/* =====================================================================
   Experiment A — the consolidated winner. Combines:
     - Drill-down navigation on a vertical thread
     - Read-only ancestor tabs (active highlighted, others muted) plus a
       "Change selection" pill button — the only path back, guaranteeing
       no choice is made without exposure to its instruction.
     - Circular progress indicators: SVG ring around each ancestor's
       thread node, larger ring replacing the current-step avatar, N/M
       pip on each read-only ancestor tab.
     - Non-navigation content threaded between navigation levels (info
       notes via INTERLEVEL_NOTES — shape is generic enough to swap in
       forms / references / acknowledgments).
     - Sequential gating: tab N+1 locked until tab N's subtree is
       complete. Locked tabs get padlock + dimmed treatment. A "Note"
       inside the bubble body explains the dependency.
     - "Proceed to Tab X" button when all current-scope tabs are done,
       walking up the path to find the next incomplete sibling.
     - "Workshop complete" celebration when nothing's left.
     - Auto-select first incomplete reachable leaf when scope drills
       to leaf level (handled in exp43121xCore.makeNavigator).
   ===================================================================== */
.nest-ws__canvas[data-panel="exp-a"] {
    padding: 0;
    overflow: auto;
    background:
        radial-gradient(at 15% 20%, #ffe3f0 0%, transparent 55%),
        radial-gradient(at 85% 15%, #c8d8ff 0%, transparent 55%),
        radial-gradient(at 70% 85%, #d9c8ff 0%, transparent 55%),
        radial-gradient(at 20% 90%, #c4f0f4 0%, transparent 55%),
        linear-gradient(160deg, #f7f9ff 0%, #fdf4ff 100%);
}
.expA-root {
    max-width: 760px;
    margin: 0 auto;
    padding: 28px 28px 56px;
    font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
    font-size: 14px;
    color: #1f2144;
    display: flex;
    flex-direction: column;
    gap: 24px;
}
.expA-nav {
    position: relative;
    display: flex;
    flex-direction: column;
    gap: 16px;
}
.expA-nav::before {
    content: '';
    position: absolute;
    top: 14px; bottom: 14px; left: 14px;
    width: 2px;
    background: linear-gradient(to bottom, rgba(99, 102, 241, 0.40) 0%, rgba(99, 102, 241, 0.65) 30%, #a855f7 100%);
    border-radius: 1px;
    pointer-events: none;
}

/* --- Ancestor row: ring node + read-only tab strip + Change button --- */
.expA-ancestor {
    display: flex;
    align-items: center;
    gap: 12px;
    z-index: 1;
    position: relative;
}
.expA-ancestor-node {
    width: 18px; height: 18px;
    flex-shrink: 0;
    margin-left: 5px;          /* center 18px element at x=14 */
    box-shadow: 0 0 0 4px rgba(247, 249, 255, 0.95);
    border-radius: 50%;
    position: relative;
}
.expA-ancestor-node svg { width: 100%; height: 100%; transform: rotate(-90deg); display: block; }
.expA-ancestor-tabs {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    flex: 1;
}
.expA-ancestor-tab {
    font: inherit;
    font-size: 12px;
    padding: 4px 10px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.45);
    border: 1px solid rgba(160, 180, 220, 0.32);
    color: #8088a8;
    cursor: default;
    user-select: none;
}
.expA-ancestor-tab.is-active {
    color: #ffffff;
    background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
    border-color: transparent;
    box-shadow: 0 2px 8px rgba(99, 102, 241, 0.28);
}
.expA-tab-pip {
    margin-left: 6px;
    font-size: 10.5px;
    font-variant-numeric: tabular-nums;
    padding: 0 6px;
    border-radius: 8px;
    background: rgba(99, 102, 241, 0.1);
    color: #6366f1;
}
.expA-ancestor-tab.is-active .expA-tab-pip { background: rgba(255, 255, 255, 0.22); color: #ffffff; }
.expA-tab-pip.is-complete { background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%); color: #ffffff; font-weight: 600; }
.expA-ancestor-tab.is-active .expA-tab-pip.is-complete { background: rgba(255, 255, 255, 0.92); color: #6366f1; }

.expA-ancestor-change {
    font: inherit;
    font-size: 11px;
    padding: 4px 10px;
    border: 1px solid rgba(99, 102, 241, 0.42);
    background: rgba(255, 255, 255, 0.55);
    color: #6366f1;
    border-radius: 999px;
    cursor: pointer;
    font-weight: 500;
    flex-shrink: 0;
    transition: background 0.12s, color 0.12s, border-color 0.12s;
}
.expA-ancestor-change:hover {
    background: rgba(99, 102, 241, 0.08);
    border-color: #6366f1;
    color: #4338ca;
}

/* --- Inline info node + card on the thread between nav levels --- */
.expA-info {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    z-index: 1;
    position: relative;
    margin: -2px 0;
}
.expA-info-node {
    width: 18px; height: 18px;
    flex-shrink: 0;
    margin-left: 5px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.95);
    border: 1.5px dashed rgba(99, 102, 241, 0.55);
    color: #6366f1;
    font-size: 10px;
    font-style: italic;
    font-family: Georgia, serif;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 0 0 4px rgba(247, 249, 255, 0.95);
}
.expA-info-card {
    flex: 1;
    padding: 10px 14px;
    background: rgba(255, 255, 255, 0.55);
    border: 1px dashed rgba(99, 102, 241, 0.32);
    border-radius: 12px;
    font-size: 12.5px;
    color: #4a4e6d;
    line-height: 1.55;
    font-style: italic;
}
.expA-info-card-meta {
    font-size: 9.5px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #8088a8;
    font-style: normal;
    margin-bottom: 3px;
}

/* --- Current step: ring avatar + bubble + active-tab gradient --- */
.expA-step { position: relative; z-index: 1; }
.expA-step-ring {
    width: 36px; height: 36px;
    flex-shrink: 0;
    border-radius: 50%;
    box-shadow: 0 0 0 4px rgba(247, 249, 255, 0.95), 0 0 0 8px rgba(168, 85, 247, 0.18), 0 4px 14px rgba(168, 85, 247, 0.45);
    position: relative;
    background: rgba(255, 255, 255, 0.95);
}
.expA-step-ring svg { width: 100%; height: 100%; transform: rotate(-90deg); display: block; }
.expA-step-ring::after {
    content: '✨';
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    font-size: 16px;
}
.expA-step .exp431x-tab.is-active {
    color: #ffffff;
    background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
    border-color: transparent;
    box-shadow: 0 4px 14px rgba(99, 102, 241, 0.32);
}

/* --- Sequential gating: locked tabs in the current step --- */
.expA-step .exp431x-tab.is-locked {
    opacity: 0.55;
    color: #8088a8;
    background: rgba(160, 180, 220, 0.18);
    border-color: rgba(160, 180, 220, 0.35);
    cursor: not-allowed;
}
.expA-step .exp431x-tab.is-locked::before {
    content: '\01F512';   /* 🔒 */
    margin-right: 6px;
    font-size: 11px;
    opacity: 0.8;
}
.expA-step .exp431x-tab.is-locked .exp431x-tab-pip {
    background: rgba(160, 180, 220, 0.25);
    color: #8088a8;
}
.expA-step .exp431x-tab.is-locked .exp431x-tab-check {
    border-color: rgba(160, 180, 220, 0.55);
}
/* Inline note appended inside the AI bubble's body when ≥1 tab is locked. */
.expA-gate-hint {
    margin-top: 10px;
    padding: 8px 12px;
    background: rgba(168, 85, 247, 0.08);
    border-radius: 8px;
    font-size: 12px;
    color: #6b6b8a;
    line-height: 1.5;
}
.expA-gate-hint strong { color: #1f2144; font-weight: 600; }

/* --- Proceed-to-next and workshop-complete elements on the thread --- */
.expA-proceed, .expA-complete {
    display: flex;
    align-items: center;
    gap: 12px;
    z-index: 1;
    position: relative;
    margin-top: 4px;
}
.expA-proceed-node {
    width: 18px; height: 18px;
    flex-shrink: 0;
    margin-left: 5px;
    border-radius: 50%;
    background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
    color: #ffffff;
    font-size: 10px;
    font-weight: 700;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 0 0 4px rgba(247, 249, 255, 0.95), 0 4px 14px rgba(168, 85, 247, 0.45);
}
.expA-proceed-btn {
    font: inherit;
    font-size: 13px;
    padding: 9px 18px;
    border: 1px solid transparent;
    background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
    color: #ffffff;
    border-radius: 999px;
    cursor: pointer;
    font-weight: 600;
    box-shadow: 0 4px 14px rgba(99, 102, 241, 0.32);
    transition: filter 0.12s, transform 0.12s;
}
.expA-proceed-btn:hover {
    filter: brightness(1.08);
    transform: translateY(-1px);
}
.expA-complete-node {
    width: 18px; height: 18px;
    flex-shrink: 0;
    margin-left: 5px;
    border-radius: 50%;
    background: linear-gradient(135deg, #16a34a 0%, #22c55e 100%);
    color: #ffffff;
    font-size: 11px;
    font-weight: 700;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 0 0 4px rgba(247, 249, 255, 0.95), 0 4px 14px rgba(34, 197, 94, 0.4);
}
.expA-complete-text {
    font-size: 13.5px;
    font-weight: 600;
    color: #166534;
}

/* =====================================================================
   Embedded Razem-component styling for A's leaf body. Each leaf renders
   real component HTML (.component[data-form="text"|"choice"|"date"|
   "checkbox"], etc.) so this experiment exercises A's structure with
   realistic content rather than placeholder text. The rules below
   approximate Razem's default-theme rendering.
   ===================================================================== */
.exp431x-leaf-body .component {
    margin: 12px 0;
    padding: 12px 14px;
    background: rgba(255, 255, 255, 0.55);
    border: 1px solid rgba(160, 180, 220, 0.32);
    border-radius: 10px;
}
.exp431x-leaf-body .component:first-child { margin-top: 0; }
.exp431x-leaf-body .component:last-child  { margin-bottom: 0; }
.exp431x-leaf-body .component h3 {
    font-size: 1em;
    font-weight: 600;
    margin: 0 0 4px;
    color: #1f2144;
}
.exp431x-leaf-body .component p {
    margin: 0 0 6px;
    color: #4a4e6d;
    font-size: 0.9em;
    line-height: 1.4;
}
.exp431x-leaf-body .component p strong { color: #1f2144; }
.exp431x-leaf-body .component input[type="text"],
.exp431x-leaf-body .component input[type="date"] {
    padding: 6px 10px;
    border: 1px solid rgba(160, 180, 220, 0.45);
    border-radius: 6px;
    font: inherit;
    font-size: 0.9em;
    background: #ffffff;
    box-sizing: border-box;
    width: 100%;
}

<script>
// ----- Outer experiment switcher (kept for symmetry; with a single
// experiment it just keeps the panel in sync with its tab button) -----
(function () {
    const root = document.querySelector('.nest-ws');
    if (!root) return;
    const tabs = root.querySelectorAll('.nest-ws__tab');
    const panels = root.querySelectorAll('.nest-ws__canvas');

    tabs.forEach(tab => {
        tab.addEventListener('click', () => {
            const target = tab.dataset.tab;
            tabs.forEach(t => {
                const active = t === tab;
                t.classList.toggle('is-active', active);
                t.setAttribute('aria-selected', active ? 'true' : 'false');
            });
            panels.forEach(p => {
                const active = p.dataset.panel === target;
                p.classList.toggle('is-active', active);
                if (active) {
                    p.removeAttribute('hidden');
                    // Variants that depend on layout measurements (A.3 SVG
                    // path; A.1 wire heights) listen for this event and
                    // recompute when their panel becomes visible.
                    p.dispatchEvent(new CustomEvent('panelshown'));
                } else {
                    p.setAttribute('hidden', '');
                }
            });
        });
    });
})();

// ----- Shared step + leaf-panel primitives. The .exp431x- namespace is
// a holdover from earlier experimental rounds; kept stable so future
// variants can keep composing buildStep / buildLeafPanel cleanly. -----
const exp431xShared = (function () {
    const MAX_DEPTH = 3;
    const INSTRUCTIONS = [
        'Pick a chapter to read.',
        'Pick a section within this chapter. Sections group articles that share a theme, so you can skim in any order.',
        'Pick an article to read.\n\nArticles are the leaves of this navigation tree. Each takes 5–10 minutes and is self-contained, so you can read them in any order.',
    ];
    const STEP_LABELS = [
        'Step 1 · Choose a chapter',
        'Step 2 · Choose a section',
        'Step 3 · Choose an article',
    ];

    function leafPathsUnder(prefix) {
        const startDepth = prefix ? prefix.split('.').length : 0;
        if (startDepth === MAX_DEPTH) return [prefix];
        const result = [];
        (function enumerate(p, depth) {
            if (depth === MAX_DEPTH) { result.push(p); return; }
            for (let i = 1; i <= 3; i++) {
                enumerate(p ? p + '.' + i : String(i), depth + 1);
            }
        })(prefix, startDepth);
        return result;
    }
    function progressForFn(done) {
        return function (prefix) {
            const leaves = leafPathsUnder(prefix);
            return {
                total: leaves.length,
                completed: leaves.filter(p => done.has(p)).length,
            };
        };
    }

    function buildStep(opts) {
        const { depth, path, done, onSelectAt, stepClass } = opts;
        const progressFor = progressForFn(done);
        const parentPrefix = path.slice(0, depth).join('.');
        const isLeafLevel = depth === MAX_DEPTH - 1;
        const labelPrefix = isLeafLevel ? 'Leaf ' : 'Tab ';

        const step = document.createElement('div');
        step.className = 'exp431x-step' + (stepClass ? ' ' + stepClass : '');
        step.dataset.depth = depth;

        const bubble = document.createElement('div');
        bubble.className = 'exp431x-bubble';
        const avatar = document.createElement('span');
        avatar.className = 'exp431x-avatar';
        avatar.textContent = '✨';
        bubble.appendChild(avatar);
        const body = document.createElement('div');
        body.className = 'exp431x-bubble-body';
        const meta = document.createElement('div');
        meta.className = 'exp431x-bubble-meta';
        const metaLabel = document.createElement('span');
        metaLabel.textContent = STEP_LABELS[depth];
        meta.appendChild(metaLabel);
        const stepProgress = progressFor(parentPrefix);
        const metaProgress = document.createElement('span');
        metaProgress.className = 'exp431x-bubble-progress';
        metaProgress.textContent = stepProgress.completed + ' of ' + stepProgress.total + ' done';
        meta.appendChild(metaProgress);
        body.appendChild(meta);
        INSTRUCTIONS[depth].split('\n\n').forEach(text => {
            const p = document.createElement('p');
            p.className = 'exp431x-bubble-text';
            p.textContent = text;
            body.appendChild(p);
        });
        bubble.appendChild(body);
        step.appendChild(bubble);

        const tabs = document.createElement('div');
        tabs.className = 'exp431x-tabs';
        for (let i = 1; i <= 3; i++) {
            const tabPath = parentPrefix ? parentPrefix + '.' + i : String(i);
            const tab = document.createElement('button');
            tab.type = 'button';
            tab.className = 'exp431x-tab';
            tab.dataset.depth = depth;
            tab.dataset.choice = i;
            tab.dataset.path = tabPath;

            const isActive = path[depth] === i;
            const isDoneLeaf = isLeafLevel && done.has(tabPath);
            if (isActive) tab.classList.add('is-active');
            if (isDoneLeaf) tab.classList.add('is-done');

            if (isLeafLevel) {
                const check = document.createElement('span');
                check.className = 'exp431x-tab-check';
                check.textContent = '✓';
                tab.appendChild(check);
            }
            const lbl = document.createElement('span');
            lbl.className = 'exp431x-tab-label';
            lbl.textContent = labelPrefix + tabPath;
            tab.appendChild(lbl);
            if (!isLeafLevel) {
                const { completed, total } = progressFor(tabPath);
                const pip = document.createElement('span');
                pip.className = 'exp431x-tab-pip';
                if (completed === total) pip.classList.add('is-complete');
                pip.textContent = completed + '/' + total;
                tab.appendChild(pip);
            }
            tab.addEventListener('click', () => onSelectAt(depth, i));
            tabs.appendChild(tab);
        }
        step.appendChild(tabs);
        return step;
    }

    function buildLeafPanel(opts) {
        const { path, done, onToggleDone } = opts;
        const leafPath = path.join('.');
        const isDone = done.has(leafPath);

        const panel = document.createElement('div');
        panel.className = 'exp431x-leaf-panel';

        const crumb = document.createElement('div');
        crumb.className = 'exp431x-leaf-crumb';
        crumb.textContent = 'Now reading';
        panel.appendChild(crumb);

        const title = document.createElement('h2');
        title.className = 'exp431x-leaf-title';
        title.textContent = 'Leaf ' + leafPath;
        panel.appendChild(title);

        const body = document.createElement('div');
        body.className = 'exp431x-leaf-body';
        body.textContent = '[Leaf content for ' + leafPath + ']';
        panel.appendChild(body);

        const toggle = document.createElement('button');
        toggle.type = 'button';
        toggle.className = 'exp431x-toggle-btn' + (isDone ? ' is-done' : '');
        toggle.textContent = isDone ? '✓ Completed' : 'Mark as done';
        toggle.addEventListener('click', onToggleDone);
        panel.appendChild(toggle);

        return panel;
    }

    return { MAX_DEPTH, INSTRUCTIONS, STEP_LABELS, leafPathsUnder, progressForFn, buildStep, buildLeafPanel };
})();

// ----- Drill-down state machine. Each variant supplies its own render
// function via opts.onRender. Auto-selects the first incomplete +
// reachable leaf when scope reaches leaf level. -----
const exp43121xCore = (function () {
    const { MAX_DEPTH } = exp431xShared;

    function makeNavigator(opts) {
        let scope = (opts.initialScope || []).slice();
        let selectedLeaf = (opts.initialLeaf !== undefined) ? opts.initialLeaf : null;
        const done = new Set(opts.initialDone || ['1.1.1', '1.2.3']);
        const onRender = opts.onRender;

        function getStepPath() {
            const path = scope.slice();
            if (selectedLeaf && scope.length === MAX_DEPTH - 1) {
                path.push(parseInt(selectedLeaf.split('.').pop(), 10));
            } else {
                path.push(0);
            }
            while (path.length < MAX_DEPTH) path.push(0);
            return path;
        }

        // When scope sits at the leaf level and no leaf is selected, pick
        // the first incomplete + reachable leaf. "Reachable" follows the
        // sequential-gating rule: a leaf is reachable iff its previous
        // sibling is done (the first sibling is always reachable). In
        // non-gated configurations this collapses to "first incomplete leaf"
        // because nothing is ever locked.
        function autoSelectIfAtLeafLevel() {
            if (selectedLeaf !== null) return;
            if (scope.length !== MAX_DEPTH - 1) return;
            const prefix = scope.join('.');
            let prevDone = true;
            for (let i = 1; i <= 3; i++) {
                const leafPath = prefix + '.' + i;
                const isDone = done.has(leafPath);
                if (!isDone && prevDone) {
                    selectedLeaf = leafPath;
                    return;
                }
                prevDone = isDone;
            }
        }

        const api = {
            get scope() { return scope.slice(); },
            get selectedLeaf() { return selectedLeaf; },
            done,
            getStepPath,
            selectAt(d, choice) {
                if (scope.length < MAX_DEPTH - 1) {
                    scope = [...scope, choice];
                    selectedLeaf = null;
                    autoSelectIfAtLeafLevel();
                } else {
                    const tabPath = scope.length === 0 ? String(choice) : (scope.join('.') + '.' + choice);
                    selectedLeaf = tabPath;
                }
                api.render();
            },
            navigateTo(newScope) {
                scope = newScope.slice();
                selectedLeaf = null;
                autoSelectIfAtLeafLevel();
                api.render();
            },
            toggleDone() {
                if (!selectedLeaf) return;
                if (done.has(selectedLeaf)) done.delete(selectedLeaf);
                else done.add(selectedLeaf);
                api.render();
            },
            render() { onRender(api); },
        };
        autoSelectIfAtLeafLevel();
        api.render();
        return api;
    }

    return { makeNavigator };
})();

// ----- Shared SVG ring helper. Inline stroke attributes (rather than

const expRing = (function () {
    const SVG_NS = 'http://www.w3.org/2000/svg';
    function makeRing(opts) {
        const { size, strokeWidth, completed, total, gradientId, includeDefs } = opts;
        const radius = (size - strokeWidth) / 2;
        const circumference = 2 * Math.PI * radius;
        const pct = total === 0 ? 0 : completed / total;

        const svg = document.createElementNS(SVG_NS, 'svg');
        svg.setAttribute('viewBox', '0 0 ' + size + ' ' + size);

        if (includeDefs) {
            const defs = document.createElementNS(SVG_NS, 'defs');
            const grad = document.createElementNS(SVG_NS, 'linearGradient');
            grad.setAttribute('id', gradientId);
            grad.setAttribute('x1', '0'); grad.setAttribute('y1', '0');
            grad.setAttribute('x2', '1'); grad.setAttribute('y2', '1');
            const s1 = document.createElementNS(SVG_NS, 'stop');
            s1.setAttribute('offset', '0%'); s1.setAttribute('stop-color', '#6366f1');
            const s2 = document.createElementNS(SVG_NS, 'stop');
            s2.setAttribute('offset', '100%'); s2.setAttribute('stop-color', '#a855f7');
            grad.appendChild(s1); grad.appendChild(s2);
            defs.appendChild(grad);
            svg.appendChild(defs);
        }
        const bg = document.createElementNS(SVG_NS, 'circle');
        bg.setAttribute('cx', size / 2); bg.setAttribute('cy', size / 2);
        bg.setAttribute('r', radius);
        bg.setAttribute('fill', 'rgba(255, 255, 255, 0.92)');
        bg.setAttribute('stroke', 'rgba(99, 102, 241, 0.16)');
        bg.setAttribute('stroke-width', strokeWidth);
        svg.appendChild(bg);
        if (pct > 0) {
            const fill = document.createElementNS(SVG_NS, 'circle');
            fill.setAttribute('cx', size / 2); fill.setAttribute('cy', size / 2);
            fill.setAttribute('r', radius);
            fill.setAttribute('fill', 'none');
            fill.setAttribute('stroke', 'url(#' + gradientId + ')');
            fill.setAttribute('stroke-width', strokeWidth);
            fill.setAttribute('stroke-linecap', 'round');
            fill.setAttribute('stroke-dasharray', (circumference * pct) + ' ' + circumference);
            svg.appendChild(fill);
        }
        return svg;
    }
    return { makeRing };
})();

(function () {

    function checkCurrentComplete(scope, done, progressFor) {
        // True iff every tab at the current scope is fully complete.
        const isLeafLevel = scope.length === MAX_DEPTH - 1;
        for (let i = 1; i <= 3; i++) {
            const tabPath = scope.length === 0 ? String(i) : (scope.join('.') + '.' + i);
            if (isLeafLevel) {
                if (!done.has(tabPath)) return false;
            } else {
                const tp = progressFor(tabPath);
                if (tp.completed < tp.total) return false;
            }
        }
        return true;
    }

    function findNextTarget(scope, progressFor) {
        // Walk up the path. At each ancestor depth, look for siblings of
        // scope[d] that come AFTER it and aren't fully complete.
        for (let d = scope.length - 1; d >= 0; d--) {
            const parentScope = scope.slice(0, d);
            const currentChoice = scope[d];
            for (let i = currentChoice + 1; i <= 3; i++) {
                const siblingPath = parentScope.length === 0 ? String(i) : (parentScope.join('.') + '.' + i);
                const sp = progressFor(siblingPath);
                if (sp.completed < sp.total) {
                    return { scope: [...parentScope, i], label: 'Tab ' + siblingPath };
                }
            }
        }
        return null;  // root reached with no incomplete siblings — workshop is done
    }

    function applyGating(stepEl, scope, done, progressFor) {
        // Walk the current step's tabs in order. Tab N+1 is locked iff
        // the previous sibling (Tab N) isn't fully complete.
        const isLeafLevel = scope.length === MAX_DEPTH - 1;
        const tabs = Array.from(stepEl.querySelectorAll('.exp431x-tab'));
        let prevComplete = true;
        let blockedDeps = [];
        function isComplete(tabPath) {
            if (isLeafLevel) return done.has(tabPath);
            const tp = progressFor(tabPath);
            return tp.completed === tp.total;
        }
        tabs.forEach((tabEl, idx) => {
            if (idx === 0) {
                prevComplete = isComplete(tabEl.dataset.path);
                return;
            }
            if (!prevComplete) {
                // Lock this tab. Strip existing click handlers by cloning;
                // class + title still work for hover explanation.
                const clone = tabEl.cloneNode(true);
                clone.classList.add('is-locked');
                clone.title = 'Locked — complete the previous selection first';
                tabEl.replaceWith(clone);
                blockedDeps.push((isLeafLevel ? 'Leaf ' : 'Tab ') + tabs[idx - 1].dataset.path);
                prevComplete = false;  // chain locks for all subsequent
            } else {
                prevComplete = isComplete(tabEl.dataset.path);
            }
        });
        return blockedDeps;
    }

    exp43121xCore.makeNavigator({
        onRender(nav) {
            root.innerHTML = '';
            const scope = nav.scope;
            const progressFor = progressForFn(nav.done);
            let defsEmitted = false;

                const parentPrefix = scope.slice(0, d).join('.');
                const choicePath = scope.slice(0, d + 1).join('.');

                // --- Ancestor row (ring node + read-only tabs + Change button)

                ancestor.className = 'expA-ancestor';
                const node = document.createElement('div');
                node.className = 'expA-ancestor-node';
                const ap = progressFor(choicePath);
                node.appendChild(expRing.makeRing({
                    size: 18, strokeWidth: 3, completed: ap.completed, total: ap.total,
                    gradientId: 'expA-grad', includeDefs: !defsEmitted,
                }));
                defsEmitted = true;
                ancestor.appendChild(node);

                const tabs = document.createElement('div');
                tabs.className = 'expA-ancestor-tabs';
                for (let i = 1; i <= 3; i++) {
                    const tabPath = parentPrefix ? parentPrefix + '.' + i : String(i);
                    const tab = document.createElement('span');
                    tab.className = 'expA-ancestor-tab';
                    if (scope[d] === i) tab.classList.add('is-active');
                    tab.textContent = labelPrefix + tabPath;
                    if (!isLeafLevel) {
                        const tp = progressFor(tabPath);
                        const pip = document.createElement('span');
                        pip.className = 'expA-tab-pip';
                        if (tp.completed === tp.total) pip.classList.add('is-complete');
                        pip.textContent = tp.completed + '/' + tp.total;
                        tab.appendChild(pip);
                    }
                    tabs.appendChild(tab);
                }
                ancestor.appendChild(tabs);

                const change = document.createElement('button');
                change.type = 'button';
                change.className = 'expA-ancestor-change';
                change.textContent = 'Change selection';
                change.title = 'Re-read the instruction and pick again';
                change.addEventListener('click', () => nav.navigateTo(scope.slice(0, d)));
                ancestor.appendChild(change);
                navWrap.appendChild(ancestor);

                // --- Non-navigation info note about the upcoming depth.
                if (d < INTERLEVEL_NOTES.length) {
                    const note = INTERLEVEL_NOTES[d];
                    const info = document.createElement('div');
                    info.className = 'expA-info';
                    const infoNode = document.createElement('div');
                    infoNode.className = 'expA-info-node';
                    infoNode.textContent = 'i';
                    info.appendChild(infoNode);
                    const card = document.createElement('div');
                    card.className = 'expA-info-card';
                    const meta = document.createElement('div');
                    meta.className = 'expA-info-card-meta';
                    meta.textContent = note.meta;
                    card.appendChild(meta);

            }

            // --- Current step with ring avatar
            const builtStep = buildStep({
                depth: scope.length,
                path: nav.getStepPath(),

                onSelectAt: nav.selectAt,
                stepClass: 'expA-step',
            });
            const stepAvatar = builtStep.querySelector('.exp431x-avatar');
            if (stepAvatar) {
                const ringWrap = document.createElement('div');
                ringWrap.className = 'expA-step-ring';
                const sp = progressFor(scope.join('.'));
                ringWrap.appendChild(expRing.makeRing({
                    size: 36, strokeWidth: 4, completed: sp.completed, total: sp.total,
                    gradientId: 'expA-grad', includeDefs: !defsEmitted,
                }));
                defsEmitted = true;
                stepAvatar.replaceWith(ringWrap);
            }

            // --- Apply gating + insert hint inside bubble body
            const blockedDeps = applyGating(builtStep, scope, nav.done, progressFor);
            if (blockedDeps.length > 0) {
                const hint = document.createElement('div');
                hint.className = 'expA-gate-hint';
                hint.innerHTML = '<strong>Note:</strong> ' +
                    'The remaining tab' + (blockedDeps.length > 1 ? 's are' : ' is') +

                const bubbleBody = builtStep.querySelector('.exp431x-bubble-body');

            navWrap.appendChild(builtStep);

            // --- Leaf content panel — body holds real Razem-style

                } else {
                    const cmp = document.createElement('div');
                    cmp.className = 'expA-complete';
                    const cNode = document.createElement('div');

            root.appendChild(navWrap);

})();

// ----- Experiment B — two consecutive, non-nested tab sets. The Razem
// shape this models is SequenceForm{TabForm, TabForm}: two parallel-
// branch containers chained by a sequence. Each step's tabs share a row
// (parallel within a step); the steps stack vertically (sequential
// across steps). Step 2 is fully locked until step 1's three tabs are
// all done. Within each step, sequential gating mirrors A: Tab N+1
// locks until Tab N is done. -----
(function () {
    const root = document.querySelector('.expB-root');
    if (!root) return;

    const STEPS = [
        {
            label: 'Step 1 of 2 · Pick a topic',
            instruction: 'Pick a tab to read its summary, then mark it done. Tabs unlock left-to-right — the next tab opens once the current one is complete.',
            tabs: ['Tab 1', 'Tab 2', 'Tab 3'],
        },
        {
            label: 'Step 2 of 2 · Pick a follow-up',
            instruction: 'Pick a tab to read its summary, then mark it done. Same gating as Step 1; this entire step was locked until Step 1’s tabs were all complete.',
            tabs: ['Tab 1', 'Tab 2', 'Tab 3'],
        },
    ];

    const done = new Set();        // keys: "1.1", "2.3", etc.
    let selectedTab = null;        // string key, or null

    function key(stepIdx, tabIdx) { return (stepIdx + 1) + '.' + (tabIdx + 1); }
    function parseKey(k) { const [s, t] = k.split('.').map(Number); return [s - 1, t - 1]; }

    function tabDone(stepIdx, tabIdx) { return done.has(key(stepIdx, tabIdx)); }
    function stepDone(stepIdx) {
        return STEPS[stepIdx].tabs.every((_, t) => tabDone(stepIdx, t));
    }
    function stepReachable(stepIdx) {
        for (let s = 0; s < stepIdx; s++) if (!stepDone(s)) return false;
        return true;
    }
    function tabLocked(stepIdx, tabIdx) {
        if (!stepReachable(stepIdx)) return true;
        for (let t = 0; t < tabIdx; t++) if (!tabDone(stepIdx, t)) return true;
        return false;
    }
    function activeStepIdx() {
        if (!selectedTab) return 0;
        return parseKey(selectedTab)[0];
    }

    function buildLeafBody(stepIdx, tabIdx) {
        // A pared-down version of A's leaf body: a TextForm for a
        // reflection plus a ChoiceForm with three radio options. Enough
        // to show that real Razem-component HTML lives inside each
        // tab's leaf, without overloading the visual.
        const k = key(stepIdx, tabIdx);
        const radioName = 'choice-B-' + k;
        return ''
            + '<div class="component" data-form="text" data-key="reflection-B-' + k + '">'
            +   '<h3>Reflection on ' + STEPS[stepIdx].tabs[tabIdx] + '</h3>'
            +   '<p>Write a 1–2 sentence reflection on what you just read.</p>'
            +   '<form onsubmit="event.preventDefault();">'
            +     '<input name="value" type="text" placeholder="Your reflection">'
            +     '<div style="margin-top: 4px;">'
            +       '<button type="submit">Set Reflection</button>'
            +     '</div>'
            +   '</form>'
            + '</div>'
            + '<div class="component" data-form="choice" data-key="check-B-' + k + '">'
            +   '<h3>Comprehension check</h3>'
            +   '<p>Pick the option that best matches what you read.</p>'
            +   '<div style="margin: 4px 0;">'
            +     '<label><input type="radio" name="' + radioName + '"> Option A — the literal interpretation</label>'
            +     '<label><input type="radio" name="' + radioName + '"> Option B — the systemic interpretation</label>'
            +     '<label><input type="radio" name="' + radioName + '"> Option C — neither / both / it depends</label>'
            +   '</div>'
            + '</div>';
    }

    function autoSelect() {
        // First reachable, incomplete tab in step order. Used on initial
        // render so the user lands on Tab 1.1 ready to read.
        if (selectedTab) return;
        for (let s = 0; s < STEPS.length; s++) {
            if (!stepReachable(s)) return;
            for (let t = 0; t < STEPS[s].tabs.length; t++) {
                if (tabLocked(s, t)) return;
                if (!tabDone(s, t)) { selectedTab = key(s, t); return; }
            }
        }
    }

    function buildStep(stepIdx) {
        const cfg = STEPS[stepIdx];
        const reachable = stepReachable(stepIdx);
        const allDoneInStep = stepDone(stepIdx);
        const stepDoneCount = cfg.tabs.filter((_, t) => tabDone(stepIdx, t)).length;
        const isFocus = activeStepIdx() === stepIdx && stepReachable(stepIdx);

        const stepEl = document.createElement('div');
        stepEl.className = 'exp431x-step expB-step';
        stepEl.dataset.step = stepIdx;

        const bubble = document.createElement('div');
        bubble.className = 'exp431x-bubble';
        const avatar = document.createElement('span');
        avatar.className = 'exp431x-avatar';
        if (allDoneInStep) {
            avatar.classList.add('expB-avatar-done');
            avatar.textContent = '✓';
        } else {
            avatar.textContent = '✨';
        }
        bubble.appendChild(avatar);

        const body = document.createElement('div');
        body.className = 'exp431x-bubble-body';
        const meta = document.createElement('div');
        meta.className = 'exp431x-bubble-meta';
        const metaLabel = document.createElement('span');
        metaLabel.textContent = cfg.label;
        meta.appendChild(metaLabel);
        const metaProg = document.createElement('span');
        metaProg.className = 'exp431x-bubble-progress';
        metaProg.textContent = stepDoneCount + ' of ' + cfg.tabs.length + ' done';
        meta.appendChild(metaProg);
        body.appendChild(meta);

        const p = document.createElement('p');
        p.className = 'exp431x-bubble-text';
        p.textContent = !reachable
            ? 'This step is locked until Step 1 is fully complete.'
            : cfg.instruction;
        body.appendChild(p);

        // Locked-tab hint inside the bubble (parallel to A's gate hint).
        if (reachable && !allDoneInStep) {
            const blockedAfter = cfg.tabs.findIndex((_, t) => !tabDone(stepIdx, t));
            const hasLockedTabs = blockedAfter >= 0 && blockedAfter < cfg.tabs.length - 1;
            if (hasLockedTabs && blockedAfter > 0) {
                const hint = document.createElement('div');
                hint.className = 'expB-gate-hint';
                hint.innerHTML = '<strong>Note:</strong> Subsequent tabs unlock once the current tab is marked done.';
                body.appendChild(hint);
            }
        }

        bubble.appendChild(body);
        stepEl.appendChild(bubble);

        const tabs = document.createElement('div');
        tabs.className = 'exp431x-tabs';
        cfg.tabs.forEach((label, t) => {
            const k = key(stepIdx, t);
            const tab = document.createElement('button');
            tab.type = 'button';
            tab.className = 'exp431x-tab';
            tab.dataset.path = k;

            const isLocked = tabLocked(stepIdx, t);
            const isDoneTab = tabDone(stepIdx, t);
            const isActive = selectedTab === k;
            if (isActive) tab.classList.add('is-active');
            if (isDoneTab) tab.classList.add('is-done');
            if (isLocked) tab.classList.add('is-locked');

            const check = document.createElement('span');
            check.className = 'exp431x-tab-check';
            check.textContent = '✓';
            tab.appendChild(check);

            const lbl = document.createElement('span');
            lbl.className = 'exp431x-tab-label';
            lbl.textContent = label;
            tab.appendChild(lbl);

            if (isLocked) {
                tab.title = 'Locked — complete the previous tab first';
            } else {
                tab.addEventListener('click', () => {
                    selectedTab = k;
                    render();
                });
            }
            tabs.appendChild(tab);
        });
        stepEl.appendChild(tabs);

        return { stepEl, isFocus };
    }

    function buildLeafPanel(stepIdx, tabIdx) {
        const k = key(stepIdx, tabIdx);
        const isDoneLeaf = tabDone(stepIdx, tabIdx);

        const panel = document.createElement('div');
        panel.className = 'exp431x-leaf-panel';

        const crumb = document.createElement('div');
        crumb.className = 'exp431x-leaf-crumb';
        crumb.textContent = 'Step ' + (stepIdx + 1) + ' · Now reading';
        panel.appendChild(crumb);

        const title = document.createElement('h2');
        title.className = 'exp431x-leaf-title';
        title.textContent = STEPS[stepIdx].tabs[tabIdx];
        panel.appendChild(title);

        const bodyEl = document.createElement('div');
        bodyEl.className = 'exp431x-leaf-body';
        bodyEl.innerHTML = buildLeafBody(stepIdx, tabIdx);
        panel.appendChild(bodyEl);

        const toggle = document.createElement('button');
        toggle.type = 'button';
        toggle.className = 'exp431x-toggle-btn' + (isDoneLeaf ? ' is-done' : '');
        toggle.textContent = isDoneLeaf ? '✓ Completed' : 'Mark as done';
        toggle.addEventListener('click', () => {
            if (done.has(k)) done.delete(k);
            else done.add(k);
            render();
        });
        panel.appendChild(toggle);

        return panel;
    }

    function findNextStep() {
        for (let s = 0; s < STEPS.length; s++) if (!stepDone(s)) return s;
        return -1;
    }

    function render() {
        autoSelect();
        root.innerHTML = '';

        const navWrap = document.createElement('div');
        navWrap.className = 'expB-nav';

        const focusStep = activeStepIdx();
        STEPS.forEach((_, stepIdx) => {
            const { stepEl, isFocus } = buildStep(stepIdx);
            navWrap.appendChild(stepEl);

            // Leaf panel for the active step's selected tab. Lives inline
            // inside the same flex column so it sits on the thread between
            // its step and the next.
            if (isFocus && selectedTab && parseKey(selectedTab)[0] === stepIdx) {
                const tabIdx = parseKey(selectedTab)[1];
                navWrap.appendChild(buildLeafPanel(stepIdx, tabIdx));
            }
        });

        // Proceed-to-next or workshop-complete on the thread. Mirrors A's
        // pattern but at the step level instead of the chapter level.
        const allStepsDone = STEPS.every((_, s) => stepDone(s));
        if (allStepsDone) {
            const cmp = document.createElement('div');
            cmp.className = 'expA-complete';
            const cNode = document.createElement('div');
            cNode.className = 'expA-complete-node';
            cNode.textContent = '✓';
            cmp.appendChild(cNode);
            const text = document.createElement('div');
            text.className = 'expA-complete-text';
            text.textContent = 'Workshop complete — both steps done.';
            cmp.appendChild(text);
            navWrap.appendChild(cmp);
        } else if (stepDone(focusStep)) {
            const next = findNextStep();
            if (next > focusStep) {
                const proceed = document.createElement('div');
                proceed.className = 'expA-proceed';
                const pNode = document.createElement('div');
                pNode.className = 'expA-proceed-node';
                pNode.textContent = '→';
                proceed.appendChild(pNode);
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'expA-proceed-btn';
                btn.textContent = 'Proceed to Step ' + (next + 1) + ' →';
                btn.addEventListener('click', () => {
                    selectedTab = key(next, 0);
                    render();
                });
                proceed.appendChild(btn);
                navWrap.appendChild(proceed);
            }
        }

        root.appendChild(navWrap);
    }

    render();
})();

// ----- Experiment C — same two-step structural shape as B, but the
// active leaf renders as flat content. No leaf panel, no inner body,
// no per-component sub-cards. Same chat bubble + tab strip + sequential
// gating; only the leaf rendering differs. -----
(function () {
    const root = document.querySelector('.expC-root');
    if (!root) return;

    const STEPS = [
        {
            label: 'Step 1 of 2 · Pick a topic',
            instruction: 'Pick a tab to read its summary, then mark it done. Tabs unlock left-to-right.',
            tabs: ['Tab 1', 'Tab 2', 'Tab 3'],
        },
        {
            label: 'Step 2 of 2 · Pick a follow-up',
            instruction: 'Same gating as Step 1; this entire step was locked until Step 1’s tabs were all complete.',
            tabs: ['Tab 1', 'Tab 2', 'Tab 3'],
        },
    ];

    const done = new Set();
    let selectedTab = null;

    function key(stepIdx, tabIdx) { return (stepIdx + 1) + '.' + (tabIdx + 1); }
    function parseKey(k) { const [s, t] = k.split('.').map(Number); return [s - 1, t - 1]; }
    function tabDone(stepIdx, tabIdx) { return done.has(key(stepIdx, tabIdx)); }
    function stepDone(stepIdx) {
        return STEPS[stepIdx].tabs.every((_, t) => tabDone(stepIdx, t));
    }
    function stepReachable(stepIdx) {
        for (let s = 0; s < stepIdx; s++) if (!stepDone(s)) return false;
        return true;
    }
    function tabLocked(stepIdx, tabIdx) {
        if (!stepReachable(stepIdx)) return true;
        for (let t = 0; t < tabIdx; t++) if (!tabDone(stepIdx, t)) return true;
        return false;
    }
    function activeStepIdx() {
        if (!selectedTab) return 0;
        return parseKey(selectedTab)[0];
    }

    function buildComponents(stepIdx, tabIdx) {
        // Returns one entry per component in the active tab. Each entry
        // is { glyph, html } and becomes its own chat-bubble row on the
        // main thread (see buildCompRow). The glyph is the per-type
        // marker shown in the row's avatar.
        const k = key(stepIdx, tabIdx);
        const radioName = 'choice-C-' + k;
        return [
            {
                glyph: 'T',
                html: ''
                    + '<div class="component" data-form="text" data-key="reflection-C-' + k + '">'
                    +   '<h3>Reflection on ' + STEPS[stepIdx].tabs[tabIdx] + '</h3>'
                    +   '<p>Write a 1–2 sentence reflection on what you just read.</p>'
                    +   '<form onsubmit="event.preventDefault();">'
                    +     '<input name="value" type="text" placeholder="Your reflection">'
                    +     '<div style="margin-top: 4px;">'
                    +       '<button type="submit">Set Reflection</button>'
                    +     '</div>'
                    +   '</form>'
                    + '</div>',
            },
            {
                glyph: '?',
                html: ''
                    + '<div class="component" data-form="choice" data-key="check-C-' + k + '">'
                    +   '<h3>Comprehension check</h3>'
                    +   '<p>Pick the option that best matches what you read.</p>'
                    +   '<div style="margin: 4px 0;">'
                    +     '<label><input type="radio" name="' + radioName + '"> Option A — the literal interpretation</label>'
                    +     '<label><input type="radio" name="' + radioName + '"> Option B — the systemic interpretation</label>'
                    +     '<label><input type="radio" name="' + radioName + '"> Option C — neither / both / it depends</label>'
                    +   '</div>'
                    + '</div>',
            },
        ];
    }

    function autoSelect() {
        if (selectedTab) return;
        for (let s = 0; s < STEPS.length; s++) {
            if (!stepReachable(s)) return;
            for (let t = 0; t < STEPS[s].tabs.length; t++) {
                if (tabLocked(s, t)) return;
                if (!tabDone(s, t)) { selectedTab = key(s, t); return; }
            }
        }
    }

    function buildStep(stepIdx) {
        const cfg = STEPS[stepIdx];
        const reachable = stepReachable(stepIdx);
        const allDoneInStep = stepDone(stepIdx);
        const stepDoneCount = cfg.tabs.filter((_, t) => tabDone(stepIdx, t)).length;
        const isFocus = activeStepIdx() === stepIdx && stepReachable(stepIdx);

        const stepEl = document.createElement('div');
        stepEl.className = 'exp431x-step expC-step';
        stepEl.dataset.step = stepIdx;

        const bubble = document.createElement('div');
        bubble.className = 'exp431x-bubble';
        const avatar = document.createElement('span');
        avatar.className = 'exp431x-avatar';
        if (allDoneInStep) {
            avatar.classList.add('expC-avatar-done');
            avatar.textContent = '✓';
        } else {
            avatar.textContent = '✨';
        }
        bubble.appendChild(avatar);

        const body = document.createElement('div');
        body.className = 'exp431x-bubble-body';
        const meta = document.createElement('div');
        meta.className = 'exp431x-bubble-meta';
        const metaLabel = document.createElement('span');
        metaLabel.textContent = cfg.label;
        meta.appendChild(metaLabel);
        const metaProg = document.createElement('span');
        metaProg.className = 'exp431x-bubble-progress';
        metaProg.textContent = stepDoneCount + ' of ' + cfg.tabs.length + ' done';
        meta.appendChild(metaProg);
        body.appendChild(meta);

        const p = document.createElement('p');
        p.className = 'exp431x-bubble-text';
        p.textContent = !reachable
            ? 'This step is locked until Step 1 is fully complete.'
            : cfg.instruction;
        body.appendChild(p);

        if (reachable && !allDoneInStep) {
            const blockedAfter = cfg.tabs.findIndex((_, t) => !tabDone(stepIdx, t));
            const hasLockedTabs = blockedAfter >= 0 && blockedAfter < cfg.tabs.length - 1;
            if (hasLockedTabs && blockedAfter > 0) {
                const hint = document.createElement('div');
                hint.className = 'expC-gate-hint';
                hint.innerHTML = '<strong>Note:</strong> Subsequent tabs unlock once the current tab is marked done.';
                body.appendChild(hint);
            }
        }

        bubble.appendChild(body);
        stepEl.appendChild(bubble);

        const tabs = document.createElement('div');
        tabs.className = 'exp431x-tabs';
        cfg.tabs.forEach((label, t) => {
            const k = key(stepIdx, t);
            const tab = document.createElement('button');
            tab.type = 'button';
            tab.className = 'exp431x-tab';
            tab.dataset.path = k;

            const isLocked = tabLocked(stepIdx, t);
            const isDoneTab = tabDone(stepIdx, t);
            const isActive = selectedTab === k;
            if (isActive) tab.classList.add('is-active');
            if (isDoneTab) tab.classList.add('is-done');
            if (isLocked) tab.classList.add('is-locked');

            const check = document.createElement('span');
            check.className = 'exp431x-tab-check';
            check.textContent = '✓';
            tab.appendChild(check);

            const lbl = document.createElement('span');
            lbl.className = 'exp431x-tab-label';
            lbl.textContent = label;
            tab.appendChild(lbl);

            if (isLocked) {
                tab.title = 'Locked — complete the previous tab first';
            } else {
                tab.addEventListener('click', () => {
                    selectedTab = k;
                    render();
                });
            }
            tabs.appendChild(tab);
        });
        stepEl.appendChild(tabs);

        return { stepEl, isFocus };
    }

    function buildCompRow(comp) {
        const row = document.createElement('div');
        row.className = 'expC-comp-row';

        const avatar = document.createElement('span');
        avatar.className = 'expC-comp-avatar';
        avatar.textContent = comp.glyph;
        row.appendChild(avatar);

        const body = document.createElement('div');
        body.className = 'expC-comp-body';
        body.innerHTML = comp.html;
        row.appendChild(body);

        return row;
    }

    function buildToggleRow(stepIdx, tabIdx) {
        // The mark-as-done toggle is itself a node on the thread —
        // an empty dashed circle when undone, a green check when done.
        const k = key(stepIdx, tabIdx);
        const isDoneLeaf = tabDone(stepIdx, tabIdx);

        const row = document.createElement('div');
        row.className = 'expC-comp-row';

        const avatar = document.createElement('span');
        avatar.className = 'expC-comp-avatar expC-toggle-avatar' + (isDoneLeaf ? ' is-done' : '');
        avatar.textContent = isDoneLeaf ? '✓' : '○';
        row.appendChild(avatar);

        const body = document.createElement('div');
        body.className = 'expC-comp-body';

        const toggle = document.createElement('button');
        toggle.type = 'button';
        toggle.className = 'expC-toggle-btn' + (isDoneLeaf ? ' is-done' : '');
        toggle.textContent = isDoneLeaf ? '✓ Completed' : 'Mark as done';
        toggle.addEventListener('click', () => {
            if (done.has(k)) done.delete(k);
            else done.add(k);
            render();
        });
        body.appendChild(toggle);

        row.appendChild(body);
        return row;
    }

    function buildLeafFlat(stepIdx, tabIdx) {
        // Each component (and the mark-as-done toggle) is its own node on
        // the same vertical thread that runs through the step bubbles —
        // no indentation, no leaf-panel container. The .expC-leaf-group
        // is just a tighter-spacing wrapper for the rows belonging to
        // the same active tab.
        const group = document.createElement('div');
        group.className = 'expC-leaf-group';

        buildComponents(stepIdx, tabIdx).forEach(c => {
            group.appendChild(buildCompRow(c));
        });
        group.appendChild(buildToggleRow(stepIdx, tabIdx));

        return group;
    }

    function findNextStep() {
        for (let s = 0; s < STEPS.length; s++) if (!stepDone(s)) return s;
        return -1;
    }

    function alignActiveTabsToThread() {
        // Each step's tab strip shifts horizontally so the active tab's
        // center lines up with the vertical thread at x=14 of .expC-step.
        // The thread visually enters the active tab from above and exits
        // out the bottom, continuing the flow into the (flat) leaf below.
        // Steps without an active tab (typically not-yet-reached steps)
        // stay at their natural padding-aligned position.
        //
        // Note: offsetLeft/offsetWidth return 0 for elements inside a
        // display:none ancestor (the C panel starts `hidden`), which
        // would yield a bogus translateX(14). Skip in that case; the
        // panelshown listener below re-runs alignment once the panel
        // actually becomes visible.
        const strips = root.querySelectorAll('.expC-step .exp431x-tabs');
        strips.forEach(strip => {
            const active = strip.querySelector('.exp431x-tab.is-active');
            if (!active) {
                strip.style.transform = '';
                return;
            }
            if (active.offsetWidth === 0) return;
            const center = active.offsetLeft + active.offsetWidth / 2;
            strip.style.transform = 'translateX(' + (14 - center) + 'px)';
        });
    }

    function render() {
        autoSelect();
        root.innerHTML = '';

        const navWrap = document.createElement('div');
        navWrap.className = 'expC-nav';

        const focusStep = activeStepIdx();
        STEPS.forEach((_, stepIdx) => {
            const { stepEl, isFocus } = buildStep(stepIdx);
            navWrap.appendChild(stepEl);

            if (isFocus && selectedTab && parseKey(selectedTab)[0] === stepIdx) {
                const tabIdx = parseKey(selectedTab)[1];
                navWrap.appendChild(buildLeafFlat(stepIdx, tabIdx));
            }
        });

        // Reuse A's .expA-proceed / .expA-complete styling for the
        // "Proceed to Step 2" / "Workshop complete" thread elements.
        const allStepsDone = STEPS.every((_, s) => stepDone(s));
        if (allStepsDone) {
            const cmp = document.createElement('div');
            cmp.className = 'expA-complete';
            const cNode = document.createElement('div');
            cNode.className = 'expA-complete-node';
            cNode.textContent = '✓';
            cmp.appendChild(cNode);
            const text = document.createElement('div');
            text.className = 'expA-complete-text';
            text.textContent = 'Workshop complete — both steps done.';
            cmp.appendChild(text);
            navWrap.appendChild(cmp);
        } else if (stepDone(focusStep)) {
            const next = findNextStep();
            if (next > focusStep) {
                const proceed = document.createElement('div');
                proceed.className = 'expA-proceed';
                const pNode = document.createElement('div');
                pNode.className = 'expA-proceed-node';
                pNode.textContent = '→';
                proceed.appendChild(pNode);
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'expA-proceed-btn';
                btn.textContent = 'Proceed to Step ' + (next + 1) + ' →';
                btn.addEventListener('click', () => {
                    selectedTab = key(next, 0);
                    render();
                });
                proceed.appendChild(btn);
                navWrap.appendChild(proceed);
            }
        }

        root.appendChild(navWrap);

        // After DOM is in place, align each step's active tab onto the
        // thread. Reading offsetLeft here forces layout, so the
        // measurement is correct (when the panel is visible).
        alignActiveTabsToThread();
    }

    // Re-align when the C panel first becomes visible. The initial
    // render runs while the panel is still `hidden`, so its measurements
    // are 0 and alignActiveTabsToThread skips. The experiment switcher
    // dispatches `panelshown` synchronously after un-hiding the panel,
    // so this listener applies the transform before the browser paints
    // — no flash of the unaligned position.
    const panel = document.querySelector('.nest-ws__canvas[data-panel="exp-c"]');
    if (panel) {
        panel.addEventListener('panelshown', alignActiveTabsToThread);
    }

    render();
})();

// ----- Experiment D — same structural shape as C (two consecutive
// non-nested tab sets, components as nodes on the main thread), but
// populated with a real-world Change Control workflow:
//
//   Phase 1 of 2 · Pre-approval review
//     Tab: Technical review   (TU sign-off on design/feasibility)
//     Tab: Business review    (BU sign-off on user/product impact)
//     Tab: Quality assurance  (QA sign-off on procedural compliance)
//
//   Phase 2 of 2 · Post-execution verification
//     Tab: Technical verification  (TU verifies implementation matches plan)
//     Tab: Business verification   (BU verifies UX outcome)
//     Tab: QA closure              (QA confirms evidence and closes the CR)
//
// Each tab carries the reviewer's review form: comments + a binary
// decision (recommend / request changes for Phase 1; confirm / reject
// for Phase 2). The mark-as-done toggle becomes "Submit review" /
// "Submit verification" — semantically the act of finalizing that
// reviewer's input. Phase 2 is gated until all three Phase-1 reviewers
// have submitted, which models the real CR rule that execution can't
// merge until pre-approval is fully signed off.
//
// Visual styling reuses C's classes (.expC-step, .expC-comp-row, etc.)
// since the spatial language is the same — only the content differs.
(function () {
    const root = document.querySelector('.expD-root');
    if (!root) return;

    const STEPS = [
        {
            label: 'Phase 1 of 2 · Pre-approval review',
            instruction: 'Each reviewer signs off on the proposed change before execution begins. Reviewers unlock left-to-right; all three sign-offs are required before the CR can be pre-approved and execution can start.',
            tabs: ['Technical review', 'Business review', 'Quality assurance'],
        },
        {
            label: 'Phase 2 of 2 · Post-execution verification',
            instruction: 'After execution, the same reviewers verify that the change was implemented as approved and that evidence is in order. This phase was locked until Phase 1 was fully signed off.',
            tabs: ['Technical verification', 'Business verification', 'QA closure'],
        },
    ];

    const done = new Set();
    let selectedTab = null;

    function key(stepIdx, tabIdx) { return (stepIdx + 1) + '.' + (tabIdx + 1); }
    function parseKey(k) { const [s, t] = k.split('.').map(Number); return [s - 1, t - 1]; }

    // QA review (Phase 1, Tab 3) is a nested 2-step sequence; the tab
    // counts complete only when both sub-steps are submitted. Their
    // done keys are "1.3.1" and "1.3.2" — the regular tab keys are
    // never directly added for QA, so the override below routes the
    // tab-completion check through the sub-step keys instead.
    function isQATab(stepIdx, tabIdx) { return stepIdx === 0 && tabIdx === 2; }
    function tabDone(stepIdx, tabIdx) {
        if (isQATab(stepIdx, tabIdx)) {
            const tk = key(stepIdx, tabIdx);
            return done.has(tk + '.1') && done.has(tk + '.2');
        }
        return done.has(key(stepIdx, tabIdx));
    }
    function stepDone(stepIdx) {
        return STEPS[stepIdx].tabs.every((_, t) => tabDone(stepIdx, t));
    }
    function stepReachable(stepIdx) {
        for (let s = 0; s < stepIdx; s++) if (!stepDone(s)) return false;
        return true;
    }
    function tabLocked(stepIdx, tabIdx) {
        if (!stepReachable(stepIdx)) return true;
        for (let t = 0; t < tabIdx; t++) if (!tabDone(stepIdx, t)) return true;
        return false;
    }
    function activeStepIdx() {
        if (!selectedTab) return 0;
        return parseKey(selectedTab)[0];
    }

    function buildComponents(stepIdx, tabIdx) {

        const k = key(stepIdx, tabIdx);

        const decisionHelp  = isPost

        const optYes = isPost
            ? 'Confirm closure — change implemented correctly'
            : 'Recommend approval';

            ? 'Reject closure — discrepancies or gaps found'
            : 'Request changes — revisions needed before approval';

        return [
            {
                glyph: '✎',
                html: ''
                    + '<div class="component" data-form="text" data-key="comments-D-' + k + '">'

                    +   '<p>' + commentsHelp + '</p>'

                    +     '<div style="margin-top: 4px;">'

                    +     '</div>'
                    +   '</form>'

                    +   '<h3>Decision</h3>'

                    +   '<div style="margin: 4px 0;">'

                    +     '<label><input type="radio" name="' + radioName + '"> ' + optNo + '</label>'
                    +   '</div>'

    function autoSelect() {

            for (let t = 0; t < STEPS[s].tabs.length; t++) {

            }

    function buildStep(stepIdx) {
        const cfg = STEPS[stepIdx];

            avatar.textContent = '✓';
        } else {
            avatar.textContent = '✨';
        }
        bubble.appendChild(avatar);

        const body = document.createElement('div');
        body.className = 'exp431x-bubble-body';
        const meta = document.createElement('div');
        meta.className = 'exp431x-bubble-meta';
        const metaLabel = document.createElement('span');
        metaLabel.textContent = cfg.label;
        meta.appendChild(metaLabel);
        const metaProg = document.createElement('span');
        metaProg.className = 'exp431x-bubble-progress';

                    selectedTab = k;

    function buildCompRow(comp) {
