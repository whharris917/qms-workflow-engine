    }

    function buildQASubFlow(stepIdx, tabIdx) {
        // QA's review is a 2-step Sequence that lives inside the QA tab.
        // The two sub-steps are gated: Step 2 unlocks once Step 1 is
        // submitted. Each sub-step gets its own components (comments +
        // decision) and its own submit toggle. Both bubbles render even
        // when locked, so the user can see the upcoming structure;
        // components and the submit toggle for a locked sub-step are
        // suppressed until the previous one is submitted.
        const QA_SUB_STEPS = [
            {
                metaLabel: 'QA · Step 1 of 2 · Procedural compliance',
                instruction: 'Verify the CR follows SOP-002, has a complete execution-item table, and includes the required scope and justification sections.',
                commentsTitle: 'Procedural compliance notes',
                commentsHelp: 'Note any procedural gaps, missing sections, or SOP deviations.',
                decisionHelp: 'Does this CR meet procedural compliance requirements?',
                optYes: 'Pass — procedural requirements met',
                optNo:  'Flag — procedural concerns to address',
                submitVerb:   'Submit procedural compliance check',
                submittedTxt: '✓ Procedural compliance submitted',
            },
            {
                metaLabel: 'QA · Step 2 of 2 · Risk and impact',
                instruction: 'Verify the risk assessment is appropriate for the change scope, and that potentially affected systems and stakeholders are identified.',
                commentsTitle: 'Risk and impact notes',
                commentsHelp: 'Note any unaddressed risks, impact gaps, or stakeholder omissions.',
                decisionHelp: 'Is the risk and impact analysis adequate?',
                optYes: 'Pass — risk and impact properly documented',
                optNo:  'Flag — risk or impact concerns to address',
                submitVerb:   'Submit risk and impact assessment',
                submittedTxt: '✓ Risk and impact submitted',
            },
        ];

        const tabKey = key(stepIdx, tabIdx);
        const group = document.createElement('div');
        group.className = 'expC-leaf-group';

        let prevSubDone = true;
        QA_SUB_STEPS.forEach((sub, i) => {
            const subKey = tabKey + '.' + (i + 1);
            const isSubDone = done.has(subKey);
            const isSubReachable = prevSubDone;

            // Sub-step bubble: small avatar + meta label + instruction,
            // styled in the same chat-bubble vocabulary as everything
            // else on the thread.
            const subRow = document.createElement('div');
            subRow.className = 'expC-comp-row';
            const subAvatar = document.createElement('span');
            subAvatar.className = 'expC-comp-avatar';
            if (isSubDone) {
                subAvatar.classList.add('expD-sub-done');
                subAvatar.textContent = '✓';
            } else if (!isSubReachable) {
                subAvatar.classList.add('expD-sub-locked');
                subAvatar.textContent = String(i + 1);
            } else {
                subAvatar.textContent = String(i + 1);
            }
            subRow.appendChild(subAvatar);
            const subBody = document.createElement('div');
            subBody.className = 'expC-comp-body';
            const meta = document.createElement('div');
            meta.className = 'exp431x-bubble-meta';
            const metaSpan = document.createElement('span');
            metaSpan.textContent = sub.metaLabel;
            meta.appendChild(metaSpan);
            subBody.appendChild(meta);
            const text = document.createElement('p');
            text.className = 'exp431x-bubble-text';
            text.textContent = !isSubReachable
                ? 'This sub-step unlocks once the previous QA sub-step is submitted.'
                : sub.instruction;
            subBody.appendChild(text);
            subRow.appendChild(subBody);
            group.appendChild(subRow);

            // Components and submit toggle — only when this sub-step is
            // reachable. Locked sub-steps render only the bubble above.
            if (isSubReachable) {
                const radioName = 'decision-D-' + subKey;
                [
                    {
                        glyph: '✎',
                        html: ''
                            + '<div class="component" data-form="text" data-key="comments-' + subKey + '">'
                            +   '<h3>' + sub.commentsTitle + '</h3>'
                            +   '<p>' + sub.commentsHelp + '</p>'
                            +   '<form onsubmit="event.preventDefault();">'
                            +     '<input name="value" type="text" placeholder="Your notes">'
                            +     '<div style="margin-top: 4px;">'
                            +       '<button type="submit">Save draft</button>'
                            +     '</div>'
                            +   '</form>'
                            + '</div>',
                    },
                    {
                        glyph: '⚖',
                        html: ''
                            + '<div class="component" data-form="choice" data-key="decision-' + subKey + '">'
                            +   '<h3>Decision</h3>'
                            +   '<p>' + sub.decisionHelp + '</p>'
                            +   '<div style="margin: 4px 0;">'
                            +     '<label><input type="radio" name="' + radioName + '"> ' + sub.optYes + '</label>'
                            +     '<label><input type="radio" name="' + radioName + '"> ' + sub.optNo + '</label>'
                            +   '</div>'
                            + '</div>',
                    },
                ].forEach(c => group.appendChild(buildCompRow(c)));

                // Sub-step submit toggle — adds/removes the sub-key
                // from the global done set; tabDone(QA) checks both keys.
                const tRow = document.createElement('div');
                tRow.className = 'expC-comp-row';
                const tAvatar = document.createElement('span');
                tAvatar.className = 'expC-comp-avatar expC-toggle-avatar' + (isSubDone ? ' is-done' : '');
                tAvatar.textContent = isSubDone ? '✓' : '○';
                tRow.appendChild(tAvatar);
                const tBody = document.createElement('div');
                tBody.className = 'expC-comp-body';
                const tBtn = document.createElement('button');
                tBtn.type = 'button';
                tBtn.className = 'expC-toggle-btn' + (isSubDone ? ' is-done' : '');
                tBtn.textContent = isSubDone ? sub.submittedTxt : sub.submitVerb;
                tBtn.addEventListener('click', () => {
                    if (done.has(subKey)) done.delete(subKey);
                    else done.add(subKey);
                    render();
                });
                tBody.appendChild(tBtn);
                tRow.appendChild(tBody);
                group.appendChild(tRow);
            }

            prevSubDone = isSubDone;
        });

        return group;
    }

    function findNextStep() {
        for (let s = 0; s < STEPS.length; s++) if (!stepDone(s)) return s;
        return -1;
    }

    function alignActiveTabsToThread() {
        const strips = root.querySelectorAll('.expC-step .exp431x-tabs');
        strips.forEach(strip => {
            const active = strip.querySelector('.exp431x-tab.is-active');
            if (!active) {
                strip.style.transform = '';
                return;
            }
            if (active.offsetWidth === 0) return;
            const center = active.offsetLeft + active.offsetWidth / 2;
            strip.style.transform = 'translateX(' + (14 - center) + 'px)';
        });
    }

    function render() {
        autoSelect();
        root.innerHTML = '';

        const navWrap = document.createElement('div');
        navWrap.className = 'expC-nav';

        const focusStep = activeStepIdx();
        STEPS.forEach((_, stepIdx) => {
            const { stepEl, isFocus } = buildStep(stepIdx);
            navWrap.appendChild(stepEl);

            if (isFocus && selectedTab && parseKey(selectedTab)[0] === stepIdx) {
                const tabIdx = parseKey(selectedTab)[1];
                navWrap.appendChild(buildLeafFlat(stepIdx, tabIdx));
            }
        });

        const allStepsDone = STEPS.every((_, s) => stepDone(s));
        if (allStepsDone) {
            const cmp = document.createElement('div');
            cmp.className = 'expA-complete';
            const cNode = document.createElement('div');
            cNode.className = 'expA-complete-node';
            cNode.textContent = '✓';
            cmp.appendChild(cNode);
            const text = document.createElement('div');
            text.className = 'expA-complete-text';
            text.textContent = 'CR closed — pre-approval and post-execution verification complete.';
            cmp.appendChild(text);
            navWrap.appendChild(cmp);
        } else if (stepDone(focusStep)) {
            const next = findNextStep();
            if (next > focusStep) {
                const proceed = document.createElement('div');
                proceed.className = 'expA-proceed';
                const pNode = document.createElement('div');
                pNode.className = 'expA-proceed-node';
                pNode.textContent = '→';
                proceed.appendChild(pNode);
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'expA-proceed-btn';
                btn.textContent = 'Proceed to ' + STEPS[next].label.split(' · ')[1] + ' →';
                btn.addEventListener('click', () => {
                    selectedTab = key(next, 0);
                    render();
                });
                proceed.appendChild(btn);
                navWrap.appendChild(proceed);
            }
        }

        root.appendChild(navWrap);
        alignActiveTabsToThread();
    }

    const panel = document.querySelector('.nest-ws__canvas[data-panel="exp-d"]');
    if (panel) {
        panel.addEventListener('panelshown', alignActiveTabsToThread);
    }

    render();
})();
</script>
{% endblock %}
