<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}QMS Workflow Engine{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    {% block head_extra %}{% endblock %}
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f5f5f5;
            color: #333;
            display: flex;
            min-height: 100vh;
        }

        /* Sidebar */
        .sidebar {
            width: 220px;
            background: #1a1a2e;
            color: #ccc;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }
        .sidebar-header {
            padding: 1.25rem 1rem;
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            color: #7f8fa6;
            border-bottom: 1px solid #2a2a4a;
        }
        .sidebar nav {
            display: flex;
            flex-direction: column;
            padding: 0.5rem 0;
        }
        .sidebar a {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.7rem 1rem;
            color: #ccc;
            text-decoration: none;
            font-size: 0.95rem;
            transition: background 0.15s, color 0.15s;
        }
        .sidebar a:hover {
            background: #2a2a4a;
            color: #fff;
        }
        .sidebar a.active {
            background: #2a2a4a;
            color: #fff;
            border-left: 3px solid #4a9eff;
            padding-left: calc(1rem - 3px);
        }
        .sidebar .nav-icon {
            width: 18px;
            text-align: center;
            font-size: 1rem;
        }

        /* Main content */
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: auto;
        }
        .content {
            flex: 1;
            padding: 2rem;
        }
        .content h1 {
            font-size: 1.75rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }
        .content p {
            color: #666;
            font-size: 1rem;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <aside class="sidebar">
        <div class="sidebar-header">QMS Engine</div>
        <nav>
            <a href="/" class="{% if active_page == 'home' %}active{% endif %}">
                <span class="nav-icon">&#8962;</span> Home
            </a>
            <a href="/portal" class="{% if active_page == 'portal' %}active{% endif %}">
                <span class="nav-icon">&#9656;</span> Agent Portal
            </a>
            <a href="/qms" class="{% if active_page == 'qms' %}active{% endif %}">
                <span class="nav-icon">&#9776;</span> QMS
            </a>
            <a href="/workspace" class="{% if active_page == 'workspace' %}active{% endif %}">
                <span class="nav-icon">&#9881;</span> Workspace
            </a>
            <a href="/inbox" class="{% if active_page == 'inbox' %}active{% endif %}">
                <span class="nav-icon">&#9993;</span> Inbox
            </a>
            <a href="/manual" class="{% if active_page == 'manual' %}active{% endif %}">
                <span class="nav-icon">&#9733;</span> Quality Manual
            </a>
            <a href="/readme" class="{% if active_page == 'readme' %}active{% endif %}">
                <span class="nav-icon">&#9432;</span> README
            </a>
            <a href="/components" class="{% if active_page == 'components' %}active{% endif %}">
                <span class="nav-icon">&#9641;</span> Components
            </a>
            <a href="/deepdive" class="{% if active_page == 'deepdive' %}active{% endif %}">
                <span class="nav-icon">&#9874;</span> Deep Dive
            </a>
            <a href="/framing" class="{% if active_page == 'framing' %}active{% endif %}">
                <span class="nav-icon">&#9737;</span> Framing
            </a>
            <a href="/learn" class="{% if active_page == 'learn' %}active{% endif %}">
                <span class="nav-icon">&#9997;</span> Learning Portal
            </a>
            <a href="/wiki" class="{% if active_page == 'wiki' %}active{% endif %}">
                <span class="nav-icon">&#9923;</span> Wiki
            </a>
            <a href="/workshop" class="{% if active_page == 'workshop' %}active{% endif %}">
                <span class="nav-icon">&#9998;</span> Workshop
            </a>
        </nav>
    </aside>
    <div class="main">
        <div class="content">
            {% block content %}{% endblock %}
        </div>
    </div>
    {% block scripts %}{% endblock %}
</body>
</html>
