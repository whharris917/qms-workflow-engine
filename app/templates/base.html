<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}QMS Workflow Engine{% endblock %}</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f5f5f5;
            color: #333;
            display: flex;
            min-height: 100vh;
        }

        /* Sidebar */
        .sidebar {
            width: 220px;
            background: #1a1a2e;
            color: #ccc;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }
        .sidebar-header {
            padding: 1.25rem 1rem;
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            color: #7f8fa6;
            border-bottom: 1px solid #2a2a4a;
        }
        .sidebar nav {
            display: flex;
            flex-direction: column;
            padding: 0.5rem 0;
        }
        .sidebar a {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.7rem 1rem;
            color: #ccc;
            text-decoration: none;
            font-size: 0.95rem;
            transition: background 0.15s, color 0.15s;
        }
        .sidebar a:hover {
            background: #2a2a4a;
            color: #fff;
        }
        .sidebar a.active {
            background: #2a2a4a;
            color: #fff;
            border-left: 3px solid #4a9eff;
            padding-left: calc(1rem - 3px);
        }
        .sidebar .nav-icon {
            width: 18px;
            text-align: center;
            font-size: 1rem;
        }

        /* Main content */
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        .content {
            flex: 1;
            padding: 2rem;
        }
        .content h1 {
            font-size: 1.75rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }
        .content p {
            color: #666;
            font-size: 1rem;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <aside class="sidebar">
        <div class="sidebar-header">WFE</div>
        <nav>
            <a href="{{ url_for('index') }}" class="{% if active_page == 'home' %}active{% endif %}">
                <span class="nav-icon">&#8962;</span> Home
            </a>
            <a href="{{ url_for('qms') }}" class="{% if active_page == 'qms' %}active{% endif %}">
                <span class="nav-icon">&#9776;</span> QMS
            </a>
            <a href="{{ url_for('workspace') }}" class="{% if active_page == 'workspace' %}active{% endif %}">
                <span class="nav-icon">&#9881;</span> Workspace
            </a>
            <a href="{{ url_for('inbox') }}" class="{% if active_page == 'inbox' %}active{% endif %}">
                <span class="nav-icon">&#9993;</span> Inbox
            </a>
            <a href="{{ url_for('template_list') }}" class="{% if active_page == 'templates' %}active{% endif %}">
                <span class="nav-icon">&#9634;</span> Templates
            </a>
            <a href="{{ url_for('sandbox') }}" class="{% if active_page == 'sandbox' %}active{% endif %}">
                <span class="nav-icon">&#9654;</span> Workflow Sandbox
            </a>
            <a href="{{ url_for('manual_index') }}" class="{% if active_page == 'manual' %}active{% endif %}">
                <span class="nav-icon">&#9733;</span> Quality Manual
            </a>
            <a href="{{ url_for('agent_portal') }}" class="{% if active_page == 'agent' %}active{% endif %}">
                <span class="nav-icon">&#9656;</span> Agent Portal
            </a>
            <a href="{{ url_for('workshop') }}" class="{% if active_page == 'workshop' %}active{% endif %}">
                <span class="nav-icon">&#9998;</span> Workshop
            </a>
        </nav>
    </aside>
    <div class="main">
        <div class="content" id="human-view">
            {% block content %}{% endblock %}
        </div>
        <div class="content" id="agent-view" style="display:none;">
            <div id="agent-view-header" style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem;">
                <h1 style="font-size:1.75rem; font-weight:600;">Agent View</h1>
                <span id="agent-stream-status" style="font-size:0.8rem; color:#999;">disconnected</span>
            </div>
            <pre id="agent-view-content" style="background:#1a1a2e; color:#e0e0e0; padding:1.25rem; border-radius:8px; font-size:0.82rem; line-height:1.5; overflow-x:auto; white-space:pre-wrap; max-height:calc(100vh - 10rem); overflow-y:auto;"></pre>
        </div>
        {% if agent_view_stream %}
        <button id="agent-view-toggle" onclick="toggleAgentView()" title="Toggle Agent View"
            style="position:fixed; top:1rem; right:1.25rem; z-index:100; background:#1a1a2e; color:#ccc; border:1px solid #444; border-radius:6px; padding:0.4rem 0.8rem; font-size:0.8rem; cursor:pointer; transition: background 0.15s, color 0.15s;">
            Agent View
        </button>
        <script>
        (function() {
            var streamUrl = '{{ agent_view_stream }}';
            var es = null;
            var agentActive = false;
            var lastState = null;

            function renderAgentState(data) {
                var el = document.getElementById('agent-view-content');
                if (!el) return;
                try {
                    el.textContent = JSON.stringify(data, null, 2);
                } catch(e) {
                    el.textContent = String(data);
                }
            }

            function connectStream() {
                if (es) return;
                es = new EventSource(streamUrl);
                var status = document.getElementById('agent-stream-status');
                es.onopen = function() { if (status) status.textContent = 'connected'; status.style.color = '#4a4'; };
                es.onmessage = function(e) {
                    try {
                        var evt = JSON.parse(e.data);
                        lastState = evt.page || evt;
                        if (agentActive) renderAgentState(lastState);
                    } catch(err) {}
                };
                es.onerror = function() { if (status) status.textContent = 'disconnected'; status.style.color = '#999'; };
            }

            function disconnectStream() {
                if (es) { es.close(); es = null; }
                var status = document.getElementById('agent-stream-status');
                if (status) { status.textContent = 'disconnected'; status.style.color = '#999'; }
            }

            window.toggleAgentView = function() {
                agentActive = !agentActive;
                var human = document.getElementById('human-view');
                var agent = document.getElementById('agent-view');
                var btn = document.getElementById('agent-view-toggle');
                if (agentActive) {
                    human.style.display = 'none';
                    agent.style.display = 'block';
                    btn.style.background = '#4a9eff';
                    btn.style.color = '#fff';
                    btn.style.borderColor = '#4a9eff';
                    connectStream();
                    if (lastState) renderAgentState(lastState);
                } else {
                    human.style.display = 'block';
                    agent.style.display = 'none';
                    btn.style.background = '#1a1a2e';
                    btn.style.color = '#ccc';
                    btn.style.borderColor = '#444';
                    disconnectStream();
                }
            };
        })();
        </script>
        {% endif %}
    </div>
</body>
</html>
