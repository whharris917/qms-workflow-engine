{% extends "base.html" %}
{% block title %}Workshop — API Design{% endblock %}
{% block content %}
<style>
  .api-ws-header { margin-bottom: 1rem; }
  .api-ws-header h1 { margin-bottom: 0.25rem; }
  .api-ws-header p { color: #666; line-height: 1.5; margin: 0; }

  .api-ws-grid {
    display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 1px;
    border: 1px solid #ccc; border-radius: 8px; overflow: hidden;
    height: calc(100vh - 140px); min-height: 400px;
    background: #ccc;
  }

  .api-ws-pane {
    display: flex; flex-direction: column; overflow: hidden;
    background: #fff;
  }
  .api-ws-pane-header {
    padding: 0.5rem 0.75rem; background: #f5f5f5; border-bottom: 1px solid #ddd;
    font-size: 0.8rem; font-weight: 600; color: #555; flex-shrink: 0;
  }
  .api-ws-pane-body { flex: 1; overflow: auto; position: relative; }

  /* JSON viewer */
  .api-ws-json {
    margin: 0; padding: 0.75rem; font-family: 'Consolas', 'Monaco', monospace;
    font-size: 0.8rem; line-height: 1.5; white-space: pre; tab-size: 2;
    cursor: default;
  }

  /* JSON syntax spans */
  .j-key { color: #881391; }
  .j-str { color: #1a7f37; }
  .j-num { color: #0550ae; }
  .j-bool { color: #cf222e; }
  .j-null { color: #888; }
  .j-brace { color: #666; }

  /* Hoverable entries */
  .j-entry { border-radius: 3px; transition: background 0.1s; }
  .j-entry.j-hl { background: #fff3cd; }
  .j-entry.j-hl > .j-key { text-decoration: underline; text-underline-offset: 2px; }

  /* Rendered output */
  .api-ws-render { padding: 1rem; }

  /* Highlight on rendered side */
  .r-node { border-radius: 4px; transition: background 0.1s, outline-color 0.1s; }
  .r-node.r-hl { background: #fff3cd; outline: 2px solid #ffc107; }
</style>

<div class="api-ws-header">
  <h1>API Design Workshop</h1>
  <p>JSON → HTML projection with cross-highlighting. Top row: full state. Bottom row: focused view.</p>
</div>

<div class="api-ws-grid">
  <div class="api-ws-pane">
    <div class="api-ws-pane-header">Full JSON</div>
    <div class="api-ws-pane-body">
      <div class="api-ws-json" id="json-full"></div>
    </div>
  </div>
  <div class="api-ws-pane">
    <div class="api-ws-pane-header">Full Rendered</div>
    <div class="api-ws-pane-body">
      <div class="api-ws-render" id="render-full"></div>
    </div>
  </div>
  <div class="api-ws-pane">
    <div class="api-ws-pane-header">Focused JSON</div>
    <div class="api-ws-pane-body">
      <div class="api-ws-json" id="json-focused"></div>
    </div>
  </div>
  <div class="api-ws-pane">
    <div class="api-ws-pane-header">Focused Rendered</div>
    <div class="api-ws-pane-body">
      <div class="api-ws-render" id="render-focused"></div>
    </div>
  </div>
</div>

<script src="/static/workshop/api.js"></script>
{% endblock %}
