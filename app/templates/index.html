<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Agent Portal</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <h1>Agent Portal</h1>

    <h2>New Page</h2>
    <ul>
        {% for seed in seeds %}
        <li>
            <form method="POST" action="/instances" style="display: inline;">
                <input type="hidden" name="type" value="{{ seed.key }}">
                <button type="submit">+ {{ seed.label }}</button>
            </form>
        </li>
        {% endfor %}
    </ul>

    <h2>Your Pages</h2>
    {% if instances %}
    <ul>
        {% for inst in instances %}
        <li>
            <a href="/pages/{{ inst.id }}">{{ inst.id }}</a>
            <span style="color: #999; font-size: 0.9em;">{{ inst.label }}</span>
            <form method="POST" action="/instances/{{ inst.id }}/delete" style="display: inline; margin-left: 8px;">
                <button type="submit" style="font-size: 0.8em; color: #c00; cursor: pointer;">Delete</button>
            </form>
        </li>
        {% endfor %}
    </ul>
    {% else %}
    <p>No pages yet. Create one above.</p>
    {% endif %}
</body>
</html>
